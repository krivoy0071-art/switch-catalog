овой серии легендарного beat-'em-up горячие герои Кунио и Рики попадают в плен, предоставляя своим жестоким подругам Киоко и Мисако вершить возмездие. По мере того как вы проталкиваете и пробиваете путь через город, в одиночку или с другом в режиме совместной игры, вы приобретаете новые навыки, поглощаете бонусы, пополняете арсенал оружия и овладеваете комбо, приемами с бросками и специальными атаками, которые заставят плохих парней молить о пощаде — все в возмутительном 16-битном стиле! Потрясающий экшен дополнен ответвлениями манга-историй, врезками аниме и эпическим саундтреком в стиле синти-поп. Грохот старой школы для нового поколения! Ключевые свойства - Отвязный экшен в жанре beat-'em-up для одного или двух игроков! - Великолепные врезки аниме и манга! - Крутой саундтрек в стиле", "dl": "ru", "cat": "Файтинг|Аркада|Мультиплеер|Приключения", "pl": "2", "ru": true, "rel": "2019", "rt": "16", "nc": ""}, {"id": "010056500AD50000", "n": "Rogue Legacy", "t": "Rogue Legacy", "r": "", "gb": 0.2, "dlc": 0, "img": "../covers/010056500AD50000.jpg", "d": "Rogue Legacy представляет собой генеалогическую игру в жанре rogue-\"LITE\", в которой любой может стать героем. Каждый раз, когда вы погибаете, на ваше место встает ваш ребенок. Каждый ребенок уникален. Один может быть дальтоником, другой — страдать от головокружения, а третий может даже быть карликом. Но это нормально, ведь идеальных людей не бывает, и добиться успеха может любой. Но вам придется стать невероятно хорошим, так как эта игра СЛОЖНАЯ. К счастью, каждый раз, когда вы погибаете, все собранное вами золото можно использовать для улучшения вашего имения, благодаря чему ваш ребенок получает точку опоры в жизни и еще один шанс одолеть зло.", "dl": "ru", "cat": "Экшн|Платформер|Ролевая игра|Приключения", "pl": "1", "ru": true, "rel": "2018", "rt": "16", "nc": ""}, {"id": "01007DA0134C0000", "n": "Rogue Legacy 2", "t": "Rogue Legacy 2", "r": "", "gb": 1.2, "dlc": 0, "img": "../covers/01007DA0134C0000.jpg", "d": "Rogue Legacy 2 — игра в жанре генеалогической rogue-LITE. А это значит, что при всех фишках обычного рогалика (или rogue-like) у вас остаются постоянные обновления и наследнички. В этой игре выбирают и детей, и родителей! Спускайте наследство и отстраивайте семейное поместье, чтобы дети начинали не с чистого листа. Каждый ребёнок уникален, имеет свои черты и способности. Одна ваша дочь может быть вампиром-следопыткой, а другая — кулинаркой и к тому же вегетарианкой. Rogue Legacy 2 даёт возможность играть в своём темпе: поднажмите и прорубайтесь в самую глубину процедурно генерируемого мира или развивайте персонажа, пока не почувствуете, что готовы к более серьёзным испытаниям. ЧТО НОВОГО В ROGUE LEGACY 2 Каждое приключение уникально Новые монстры, западни и планы всякий раз, когда вы вступаете в Королевство. Это мир, в котором успех сулит не память, а импровизация. Невыносимо новые класс", "dl": "ru", "cat": "Экшн|Платформер|Ролевая игра|Приключения", "pl": "1", "ru": true, "rel": "2022", "rt": "16", "nc": ""}, {"id": "010081C0191D8000", "n": "Rune Factory 3 Special", "t": "Rune Factory 3 Special", "r": "Rune Factory 3 Special (On-Card+Patch DLC EU)", "gb": 2.6, "dlc": 7, "img": "../covers/010081C0191D8000.jpg", "d": "Поселитесь в мирном фэнтезийном городке под видом молодого искателя приключений, в прошлом которого кроется чудовищная тайна, в игре Rune Factory 3, обновлённой для современного поколения игроков на Nintendo Switch™. Совершенно новые возможности Rune Factory 3 Special включают режим молодожёнов, отдельные приключения, открывающиеся после женитьбы на каждой из 11 девушек, а также адский уровень сложности, который будет нелегко пройти даже опытным игрокам! Хоть вы новичок серии, хоть ветеран, возвращающийся после долгого отсутствия, погрузитесь в незабываемую интригу Rune Factory 3 с улучшенной графикой и переработанными 3D-моделями персонажей. ■Приключение в двух мирах Действуйте от имени Мики, молодого человека с амнезией и таинственной способностью превращаться в похожее на барана чудовище, который ищет способ примирить людей и монстров. ■Захватывающие RPG-бои Вооружайтесь мечами, копья", "dl": "ru", "cat": "Ролевая игра|Симулятор|Экшн", "pl": "1", "ru": false, "rel": "2023", "rt": "16", "nc": ""}, {"id": "010051D00E3A4000", "n": "Rune Factory 4 Special", "t": "Rune Factory 4 Special", "r": "", "gb": 5.2, "dlc": 0, "img": "../covers/010051D00E3A4000.jpg", "d": "Welcome to Selphia, a region ruled by the Native Dragon Ventuswill...and you! Start an exciting new life in the village and embark on a grand adventure! Features: -Grow crops, raise monsters, catch fish, cook up tasty dishes, and craft powerful equipment. Live your life however you choose! -Become friends (or more than friends) with a charming and interactive cast of characters, and breathe life into the village with seasonal festivals and competitions. -Play through a special story alongside your spouse in the brand-new Newlywed Mode, and fall in love with your favorites all over again! -If you're a Rune Factory 4 fanatic, challenge yourself with a new difficulty mode. -Enjoy new in-game cutscenes, colorful CG illustrations, and an updated opening sequence.", "dl": "en", "cat": "RPG|Simulation|Action", "pl": "1", "ru": false, "rel": "2020", "rt": "13", "nc": ""}, {"id": "01002F7013224000", "n": "Rune Factory 5", "t": "Rune Factory 5", "r": "", "gb": 6.0, "dlc": 10, "img": "../covers/01002F7013224000.jpg", "d": "In the sleepy border town of Rigbarth, mysterious events are unfolding, affecting the runes that govern the balance between humanity and nature... As the newest ranger for the peacekeeping organization, SEED, protect the frontier town by rounding up rowdy monsters with your official SEED-issued spell seal. When not on a mission, work with the people of Rigbarth to help the town flourish through farming, festivals, and friendships! As the balance of peace begins to shift, however, it comes time to prove yourself. Team up with townsfolk and embark on ersary Collection с 12 играми, в числе которых Street Fighter I, II, III и Street Fighter Alpha. Впервые на консолях: идеальный баланс, сетевой аркадный режим и все то, за что мы любим Street Fighter. Для фанатов доступен музей Street Fighter, где можно проследить за историей серии. Оцените персонажей Street Fighter, спрайты с анимацией и загляните в дизайн-документы франшизы, на которой выросло не одно поколение воинов!", "dl": "ru", "cat": "Файтинг", "pl": "2", "ru": false, "rel": "2018", "rt": "12", "nc": ""}, {"id": "0100429011144000", "n": "Subnautica", "t": "Subnautica", "r": "", "gb": 6.0, "dlc": 0, "img": "../covers/0100429011144000.jpg", "d": "Окунитесь в огромный подводный мир Вы потерпели крушение в чужом океаническом мире, где единственный путь ведёт вниз. Океаны Subnautica разнятся от залитых солнцем коралловых рифов до коварных глубоководных расщелин, лавовых полей и биолюминесцентных подводных рек. Контролируйте свой запас кислорода, пока исследуете заросли водорослей, плато, рифы и извилистые пещерные системы. Воды кишат живностью: некоторые из них полезны, многие — опасны. Собирайте, создавайте и выживайте После аварийной посадки в спасательной капсуле начинается гонка со временем на поиски воды, еды и создание снаряжения для выживания. Собирайте ресурсы в окружающем Вас океане. Создавайте ножи, снаряжение для ныряния и персональный водный транспорт. Отправляйтесь глубже и дальше в поисках более редких ресурсов, которые позволят Вам создавать более продвинутые предметы. Сооружайте подводные жилища Стройте базы на морск", "dl": "ru", "cat": "Приключения", "pl": "1", "ru": true, "rel": "2021", "rt": "6", "nc": ""}, {"id": "010014C011146000", "n": "Subnautica Below Zero", "t": "Subnautica: Below Zero", "r": "", "gb": 7.1, "dlc": 0, "img": "../covers/010014C011146000.jpg", "d": "Below Zero — это подводное приключение в инопланетном океаническом мире. Встречайте новую главу во вселенной Subnautica, разработанную студией Unknown Worlds. Вернуться на плане .jpg", "d": "Узнайте историю появления Высшего меча в The Legend of Zelda: Skyward Sword HD для Nintendo Switch. Это классическое приключение, которое изначально вышло в 2011 году на Wii, было оптимизировано для Nintendo Switch и получило более плавное управление движением, а также дополнительное управление кнопками. Вы познакомитесь с самыми ранними событиями в хронологии The Legend of Zelda. Линку предстоит спуститься из заоблачного мира в пугающую неизвестность, чтобы отыскать подругу детства Зельду. В этом грандиозном приключении, вооружившись мечом и щитом, Линк будет сражаться с могущественными врагами, разгадывать каверзные головоломки и парить в небесах на огромном небокрыле.", "dl": "ru", "cat": "Приключения|Экшн", "pl": "1", "ru": true, "rel": "2021", "rt": "12", "nc": ""}, {"id": "0100F2C0115B6000", "n": "The Legend of Zelda Tears of the Kingdom", "t": "The Legend of Zelda™: Tears of the Kingdom", "r": "The Legend of Zelda: Tears of the Kingdom", "gb": 16.3, "dlc": 0, "img": "../covers/0100F2C0115B6000.jpg", "d": "Embark on a perilous quest to find the missing princess and unravel the truth behind a cataclysmic event that has sent the kingdom into turmoil. You’ll decide your own path through the sprawling landscapes of Hyrule and the mysterious islands floating in the vast skies above.", "dl": "ru", "cat": "Экшн|Приключения", "pl": "1", "ru": true, "rel": "2023", "rt": "12", "nc": ""}, {"id": "0100626011656000", "n": "The Outer Worlds", "t": "The Outer Worlds", "r": "", "gb": 21.9, "dlc": 2, "img": "../covers/0100626011656000.jpg", "d": "В The Outer Worlds вы пробуждаетесь после гибернации на корабле поселенцев, пропавшем по пути к Альциону — самой дальней земной колонии на краю галактики. Вы оказываетесь в центре масштабного заговора, который угрожает существованию всей колонии. Созданный вами персонаж сможет повлиять на ход этой истории, исследуя глубины космоса и встречая многочисленные группировки, которые сражаются за власть. В системе уравнений корпоративной колонии возникает новая непредсказуемая переменная — это вы. Особенности: • Ролевая игра, где игрок определяет развитие сюжета: студия Obsidian верна своим традициям, поэтому события в The Outer Worlds зависят от вас. Ваши решения влияют не только на сюжет, но и на развитие персонажа, судьбы спутников и финал игры. • Хорошие новости — вы не безупречны: в The Outer Worlds действует уникальная система недостатков. Они формируют характер любого яркого героя. Игра ", "dl": "ru", "cat": "Ролевая игра|Шутер от первого лица|Экшн|Приключения", "pl": "1", "ru": true, "rel": "2020", "rt": "18", "nc": ""}, {"id": "0100D4E01E49E000", "n": "The Thing Remastered", "t": "The Thing: Remastered", "r": "", "gb": 4.9, "dlc": 0, "img": "../covers/0100D4E01E49E000.jpg", "d": "The 2002 third-person survival horror shooter that serves as a sequel to the genre-defining 1982 film is back, remastered by Nightdive Studios to bring this innovative blend of fast paced squad action meets survival horror to the modern era. Where the movie ended, the true terror begins. You are Cpt J.F. Blake, leader of a U.S. Special Forces rescue team sent to investigate the blood-curdling events and enigmatic deaths of the American scientific team that transpired at the Outpost 31 research facility located in the frozen wastelands of Antarctica. Within these inhospitable surroundings your team encounters a strange shape-shifting alien life-form that assumes the appearance of people that it kills. Trapped by the elements and infected by this horrific entity, using all your team members is critical if you hope to accomplish your objectives, let alone survive. If you only knew which one", "dl": "en", "cat": "Action|Shooter", "pl": "1", "ru": false, "rel": "2024", "rt": "17", "nc": ""}, {"id": "010010901AFB0000", "n": "The Walking Dead Destinies", "t": "The Walking Dead: Destinies", "r": "", "gb": 7.2, "dlc": 0, "img": "../covers/010010901AFB0000.jpg", "d": "Начните путешествие в роли Рика Граймса, что проснулся один в больнице в окружении мертвецов. Собирайте союзников и прокладывайте путь сквозь засилье ходячих в культовых локациях сериала The Walking Dead, среди которых Атланта, ферма семьи Гринов, тюрьма и Вудбери. В переломные моменты выбора вы навсегда будете определять судьбу команды из персонажей сериала. Герои и злодеи, живые и мертвые — только вам решать, оставаться на пути истории или проложить свой собственный в мире The Walking Dead от AMC. • Вопреки судьбе: меняйте историю The Walking Dead от AMC, проложив собственный путь событиями сериала. Спасите злодея, убейте героя... и живите с последствиями. • Рубите, бейте и стреляйте по мертвецам: истребляйте орды ходячих в экшене от третьего лица с помощью разнообразного оружия ближнего и дальнего боя, в том числе бит, катан, револьверов, дробовиков и арбалетов. • Играйте за 13 культо", "dl": "ru", "cat": "Экшн|Приключения", "pl": "1", "ru": false, "rel": "2023", "rt": "18", "nc": ""}, {"id": "010029200B6AA000", "n": "The Walking Dead for Nintendo Switch", "t": "The Walking Dead: The Complete First Season", "r": "", "gb": 31.3, "dlc": 3, "img": "../covers/010029200B6AA000.jpg", "d": "Play as Lee Everett, a convicted criminal, who has been given a second chance at life in a world devastated by the undead. With corpses returning to life and survivors stopping at nothing to maintain their own safety, protecting an orphaned girl named Clementine may offer him redemption in a world gone to hell. • All five award-winning episodes plus special episode ‘400 Days’ • Based on Robert Kirkman’s award-winning comic book series • Choice matters: your decisions change the story around you", "dl": "en", "cat": "Adventure", "pl": "1", "ru": false, "rel": "2018", "rt": "17", "nc": ""}, {"id": "01003D100E9C6000", "n": "The Witcher 3 Wild Hunt - Complete Edition (EU)", "t": "The Witcher 3: Wild Hunt — Complete Edition", "r": "", "gb": 41.4, "dlc": 1, "img": "../covers/01003D100E9C6000.jpg", "d": "ABOUT THE GAME You are Geralt of Rivia, mercenary monster slayer. Before you stands a war-torn, monster-infested continent you can explore at will. Your current contract? Tracking down Ciri — the Child of Prophecy, a living weapon that can alter the shape of the world. The Complete Edition contains the base game, offering a huge, over 100-hour long, open-world adventure, as well as both of its massive story expansions: Hearts of Stone & Blood and Wine worth an extra 50 hours of gameplay! It also comes with all additional content released for the game, alongside new items including swords, armor, and alternate outfits inspired by The Witcher Netflix series — and more! PLAY AS A HIGHLY TRAINED MONSTER SLAYER FOR HIRE Trained from early childhood and mutated to gain superhuman skills, strength, and reflexes, witchers are a counterbalance to the monster-infested world in which they live. • G", "dl": "en", "cat": "RPG", "pl": "1", "ru": true, "rel": "2019", "rt": "18", "nc": ""}, {"id": "0100612015862000", "n": "Thea 2 The Shattering", "t": "Thea 2: The Shattering", "r": "", "gb": 2.6, "dlc": 0, "img": "../covers/0100612015862000.jpg", "d": "Thea 2: The Shattering is a follow-up to the successful Thea: The Awakening, which brings the idea of innovative genre hybrid, with elements of turn-based, 4X strategy, survival, RPG and a card game, to entirely new and thoroughly polished level. The player takes on the role of a deity from the Slavic mythology-inspired pantheon and as such, controls the fate of a small flock of believers struggling for survival. This goal can be achieved in many ways, from diplomacy to war, from exploring to conquering, but any playstyle will surely lead to completely unique adventures thanks to the procedurally generated environments. Rich options, from crafting to town-building system, as well as the co-op multiplayer gameplay, make Thea 2 an ideal choice for tactically minded players, who are up for a challenge.", "dl": "ru", "cat": "Ролевая игра|Стратегия|Мультиплеер", "pl": "1", "ru": false, "rel": "2021", "rt": "12", "nc": ""}, {"id": "010075900CD1C000", "n": "Thea The Awakening", "t": "Thea: The Awakening", "r": "", "gb": 1.7, "dlc": 0, "img": "../covers/010075900CD1C000.jpg", "d": "Thea: The Awakening – это походовая стратегическая игра на выживание, основанная на славянской мифологии. Ее действие разворачивается после всемирной катастрофы, когда все живое поглотила Тьма. Мир полон тварей вроде кровососов-стрыг и Бабы-яги, но не осталось ни героев, ни охотников на чудовищ, ни великих армий, чтобы сразиться с ними. Лишь горстка отчаявшихся уцелевших, из последних сил стремящихся выжить. Вы – единственная оставшаяся у них надежда! Игра сочетает в себе походовый стратегический игровой процесс с напряженными захватывающими приключениям в rogue-стиле. Вас ждет увлекательный сюжет, который раскроется в игровых событиях, и уникальная система боя, основанная на карточной игре.", "dl": "ru", "cat": "Стратегия|Настольная игра|Ролевая игра|Приключения", "pl": "1", "ru": true, "rel": "2019", "rt": "16", "nc": ""}, {"id": "0100066004D68000", "n": "This is the Police 1-2", "t": "This Is the Police", "r": "", "gb": 4.1, "dlc": 0, "img": "../covers/0100066004D68000.jpg", "d": "Окунитесь в мрачный рассказ о преступности и коррупции. Возьмите на себя роль сурового шефа полиции Джека Бойда и столкнитесь лицом к лицу с уродливой подноготной Фрибурга, города, затянутого в водовород упадка. Что ждет Джека: сытая пенсия, нищета… или что-то пострашнее?", "dl": "ru", "cat": "Стратегия|Приключения", "pl": "1", "ru": true, "rel": "2017", "rt": "16", "nc": ""}, {"id": "0100A8700BC2A000", "n": "This War of Mine", "t": "This War of Mine: Complete Edition", "r": "", "gb": 4.0, "dlc": 0, "img": "../covers/0100A8700BC2A000.jpg", "d": "В «This War of Mine» вы играете не за солдата элитных войск, а за группу мирных жителей, пытающихся выжить в осажденном городе, испытывая нехватку еды, лекарств и постоянную опасность со стороны снайперов и мародеров. Игра дает возможность прочувствовать войну с абсолютно новой перспективы. Игровой процесс в «This War of Mine» зависит от смены дней и ночей. Снайперы не позволяют вам покинуть убежище днем, поэтому вам приходится заниматься другими делами — отстраивать свое укрытие, торговать, заботиться о выживших. Ночью, выбрав одну из уникальных локаций, вы можете отправить кого-нибудь на поиски провизии, которая поможет вам остаться в живых. Принимайте решения, руководствуясь своими моральными принципами. Попробуйте сберечь всех своих людей или пожертвуйте кем-нибудь, чтобы повысить шансы остальных. Во время войны нет хороших или плохих решений, есть только задача — выжить. Чем скорее ", "dl": "ru", "cat": "Стратегия|Симулятор|Экшн", "pl": "1", "ru": true, "rel": "2018", "rt": "18", "nc": ""}, {"id": "010032F01F488000", "n": "Thronefall", "t": "Thronefall", "r": "", "gb": 0.8, "dlc": 0, "img": "../covers/010032F01F488000.jpg", "d": "Saddle the horses! See your kingdom come to life, fight gripping battles to defend it and still be done in time for lunch. With Thronefall we tried to strip a classic strategy game from all unnecessary complexity, combining it with some healthy hack and slay. Build up your base during the day, defend it til your last breath at night. Will you be able to strike the right balance between economy and defence? Do you need more archers, thicker walls or an additional mill? Will you keep the enemies at bay with your longbow or charge your horse right into them? It's going to be a tough night, but nothing beats seeing the sun rise above your little kingdom to live another day.", "dl": "en", "cat": "Strategy|Action|Fighting|Arcade", "pl": "1", "ru": true, "rel": "2024", "rt": "10", "nc": ""}, {"id": "0100FE801185E000", "n": "Titan Glory", "t": "Titan Glory", "r": "", "gb": 5.1, "dlc": 0, "img": "../covers/0100FE801185E000.jpg", "d": "«Рассвет титанов» — это научно-фантастическая игра о сражениях роботов, в которой вас ждут богатый выбор мехов и вооружения, разнообразные реж im the prize first. Nothing is easy in paradise. TURBO TIME, WALL-RUNNING, DASHING AND GRAPPLING HOOKS, OH MY Turbo Overkill takes over-the-top to never-before-reached heights. Activate Turbo Time(™), a new form of slow motion with a twist. Build incredible speed by wall-running and dashing. Slide on your chainsaw leg, eviscerating foes and opening up bosses for critical d", "dl": "en", "cat": "First-Person Shooter|Shooter|Action", "pl": "1", "ru": true, "rel": "2025", "rt": "17", "nc": ""}, {"id": "0100D4A012FF2000", "n": "Two Point Campus", "t": "Two Point Campus", "r": "", "gb": 4.5, "dlc": 5, "img": "../covers/0100D4A012FF2000.jpg", "d": "Build your university, your way! It’s time to spin academia on its head! Got a yearning for learning? Or just keen to build an educational masterpiece? Campus is jam-packed with new creative tools to help you build the university of your dreams. For the first time, build in the great outdoors as you develop your own delightfully educational campus environment, housing the top teaching facilities in the land. Whether you prefer building on simple foundations, or placing every tree, you can build the university you want. Lay down pathways with new easy-to-use tools. Plant glorious collections of outdoor flora. Place benches, fountains, sculptures, hedgerows – even picket fences. The only limit is your imagination (and your in-game bank balance). Not the usual fare But, of course, it wouldn’t be a Two Point game without a twist. Rather than typical academic fare, students in Two Point Count", "dl": "en", "cat": "Strategy|Simulation", "pl": "1", "ru": false, "rel": "2022", "rt": "13", "nc": ""}, {"id": "010031200E044000", "n": "Two Point Hospital", "t": "Two Point Hospital™", "r": "Two Point Hospital: JUMBO Edition (retail only -AT3BC)", "gb": 3.8, "dlc": 5, "img": "../covers/010031200E044000.jpg", "d": "*Бесплатный режим «Песочница: свободная игра» УЖЕ ДОСТУПЕН!* Проектируйте клиники, лечите пациентов от необычных болезней и управляйте сотрудниками, расширяя собственную сеть больниц в округе Ту-Поинт. Игра Two Point Hospital включает в себя дополнения «Бигфут» и «Остров Пебберли» Округ Ту-Поинт славится причудливыми недугами — от злокачественного просветита до кубизма, — для лечения которых требуется специальное оборудование. Оптимизируйте расположение кабинетов, обновляйте аппаратуру и обучайте сотрудников, чтобы увеличить прибыль.", "dl": "ru", "cat": "Стратегия|Симулятор", "pl": "1", "ru": true, "rel": "2020", "rt": "10", "nc": ""}, {"id": "010080B00AD66000", "n": "Undertale", "t": "Undertale", "r": "", "gb": 0.2, "dlc": 0, "img": "../covers/010080B00AD66000.jpg", "d": "UNDERTALE — это дружелюбная ролевая игра, где умирать необязательно. Танцуй со слизнем, погладь щенка, открой тайны рыцарю или круши врагов. Но хватит ли у тебя решительности, чтобы выжить?", "dl": "ru", "cat": "Ролевая игра", "pl": "1", "ru": false, "rel": "2018", "rt": "16", "nc": ""}, {"id": "0100701015846000", "n": "Unpacking", "t": "Unpacking", "r": "", "gb": 1.1, "dlc": 0, "img": "../covers/0100701015846000.jpg", "d": "Unpacking — медитативная игра, где нужно доставать вещи из коробок и размещать их в новом доме. Частично это головоломка, частично — обустройство интерьера, и вам нужно красиво и уютно обставить дом, в процессе узнавая подробности о владелице. В игре восемь переездов, и в каждом из них можно будет чуть лучше узнать невидимую незнакомку и историю её жизни. В игре: - Распакуйте дом, от одной комнаты до целого здания. - Медитативный процесс без таймеров, счётчиков и очков. - Осмотрите все уголки домов, расставляя тарелки, развешивая полотенца и заполняя книжные полки. - Узнайте о жизни незнакомки по тому, что она берёт с собой в каждый новый дом и тому, что оставляет. - Музыку для игры написал лауреат премии BAFTA и звукорежиссёр Джефф ван Дайк.", "dl": "ru", "cat": "Пазл|Симулятор|Образ жизни|Прочее", "pl": "1", "ru": true, "rel": "2021", "rt": "6", "nc": ""}, {"id": "0100E5D00CC0C000", "n": "Unravel Two", "t": "Unravel Two", "r": "", "gb": 2.8, "dlc": 0, "img": "../covers/0100E5D00CC0C000.jpg", "d": "Победитель — D.I.C.E. Премия «Семейная игра года». В Unravel Two вам предстоит создать собственного Ярни. А затем встретить других Ярни в совместной локальной или одиночной игре, подружиться и помогать друг другу. Ваше приключение начнется в холодных землях, но чем дальше, тем ярче будет мир. Погрузитесь в увлекательную историю, полную энергии, радости, вдохновения и даже монстров. Подходите к проблемам с позитивом и смелостью, чтобы разбудить мир вокруг и познать настоящую дружбу. Поддержка режимов - настольный режим - режим ТВ - портативный режим (только в одиночной игре)", "dl": "ru", "cat": "Платформер|Приключения|Пазл", "pl": "2", "ru": false, "rel": "2019", "rt": "6", "nc": ""}, {"id": "010082400BCC6000", "n": "Untitled Goose Game", "t": "Untitled Goose Game", "r": "", "gb": 1.1, "dlc": 0, "img": "../covers/010082400BCC6000.jpg", "d": "Untitled Goose Game — это эксцентричная забавная стелс-буффонада без жесткого сценария, где вы управляете гусем, тиранящим мирную деревню. Вы перемещаетесь по поселку, из частных дворов в магазины на главной улице и парки, устраивая розыгрыши, воруя шляпы и портя всем настроение. В игре вы увидите: • ужасного гуся (это вы) • поселок с людьми, которые пытаются заниматься своими делами (а вы их за это ненавидите) • отдельная кнопка для гоготания (!!!) А ТАКЖЕ: О нет! Два ужасных гуся! Теперь вы можете насладиться игрой в Untitled Goose Game с другом в новом режиме совместной игры вдвоем. Пройдите всю игру в роли двух ужасных гусей, гогоча вдвоем и совместно устраивайте розыгрыши, портя всем жизнь. • Бесплатное обновление для всех купивших Untitled Goose Game • Два игрока могут проходить всю игру • Новый гусь, новый гогот, такой же ужасный • Поддержка геймапада Joy-Con™ для каждого игрока", "dl": "ru", "cat": "Экшн|Пазл", "pl": "2", "ru": true, "rel": "2019", "rt": "6", "nc": ""}, {"id": "010099700B01A000", "n": "Valiant Hearts The Great War", "t": "Valiant Hearts: The Great War", "r": "Valiant Hearts: The Great War®", "gb": 1.3, "dlc": 0, "img": "../covers/010099700B01A000.jpg", "d": "Это история о сплетенных судьбах и несчастной любви в мире, разрываемом на части. Герои, следуя за верным псом, пытаются выжить среди ужасов войны. Выберите удобный способ управления: с помощью контроллера Joy-Con™ или сенсорного экрана. Также в комплекте: интерактивный комикс «Dogs of War» и галерея иллюстраций.", "dl": "ru", "cat": "Пазл|Приключения", "pl": "1", "ru": true, "rel": "2018", "rt": "12", "nc": ""}, {"id": "010089A0197E4000", "n": "Vampire Survivors", "t": "Vampire Survivors", "r": "", "gb": 1.4, "dlc": 8, "img": "../covers/010089A0197E4000.jpg", "d": "Пачками косить порождений ночи и дожить до рассвета! Vampire Survivors — казуальная игра в стиле готического хоррора с элементами упрощенного рогалика. Здесь каждое ваше решение может вызвать лавину последствий для орд монстров, с которыми вам предстоит столкнуться. Ад опустел, а все демоны пришли сюда, и теперь уже некуда бежать или прятаться. Вам остается только выживать, сколько сможете, но однажды смерть обязательно положит конец и вашим потугам. Собирайте золото в каждый заход, чтобы купить улучшения и помочь следующему выжившему. Инди-феномен со сверхъестественным миром, где вы и град пуль становитесь едины! Вся игра также доступна в локальном кооперативе (до 4 игроков). Советы начинающим -Можете не спешить со сбором предметов и самоцветов: они не исчезают. -Сперва добудьте два или три вида оружия для атаки, но повышайте их уровень по одному, а не все разом. -На начальном этапе раз", "dl": "ru", "cat": "Приключения|Экшн", "pl": "4", "ru": true, "rel": "2023", "rt": "12", "nc": ""}, {"id": "010049401F700000", "n": "Wandering Village", "t": "The Wandering Village", "r": "", "gb": 1.4, "dlc": 0, "img": "../covers/010049401F700000.jpg", "d": "In a world where mysterious plants are spreading all over the earth, emitting toxic spores as they grow, a small group of survivors seeks shelter on the back of a giant, wandering creature they call 'Onbu'. Become their leader, build their settlement and form a symbiotic relationship with Onbu to survive together in this hostile, yet beautiful post-apocalyptic world. Build your village A functioning village is the basis of your survival. Build your settlement and expand it over Onbu’s back. Plan production chains and optimise them to utilise the limited space as efficiently as possible. Create a society that can overcome any challenge. Live on the creature’s back Living on the back of another organism comes with its own set of challenges. Will you live in symbiosis, bond with Onbu and survive on mutual trust? Or will you become a parasite, only aiming to ensure a better life for your vil", "dl": "en", "cat": "Simulation|Strategy", "pl": "1", "ru": true, "rel": "2025", "rt": "6", "nc": ""}, {"id": "0100563010E0C000", "n": "WarioWare Get It Together", "t": "WarioWare™: Get It Together!", "r": "WarioWare: Get It Together!", "gb": 1.3, "dlc": 0, "img": "../covers/0100563010E0C000.jpg", "d": "Варио вновь решил попробовать себя в видеоиграх, и в этот раз он пускает в ход все средства! Помогите Варио и его друзьям выбраться из микромира микроигр и пройдите более 200 безумных испытаний в WarioWare: Get It Together! для Nintendo Switch. Пробуйте свои силы в более 200 молниеносных, забавных и местами безумных микроиграх — в одиночку или вместе с другом! Когда очередная безрассудная бизнес-идея с треском провалилась, Варио в своем фирменном стиле старается все исправить. Как? Играя в улетную коллекцию микроигр, конечно же! Собирайте робота, выдергивайте волосы у статуи подмышкой и так далее... WarioWare: Get It Together! — это солянка из смешных совместных микроигр.", "dl": "ru", "cat": "Экшн|Вечеринка", "pl": "4", "ru": true, "rel": "2021", "rt": "6", "nc": ""}, {"id": "010045B018EC2000", "n": "WarioWare Move It", "t": "WarioWare™: Move It!", "r": "", "gb": 1.3, "dlc": 0, "img": "../covers/010045B018EC2000.jpg", "d": "Grab a pair of Joy-Con™ controllers and get moving as you gently shake, punch, dance, wiggle, and even curtsey through over 200 lightning-fast microgames (minigames that last just a few hilarious seconds). Get into poses called “forms” including the chickenlike Ba-KAW and confident Fashionista, then get it moving! A second player can use another set of Joy-Con controllers to join the worm-pecking, sheep-twirling fun. Share the movement mayhem in the 2-4 player Party Mode! Battle it out with 2-4 players*, each with one Joy-Con controller, in the local Party Mode. Reach the goal without getting caught by Medusa or take on a dicey board game with Wario’s very own rules. Move alongside your friends in these laugh-worthy contests where everyone can get excited.", "dl": "en", "cat": "Action|Party", "pl": "4", "ru": false, "rel": "2023", "rt": "10", "nc": ""}, {"id": "01009040091E0000", "n": "Wolfenstein II The New Colossus", "t": "Wolfenstein II®: The New Colossus™", "r": "Wolfenstein® II: The New Colossus™", "gb": 22.1, "dlc": 0, "img": "../covers/01009040091E0000.jpg", "d": "ВНИМАНИЕ! Для загрузки этой программы может потребоваться карта microSD (продается отдельно). Wolfenstein II: The New Colossus, названная лучшим боевиком на The Game Awards, выходит на Nintendo Switch этим летом. Сражайтесь за свободу американского народа в разрушенном ядерным взрывом Манхэттене, на улицах оккупированного Розуэлла и на заболоченных озерах и широких бульварах Нового Орлеана. Играя за Би Джея Бласковица, узнайте потрясающую историю второй американской революции и познакомьтесь с удивительными персонажами. Заручитесь поддержкой друзей и единомышленников, чтобы положить конец зверствам фрау Энгель и её армии. Участвуйте в боевых действиях где угодно — дома или на ходу. Благодаря сенсорам движения вы не только погрузитесь в игру с головой, но и сможете устранять врагов с меткостью снайпера. ОСОБЕННОСТИ: Запоминающаяся кампания Вас ждёт проработанная до мелочей кампания, в ход", "dl": "ru", "cat": "Экшн|Шутер от первого лица", "pl": "1", "ru": true, "rel": "2018", "rt": "18", "nc": ""}, {"id": "01003BD00CAAE000", "n": "Wolfenstein Youngblood", "t": "Wolfenstein: Youngblood", "r": "Wolfenstein®: Youngblood™", "gb": 24.7, "dlc": 4, "img": "../covers/01003BD00CAAE000.jpg", "d": "Wolfenstein: Youngblood — первая игра серии, ориентированная на совместное прохождение и предоставляющая такую свободу действий. Би Джей Бласковиц исчез в захваченном нацистами Париже. Его дочери Джесс и Софи, всему научившиеся у закалённого в боях отца, отправляются на поиски. Повышайте уровень персонажа, исследуйте мир игры, открывайте новые способности, выполняйте задания, используйте новое оружие и устройства, изменяйте внешность персонажа — выработайте свой стиль игры.", "dl": "ru", "cat": "Шутер от первого лица|Экшн|Мультиплеер|Приключения", "pl": "1", "ru": true, "rel": "2019", "rt": "18", "nc": ""}, {"id": "010099F013898000", "n": "World War Z", "t": "World War Z", "r": "", "gb": 11.3, "dlc": 8, "img": "../covers/010099F013898000.jpg", "d": "World War Z, напряженный кооперативный зомби-шутер, очаровавший более 15 миллионов игроков, теперь и на Nintendo Switch! Главной особенностью World War Z, вдохновленной фильмом Paramount Pictures, является динамичный геймплей в режиме от третьего лица с ордами сотен зомби. Человечество на грани исчезновения. Апокалипсис продолжает распространяться от Нью-Йорка до Москвы и Иерусалима. Те немногие, кто выжил, объединятся, чтобы победить орду и пережить мертвецов.", "dl": "ru", "cat": "Шутер|Экшн", "pl": "1", "ru": true, "rel": "2021", "rt": "18", "nc": ""}, {"id": "0100D0B00FB74000", "n": "XCOM 2 Collection", "t": "XCOM® 2 Collection", "r": "Коллекция XCOM® 2", "gb": 24.4, "dlc": 0, "img": "../covers/0100D0B00FB74000.jpg", "d": "Коллекция XCOM® 2 включает прославленную стратегию XCOM 2, четыре набора дополнительных материалов («Боец Сопротивления», «Дети анархии», «Охотники за пришельцами», «Последний подарок Шэнь») и полномасштабное дополнение War of the Chosen. Вы можете подключить дополнительные материалы (наборы или дополнения) по своему вкусу или просто играть в основную игру. XCOM® 2: Землей правят пришельцы, которые обещают людям светлое будущее, но на самом деле преследуют свои зловещие планы. Вы — командир партизанского сопротивления, которому предстоит объединить разрозненные ячейки повстанцев по всему свету и спасти человеческую расу от вымирания вопреки яростному сопротивлению новых хозяев планеты. XCOM® 2: War of the Chosen: Вместе с этим дополнением в игре появятся новые эксклюзивные материалы: в борьбу с «Адвентом» вступают герои новых классов, которым угрожают новые могущественные враги. Вас ждут", "dl": "ru", "cat": "Стратегия|Экшн|Ролевая игра", "pl": "1", "ru": true, "rel": "2020", "rt": "18", "nc": ""}, {"id": "0100E95004038000", "n": "Xenoblade Chronicles 2 + Torna - The Golden Country + DLC", "t": "Xenoblade Chronicles™ 2", "r": "", "gb": 17.8, "dlc": 7, "img": "../covers/0100E95004038000.jpg", "d": "Исследуйте бесконечный океан облаков, где укрылись последние представители цивилизации, которые живут на огромных титанах. Познакомьтесь с Рексом и его новой подругой Пайрой, загадочным клинком, который наделяет его невероятной силой. Вместе отправляйтесь на поиски Элизиума, потерянного дома Пайры, который может стать раем для всего человечества.", "dl": "ru", "cat": "Ролевая игра", "pl": "1", "ru": false, "rel": "2017", "rt": "12", "nc": ""}, {"id": "010074F013262000", "n": "Xenoblade Chronicles 3", "t": "Xenoblade Chronicles™ 3", "r": "Xenoblade Chronicles 3", "gb": 18.8, "dlc": 4, "img": "../covers/010074F013262000.jpg", "d": "Эта игра объединит будущее Xenoblade Chronicles и Xenoblade Chronicles 2 и перенесет игроков в мир Айониос, где сосуществуют две враждующие нации. Кивз. Страна, которая сделала упор на механические технологии. Ее армия в основном состоят из боевых машин, оснащенных легким и мобильным оружием. Этими машинами и управляют солдаты. Агнус. Страна с доступом к эфиру, магической технологии. Именно на этой технологии и зиждется ее военная доктрина. Ее войска используют мобильное и автономное оружие, в основе которого лежит эфир. Шесть солдат из двух стран примут участие в этой грандиозной истории, центральной темой которой станет жизнь.", "dl": "ru", "cat": "Ролевая игра", "pl": "1", "ru": false, "rel": "2022", "rt": "12", "nc": ""}, {"id": "0100453019AA8000", "n": "Xenoblade Chronicles X Definitive Edition", "t": "Xenoblade Chronicles™ X: Definitive Edition", "r": "", "gb": 13.5, "dlc": 1, "img": "../covers/0100453019AA8000.jpg", "d": "The year is 2054. Earth has been destroyed by an intergalactic war between two alien races, and humanity is on the brink of annihilation. A small number of survivors, aboard the USS White Whale, crash land on the vast and untamed planet Mira—and now it falls to you, as a member of BLADE, to help bring humanity back from the edge of extinction…with the aid of powerful giant robots called Skells! The visually enhanced edition of this open-world RPG contains newly added story elements and more. The Xenoblade Chronicles™ X: Definitive Edition game is coming to the Nintendo Switch™ system on March 20, 2025! Take on tough foes in a robust combat system, and pilot powerful giant robots called Skells Choose from a huge variety of special attacks, skills, and classes in a combat system that’s as deep as you want it to be. Once you’ve proven yourself to BLADE, you’ll earn the right to pilot and pe", "dl": "en", "cat": "RPG|Multiplayer", "pl": "1", "ru": false, "rel": "2025", "rt": "13", "nc": ""}, {"id": "01006000040C2000", "n": "Yoshi's Crafted World", "t": "Yoshi’s Crafted World™", "r": "Yoshi's Crafted World™", "gb": 5.6, "dlc": 0, "img": "../covers/01006000040C2000.jpg", "d": "Отправляйтесь с Йоши в новое приключение на Nintendo Switch, которое перевернет с ног на голову ваше представление о сайдскроллерах! Исследуйте огромный мир, выполненный в виде миниатюрной диорамы. На этот раз у каждого уровня будет традиционная лицевая сторона, а также обратная сторона, где вас будут поджидать неожиданные сюрпризы. Много необычных препятствий возникнет у вас на пути, но меткий бросок всегда поможет открыть новый путь. Исследуйте каждый закоулок уровня, собирайте различные предметы и приведите Йоши к цели. Вы даже можете играть вместе с другом в совместном режиме — просто передайте ему контроллер Joy-Con!", "dl": "ru", "cat": "Платформер", "pl": "2", "ru": true, "rel": "2019", "rt": "6", "nc": ""}]; const CFG={"client": {"id": "cf4a9bcac", "name": "64 олед", "phone": "", "label": "64 олед", "card": 64}, "tg": "AlexXxRa", "emunand": 8, "factor": 0.93, "lang": "ru"}; const sel=new Set(); const grid=document.getElementById('grid');
