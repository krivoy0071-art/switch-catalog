<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игры Switch</title>
<style>
:root{--bg:#141518;--card:#1f2125;--line:#2e3137;--fg:#e8e8e8;--mut:#9aa0a6;--acc:#e60012;--acc2:#1e88e5;--ok:#4caf50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#141518ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{padding:10px 14px 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px}
input[type=search]{flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.lang span{padding:6px 10px;cursor:pointer;color:var(--mut);font-size:13px}.lang span.on{background:var(--acc2);color:#fff}
.note{padding:0 14px 10px;color:#ffcc80;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 14px 130px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative;transition:border-color .15s}
.card.on{border-color:var(--acc2)}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#2b2d31}
.card .noimg{width:100%;aspect-ratio:1;background:#2b2d31;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;text-align:center;padding:8px}
.card .b{padding:8px}.card .n{font-weight:600;font-size:14px;line-height:1.25}.card .t{color:var(--mut);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{color:#cfd8dc;font-size:12px;margin-top:4px}.card .chk{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:6px;background:#0008;border:2px solid #fff9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.card.on .chk{background:var(--acc2);border-color:var(--acc2)}
.card .inf{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:#000a;border:1px solid #fff6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.card .ru{position:absolute;left:8px;bottom:auto;top:38px;background:#2e7d32;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700}
.dbox img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;background:#2b2d31}.dbox h3{margin:10px 0 4px;font-size:17px}.dbox .meta{color:var(--mut);font-size:13px;margin-bottom:8px}.dbox .txt{white-space:pre-wrap;font-size:14px;line-height:1.45}
footer{position:fixed;left:0;right:0;bottom:0;background:#1a1b1f;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer .sum{flex:1;min-width:160px}button{padding:10px 14px;border-radius:8px;border:0;background:var(--acc2);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button.sec{background:#2b2d31;color:var(--fg)}textarea{width:100%;height:130px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto}.box label{display:block;color:var(--mut);font-size:13px;margin:8px 0 4px}
.box input[type=text],.box input[type=tel]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.hint{color:var(--mut);font-size:12px}
.bar{height:6px;background:#2b2d31;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
</style></head><body>
<header><div class="hrow"><h1 id="h1"></h1><input id="q" type="search"><select id="card"></select><span id="cnt" class="hint"></span><div class="lang"><span data-l="ru">RU</span><span data-l="uz">UZ</span></div></div><div class="note" id="note"></div></header>
<div class="grid" id="grid"></div>
<footer><div class="sum"><div id="sum"></div><div class="bar" id="barw" style="display:none"><i id="bar"></i></div></div><button class="sec" id="bClear" onclick="clearAll()"></button><button id="bOrder" onclick="openOrder()"></button></footer>
<div class="modal" id="dm" onclick="if(event.target===this)this.classList.remove('on')"><div class="box dbox"><div id="dmc"></div><div class="row"><button id="dmSel" onclick="dmToggle()"></button><button class="sec" onclick="document.getElementById('dm').classList.remove('on')" id="dmClose"></button></div></div></div>
<div class="modal" id="m"><div class="box"><b id="mTitle"></b>
<label id="lWho"></label><input type="text" id="who"><label id="lPhone"></label><input type="tel" id="phone">
<label id="lList"></label><textarea id="txt" readonly></textarea>
<div class="row"><button id="bTg" onclick="sendTg()"></button><button class="sec" id="bCopy" onclick="copyTxt()"></button><button class="sec" id="bClose" onclick="document.getElementById('m').classList.remove('on')"></button></div>
<div class="hint" id="mHint" style="margin-top:8px"></div></div></div>
<script>
const DATA=[{"id": "01000320000CC000", "n": "1-2-Switch", "t": "1-2-Switch™", "r": "", "gb": 1.4, "dlc": 0, "img": "../covers/01000320000CC000.jpg", "d": "Это первая видеоигра Nintendo, в которой игроки соревнуются в забавных играх и при этом смотрят в глаза друг другу, а не на экран телевизора. Устраивайте ковбойские дуэли, копируйте танцевальные движения друг друга — игры 1-2-Switch изобретательно используют многочисленные особенности Nintendo Switch и способны оживить любую вечеринку где угодно и когда угодно.", "dl": "ru", "cat": "Вечеринка", "pl": "2", "ru": true, "rel": "2017", "rt": "6", "nc": ""}, {"id": "01004890117B2000", "n": "A Short Hike", "t": "A Short Hike", "r": "", "gb": 0.4, "dlc": 0, "img": "../covers/01004890117B2000.jpg", "d": "Follow the marked trails or explore the backcountry as you make your way to the summit. Along the way, meet other hikers, discover hidden treasures, and take in the world around you. • Explore the island any way you like. Choose your own path to follow and see where it leads you. You never know what you might stumble into! • Hike at your own pace - there's no need to rush to the summit! Take your time fishing along the river banks or swimming by the lakeshore. • Collect hidden treasures to reach new heights. Try taking a dive off the mountain peaks to soar above the forests. • Chat with the other hikers you meet along your route. You might be able to help each other out! • Listen to a lush original soundtrack by Mark Sparling that progresses dynamically as you explore the wilderness.", "dl": "ru", "cat": "Приключения|Платформер", "pl": "1", "ru": false, "rel": "2020", "rt": "6", "nc": ""}, {"id": "0100300012F2A000", "n": "Advance Wars 1+2 Re-Boot Camp", "t": "Advance Wars™ 1+2: Re-Boot Camp", "r": "Advance Wars 1+2: Re-Boot Camp", "gb": 6.6, "dlc": 0, "img": "../covers/0100300012F2A000.jpg", "d": "Выход Advance Wars 1+2: Re-Boot Camp запланирован на весну 2022 г. Подробная информация будет опубликована позднее. Указанная дата выхода может быть изменена. Командуйте войсками в стратегических пошаговых битвах в роли советника по тактике в армии Оранжевой звезды. На поле боя вы будете руководить сухопутными, воздушными и морскими силами. Уничтожайте неприятельские отряды, захватывайте города и военные базы, чтобы добиться победы и мира. Постоянно следите за изменяющейся местностью и погодой и учитывайте эти факторы, отдавая приказы различным подразделениям на многочисленных картах. Этот ремейк состоит из двух кампаний, которые включают в себя события из Advance Wars и Advance Wars 2: Black Hole Rising!", "dl": "ru", "cat": "Стратегия", "pl": "4", "ru": false, "rel": "2022", "rt": "6", "nc": ""}, {"id": "010062F01F2CC000", "n": "Against the Storm", "t": "Against the Storm", "r": "", "gb": 2.0, "dlc": 1, "img": "../covers/010062F01F2CC000.jpg", "d": "You are the Viceroy – a leader charged by the Scorched Queen to reclaim the wilderness and discover lost riches for the Smoldering City, civilization's last bastion against the Blightstorm that destroyed the old world. Unlike most survival city builders where your focus is on a single city, in Against the Storm you must build a vast, prosperous network of settlements populated by diverse fantasy races, each with their own specializations and needs. The wilderness holds many hidden dangers, and never-ending storms will batter your population into submission. If your settlements should fall, then the expedition may end – but not the game. Against the Storm is a roguelite city builder, meaning you will carry forward the resources, upgrades, and experience of your past expeditions each time you set off for a new journey into the wild. MANAGE A DIVERSE POPULATION OF VILLAGERS Foxes, beavers, ", "dl": "en", "cat": "Strategy|Simulation", "pl": "1", "ru": true, "rel": "2025", "rt": "10", "nc": ""}, {"id": "010087E014832000", "n": "Airborne Kingdom", "t": "Airborne Kingdom", "r": "", "gb": 1.1, "dlc": 0, "img": "../covers/010087E014832000.jpg", "d": "Airborne Kingdom — потрясающий симулятор строительства города в небесах и управления им. Начните приключение в маленьком королевстве, увеличивайте население, исследуйте новые технологии и постройки, а также заключайте союзы с земными королевствами. Каждое приключение начинается на уникальной сгенерированной карте с тремя раздельными зонами и 12 городами. Парите в облаках, выполняя квесты, собирая и управляя ресурсами и поддерживая королевство в балансе. При том как в плане удовлетворения нужд и потребностей ваших горожан, так и буквально. В конце концов именно вам предстоит объединить все королевства в альянс, ведомый легендарным Небесным Королевством. Особенности - Придумайте и постройте свою воздушную обитель: от одного маленького пропеллера до небесной громадины. - Следите за подъемной и движущей силами, чтобы ваш город мог двигаться, а вы — исследовать. - Привлекайте иммигрантов с ни", "dl": "ru", "cat": "Симулятор|Стратегия|Приключения|Ролевая игра", "pl": "1", "ru": false, "rel": "2021", "rt": "6", "nc": ""}, {"id": "010075D00E8BA000", "n": "Alien Isolation", "t": "Alien: Isolation", "r": "", "gb": 17.7, "dlc": 0, "img": "../covers/010075D00E8BA000.jpg", "d": "Покидая Землю, Эллен Рипли обещала дочери Аманде, что вернется домой к ее 11-летию. Но этого так и не случилось. Пятнадцать лет спустя Аманде Рипли становится известно, что был найден бортовой самописец с корабля, на котором находилась ее мать. Аманда входит на борт космической станции «Севастополь», чтобы наконец раскрыть тайну исчезновения ее матери, однако она даже и не подозревает, что ее ждет. Отправляйтесь в леденящий кровь квест на выживание, пробираясь по лабиринтам станции «Севастополь». Без подготовки и с незначительной экипировкой, чтобы остаться в живых вам придется положится на смекалку и смелость. ОСНОВАНО НА ФИЛЬМЕ 1979 ГОДА «ЧУЖОЙ» Игра, которая возвращает вас к истокам научно-фантастического хоррора Ридли Скотта, используя его атмосферу, режиссуру и постановочные преимущества, чтобы добиться того же всепоглощающего ужаса. ИМПРОВИЗИРУЙТЕ И ВЫЖИВАЙТЕ Исследуйте станцию «Се", "dl": "ru", "cat": "Экшн|Приключения", "pl": "1", "ru": true, "rel": "2019", "rt": "18", "nc": ""}, {"id": "01006F8002326000", "n": "Animal Crossing New Horizons", "t": "Animal Crossing™: New Horizons", "r": "Animal Crossing: New Horizons", "gb": 10.8, "dlc": 3, "img": "../covers/01006F8002326000.jpg", "d": "Если вы устали от суеты и суматохи современной жизни, у Тома Нука есть предложение, от которого невозможно отказаться: уникальный и суперэксклюзивный пакет услуг Nook Inc. «Необитаемый остров»! • Изменяйте внешний вид персонажей, обустройте свой дом и обставьте его мебелью по своему вкусу. Создайте собственный райский уголок на острове. • Попробуйте новую систему крафтинга. Собирайте материалы и создавайте из них все необходимое: от мебели до инструментов. • Займитесь садоводством, отправляйтесь на рыбалку, общайтесь с игровыми персонажами. На этом необитаемом острове классический геймплей Animal Crossing предстанет в новом свете. • До восьми игроков могут обустроиться на острове; четыре жителя одного острова могут одновременно играть на одной консоли. • Восемь человек могут вместе играть на одном острове в сетевом или локальном мультиплеере.", "dl": "ru", "cat": "Симулятор|Мультиплеер", "pl": "4", "ru": true, "rel": "2020", "rt": "6", "nc": ""}, {"id": "0100CB9018F5A000", "n": "Another Code Recollection", "t": "Another Code™: Recollection", "r": "", "gb": 5.2, "dlc": 0, "img": "../covers/0100CB9018F5A000.jpg", "d": "Travel to the remote Blood Edward Island as Ashley, a 13 year old girl in search of her father in Another Code™: Two Memories. Ashley receives a letter from her father who she believed to be dead, setting off a chain of mysteries and visions into the past. Investigate your surroundings and locales while solving puzzles to reveal the truth in this refreshed retelling of the original Trace Memory™ game for the Nintendo DS™ system. Experience Ashley’s full story, including the events of the first game’s sequel—Another Code: R – Journey into Lost Memories. Previously unreleased in North America, this second installment completes Ashley’s intriguing tale as she journeys to Lake Juliet two years after the events of the first game to uncover the hidden truth surrounding her mother. This collection includes fully enhanced versions of both original games, featuring overhauled visuals, fully explo", "dl": "en", "cat": "Adventure|Puzzle", "pl": "1", "ru": false, "rel": "2024", "rt": "13", "nc": ""}, {"id": "0100A6B01900E000", "n": "ARK Dinosaur Discovery", "t": "ARK: Dinosaur Discovery", "r": "", "gb": 4.5, "dlc": 0, "img": "../covers/0100A6B01900E000.jpg", "d": "Присоединяйтесь к нашему компаньону с искусственным интеллектом HLN-A, который будет сопровождать игроков в увлекательном и познавательном приключении для детей ARK, в котором они узнают много нового о динозаврах: Dinosaur Discovery! Совершите познавательное путешествие сквозь эпохи всей семьей и узнайте об удивительных доисторических существах, которые стали героями ARK: Survival Evolved. Исследуйте остров с земли, с моря и с воздуха и найдите 64 динозавра, которые созданы по образу и подобию своих реальных доисторических предков. Прокатитесь на огромном тираннозавре по живописным окрестностям, пролетите над верхушками деревьев на спине птеранодона и даже проплывите по океанам верхом на древней акуле-мегалодоне! Разблокируйте Книгу Динозавров каждого существа, чтобы узнать интересные научные факты и увидеть иллюстрации, озвученные Madeleine Madden (ARK: The Animated Series, The Wheel of", "dl": "ru", "cat": "Приключения|Обучающая игра|Экшн", "pl": "1", "ru": false, "rel": "2022", "rt": "6", "nc": ""}, {"id": "010027B00E40E000", "n": "Ashen", "t": "Ashen", "r": "", "gb": 4.9, "dlc": 0, "img": "../covers/010027B00E40E000.jpg", "d": "Многопользовательская игра с пассивной кооперацией Странствуя по громадному открытому миру Ashen, вы будете время от времени встречать других игроков – примерно так же, как и в пассивно-многопользовательском Journey. Только вам решать, как себя вести, – сообща сразиться со злом, пригласить в свою группу или молча пройти мимо. Как в Souls, но с изюминкой Ashen использует систему боя с расходом выносливости и предлагает игрокам широкие просторы сурового, но манящего мира. Однако есть и своя особенность: постоянно меняющийся геймплей. Будь то неизведанные болотные топи, нехоженые фьорды или поиски добычи в старинном дворце – направление событий может в любой миг резко перемениться в зависимости от места пребывания. Это жестокий открытый мир, а вы тут просто живете. Существа и бои В Ashen нет недостатка в опасных встречах – от коварных врагов до местных злобных тварей. Исследовать окружающий", "dl": "ru", "cat": "Ролевая игра|Экшн|Приключения|Мультиплеер", "pl": "1", "ru": true, "rel": "2019", "rt": "16", "nc": ""}, {"id": "01007F600B134000", "n": "Assassin's Creed III Remastered", "t": "Assassin's Creed® III: Remastered", "r": "Assassin's Creed® III Обновленная версия", "gb": 18.5, "dlc": 2, "img": "../covers/01007F600B134000.jpg", "d": "Впервые серия Assassin's Creed® выходит на Nintendo Switch™! Сыграйте в обновленную версию Assassin's Creed III с поддержкой функция вибрации HD, сенсорным экраном и возможностями портативного режима. В комплект входят все дополнения для одиночной игры и обновленная версия Assassin's Creed Liberation. 1775 год. В американских колониях вот-вот вспыхнет восстание. Играя за ассасина Коннора, истинного сына Америки, вам предстоит сразиться за свободу целой нации.", "dl": "ru", "cat": "Экшн", "pl": "1", "ru": true, "rel": "2019", "rt": "18", "nc": ""}, {"id": "0100670014482000", "n": "Assassins Creed The Ezio Collection", "t": "ASSASSIN’S CREED® THE EZIO COLLECTION", "r": "ASSASSIN’S CREED®: ЭЦИО АУДИТОРЕ. КОЛЛЕКЦИЯ", "gb": 35.3, "dlc": 5, "img": "../covers/0100670014482000.jpg", "d": "\"Узнайте полную историю легендарного Эцио Аудиторе да Фиренце. В комплект входят 3 игры Assassin’s d-drawn 2D animation faithfully brings characters and their unique fighting styles from Avatar: The Last Airbender, The Legend of Korra, and the expanded universe to life. • A Wealth of Game Modes Includes Story Mode, Arcade Mode, Offline & Online Play, Training Mode, Spectator Mode, an Art Gallery featuring never-before-seen concept art. • Story and Arcade Mode Experience an all-new original story outlined by show creators Michael Dante DiMartino and Tim Hedrick. Shape the fate of time and space in the main story mo", "dl": "en", "cat": "Fighting|Action", "pl": "2", "ru": false, "rel": "2026", "rt": "13", "nc": ""}, {"id": "0100CD801CE5E000", "n": "Balatro", "t": "Balatro", "r": "", "gb": 0.2, "dlc": 0, "img": "../covers/0100CD801CE5E000.jpg", "d": "The poker roguelike. Balatro is a hypnotically satisfying deckbuilder where you play illegal poker hands, discover game-changing jokers, and trigger adrenaline-pumping, outrageous combos. Combine valid poker hands with unique Joker cards in order to create varied synergies and builds. Earn enough chips to beat devious blinds, all while uncovering hidden bonus hands and decks as you progress. You’re going to need every edge you can get in order to reach the boss blind, beat the final ante and secure victory.", "dl": "en", "cat": "Simulation|Strategy", "pl": "1", "ru": false, "rel": "2024", "rt": "10", "nc": ""}, {"id": "0100E870163CA000", "n": "Batman Arkham Trilogy", "t": "Batman: Arkham Asylum", "r": "", "gb": 48.6, "dlc": 0, "img": "../covers/0100E870163CA000.jpg", "d": "Face off against notorious DC Super-Villains: The Joker, Scarecrow, Poison Ivy, and more in Batman: Arkham Asylum. Experience critically acclaimed gameplay & AAA original storytelling, PLUS all DLC, in one complete package, now on Nintendo Switch™.", "dl": "en", "cat": "Action", "pl": "1", "ru": true, "rel": "2023", "rt": "13", "nc": ""}, {"id": "010076F0049A2000", "n": "Bayonetta 1+2", "t": "Bayonetta™", "r": "", "gb": 21.3, "dlc": 0, "img": "../covers/010076F0049A2000.jpg", "d": "Если вы приобретете Bayonetta в Nintendo eShop, то сможете купить Bayonetta 2 за 2500 рублей. Эта игра доступна только на английском, французском, итальянском, немецком и испанском языках. Bayonetta приходит на Nintendo Switch! В гробу, покоящемся на дне мрачного озера, пробуждается ведьма. Откройте для себя первую часть эпической игры Bayonetta для Nintendo Switch, в которую можно играть где угодно и когда угодно. Первая часть игры с незабываемой Байонеттой вышла в 2010 году и представляла собой взрывную смесь динамичного экшна и пикантного визуального стиля. С пистолетами в руках и на ногах Байонетта уничтожает противников прекрасными, но в то же время смертоносными комбо-атаками. Уклоняйтесь от вражеских атак в последнюю секунду, чтобы активировать Witch Time и остановить время. Ваши противники останутся без защиты, и вы можете обрушить на них град ударов и пуль, а потом добить их с п", "dl": "ru", "cat": "Экшн", "pl": "1", "ru": false, "rel": "2018", "rt": "18", "nc": ""}, {"id": "01004A4010FEA000", "n": "Bayonetta 3", "t": "Bayonetta™ 3", "r": "Bayonetta 3", "gb": 15.9, "dlc": 0, "img": "../covers/01004A4010FEA000.jpg", "d": "Байонетта ураганом пронесется по миру в новой умопомрачительной экшен-игре для Nintendo Switch. Новый стильный наряд и длинные косы помогут главной героине дать отпор загадочному злу, и тут весьма кстати придутся ее фирменные пистолеты и замедляющее время способность Ведьмин час. На этот раз в центре внимания Байонетты окажутся гомункулы — биологическое оружие, созданное руками человечества. Сражайтесь на улицах Токио, в горах Китая и множестве других мест! Познакомьтесь с целым шабашом Байонетт, каждая из которых сногсшибательнее предыдущей. Вы также сможете крушить врагов в роли Виолы, дерзкой юной ведьмы, которая использует в бою верный меч и капризного питомца, демона Чешира. Узнайте, какая судьба ждет Байонетту и сможет ли она помочь спасти реальность!", "dl": "ru", "cat": "Экшн", "pl": "1", "ru": true, "rel": "2022", "rt": "16", "nc": ""}, {"id": "0100CF5010FEC000", "n": "Bayonetta Origins Cereza and the Lost Demon", "t": "Bayonetta Origins: Cereza and the Lost Demon™", "r": "Bayonetta Origins: Cereza and the Lost Demon", "gb": 3.2, "dlc": 0, "img": "../covers/0100CF5010FEC000.jpg", "d": "Задолго до того, как в совершенстве овладеть темными искусствами и превратиться в Байонетту, она отправилась в судьбоносное путешествие по запретному Авалонскому лесу. Компанию ей составил Чешир — ее самый первый демон, который обитал в плюшевой игрушке. Играйте Сересой и Чеширом и исследуйте коварный лес в поисках силы, способной спасти мать Сересы.", "dl": "ru", "cat": "Экшн|Приключения", "pl": "1", "ru": true, "rel": "2023", "rt": "12", "nc": ""}, {"id": "0100620012D6E000", "n": "Big Brain Academy Brain vs Brain", "t": "Big Brain Academy™: Brain vs. Brain", "r": "Big Brain Academy: Brain vs. Brain", "gb": 0.7, "dlc": 0, "img": "../covers/0100620012D6E000.jpg", "d": "Big Brain Academy дебютирует на Nintendo Switch! Напрягайте извилины серого вещества, выполняя веселые задания. Участвуйте в тренировке по развитию мозга в пяти различных категориях: узнавание, память, анализ, счет и воображение. Добивайтесь успеха во всех категориях и развивайте мощность вашего мозга! До четырех игроков могут играть одновременно. Вы также можете помериться мощностью мозга с игроками со всего мира в Битве духов, и при этом вам даже не нужно играть в одно и то же время. Ну что, готовы напрячься и прокачать мозг различными способами — выполняя головоломные задания в одиночку или вступив в захватывающую схватку с противниками?", "dl": "ru", "cat": "Пазл|Вечеринка", "pl": "4", "ru": true, "rel": "2021", "rt": "6", "nc": ""}, {"id": "01002620102C6000", "n": "Bioshock the Collection", "t": "BioShock 2 Remastered", "r": "", "gb": 43.7, "dlc": 1, "img": "../covers/01002620102C6000.jpg", "d": "Взгляните на Восторг глазами Объекта Дельты, смертельно опасного прототипа Больших Папочек, который должен найти с ong Country Returns HD", "t": "Donkey Kong Country™ Returns HD", "r": "", "gb": 12.1, "dlc": 0, "img": "../covers/01009D901BC56000.jpg", "d": "Help Donkey Kong and Diddy Kong recover their precious banana hoard from the villainous Tiki Tak Tribe! Stomp enemies, blast through barrels, and ride rockets and mine carts (and even Rambi the rhino) in 80 levels across nine worlds. Play the game as it was first designed for the Wii™ system, or reduce the difficulty for extra hearts and other goodies to make your journey a little easier. This barrel-blasting adventure is visually enhanced in HD for the Nintendo Switch™ system and includes the extra levels from the Nintendo 3DS™ version! Team up with a friend and take on the whole game as Donkey Kong and Diddy Kong Pass a Joy-Con™ controller to a buddy and take on the Tiki Tak Tribe as DK and Diddy in two-player local play. Pelt foes with Diddy’s Peanut Popgun and hover using his Barrel Jet, and slam bad guys into submission with DK’s Ground Pound—or just Barrel Roll right through them. ", "dl": "en", "cat": "Platformer|Action", "pl": "2", "ru": false, "rel": "2025", "rt": "6", "nc": ""}, {"id": "0100C1F0051B6000", "n": "Donkey Kong Country Tropical Freeze", "t": "Donkey Kong Country™: Tropical Freeze", "r": "", "gb": 6.7, "dlc": 0, "img": "../covers/0100C1F0051B6000.jpg", "d": "Эта игра доступна только на английском, французском, итальянском, немецком и испанском языках. Donkey Kong Country: Tropical Freeze станет первой игрой франшизы на Nintendo Switch! Из-за вторжения Снежников остров Donkey Kong покрылся льдом, и теперь Конгам предстоит растопить его! Вместе с Донки Конгом, Дидди Конгом, Дикси Конгом и Крэнки Конгом плавайте, прыгайте, качайтесь на лианах и исследуйте острова, полные опасностей, спрятанных бонусов и незабываемых сражений с боссами! Используйте уникальные приемы каждого персонажа, чтобы исследовать все острова вдоль и поперек, найти особые предметы и даже потайные выходы. Только на Nintendo Switch можно играть и в роли беззаботного стиляги и серфингиста Фанки Конга! Он может выполнять двойные прыжки, бесконечные кувырки и даже бесконечные перевороты под водой! А благодаря верной доске для серфинга он не обращает внимание даже на шипы. Этому ", "dl": "ru", "cat": "Платформер", "pl": "2", "ru": false, "rel": "2018", "rt": "6", "nc": ""}, {"id": "0100416004C00000", "n": "Doom (2017)", "t": "DOOM", "r": "", "gb": 22.0, "dlc": 0, "img": "../covers/0100416004C00000.jpg", "d": "Игра DOOM, творение id Software, возвращается в новом обличье. Злобные демоны, мощные пушки, стремительное передвижение — вот основа нового DOOM. Во время сражений вам не придётся прятаться или ждать пока восстановится здоровье. Комбинируйте возможности своего арсенала и продвинутую систему рукопашного боя, уничтожайте демонов самыми затейливыми способами.", "dl": "ru", "cat": "Шутер от первого лица|Экшн", "pl": "1", "ru": true, "rel": "2017", "rt": "18", "nc": ""}, {"id": "010018900DD00000", "n": "DOOM 1-2-3", "t": "DOOM (1993)", "r": "", "gb": 10.1, "dlc": 0, "img": "../covers/010018900DD00000.jpg", "d": "Отпразднуйте 25-летие DOOM с переизданием эпохальной игры, вышедшей в 1993 году. Этот динамичный напряженный шутер не только задал тон серии, но и определил лицо целого жанра. DOOM (1993) включает: – дополнение Episode IV: Thy Flesh Consumed с 9 уровнями; – локальный смертельный бой для 4 игроков; – локальный совместный режим для 4 игроков.", "dl": "ru", "cat": "Шутер от первого лица|Экшн", "pl": "4", "ru": false, "rel": "2019", "rt": "18", "nc": ""}, {"id": "0100B1A00D8CE000", "n": "DOOM Eternal", "t": "DOOM® Eternal", "r": "", "gb": 33.0, "dlc": 5, "img": "../covers/0100B1A00D8CE000.jpg", "d": "Игра DOOM® Eternal, «один из лучших шутеров от первого лица в истории» по версии GameRevolution, выходит на Nintendo Switch. DOOM Eternal, разработанная студиями id Software и Panic Button, — прямое продолжение игры DOOM®, получившей награду «Лучший боевик» на церемонии The Game Awards 2016 года. Армии ада вторглись на Землю. Станьте Палачом Рока в эпической сюжетной кампании и уничтожьте демонов во всех измерениях, чтобы спасти человечество. Они боятся только... тебя.", "dl": "ru", "cat": "Шутер|Экшн", "pl": "1", "ru": true, "rel": "2020", "rt": "18", "nc": ""}, {"id": "01007F2019132000", "n": "Dorfromantik", "t": "Dorfromantik", "r": "", "gb": 0.5, "dlc": 0, "img": "../covers/01007F2019132000.jpg", "d": "Инди-игра Dorfromantik, получившая несколько премий, теперь доступна и на Nintendo Switch! В любой момент вы можете погрузиться в тихий, спокойный мир и отдохнуть от повседневной рутины. В то же время Dorfromantik предлагает вызов для тех, кто ищет его: чтобы побить рекорд, вам нужно тщательно спланировать и стратегически грамотно разместить свои плитки. Игровой процесс: Вы начинаете игру со стопки процедурно сгенерированных плиток. Одну за другой вы помещаете верхнюю плитку из стопки в любой из доступных слотов на поле, при необходимости поворачивая их для лучшей подгонки. Таким образом, образуются группы и комбинации ландшафтов, таких как леса, деревни или водоёмы, а вы вознаграждаетесь очками в зависимости от того, насколько хорошо плитки подходят друг к другу. По мере расширения ландшафта вы будете продвигаться в новые, красочные биомы и открывать заранее размещённые игровые объекты,", "dl": "ru", "cat": "Стратегия|Пазл|Настольная игра", "pl": "1", "ru": true, "rel": "2022", "rt": "6", "nc": ""}, {"id": "0100ED000D390000", "n": "Dr Kawashimas Brain Training", "t": "Dr Kawashima's Brain Training for Nintendo Switch", "r": "", "gb": 0.4, "dlc": 0, "img": "../covers/0100ED000D390000.jpg", "d": "Приготовьтесь напрячь свой мозг самыми разными способами в игре Dr Kawashima’s Brain Training for Nintendo Switch! Выполняйте новые упражнения, для которых вам иногда требуется инфракрасная камера движения правого Joy-Con, или тренируйтесь с уже знакомыми упражнениями из предыдущих игр Brain Training, которыми вы управляете касанием с помощью стилуса (прилагается к версии on Quest Builders™", "r": "", "gb": 2.6, "dlc": 22, "img": "../covers/010008900705C000.jpg", "d": "Эта игра доступна только на английском, французском, итальянском, немецком и испанском языках. Богиня Рубисс огласила свое решение. Исполните свое предназначение в Dragon Quest Builders для Nintendo Switch. Игра пользуется большой популярностью в Японии. Здесь сочетаются строительство, продуманный сюжет и битвы в стиле RPG. Вы станете строителем и будете создавать собственные города, защищать их от монстров и оказывать помощь горожанам. В случае успеха вы сможете отстроить мир Алефгарда, с которого начиналась эта серия игр. В отдельном режиме свободного строительства вы сможете творить без каких-либо ограничений. Только в версии для Nintendo Switch появится саблезубый тигр, который увеличит вашу скорость и наградит особыми материалами за победу над врагами.", "dl": "ru", "cat": "Экшн|Приключения", "pl": "1", "ru": false, "rel": "2018", "rt": "6", "nc": ""}, {"id": "0100D7C01F254000", "n": "Dragon Quest I and II HD-2D Remake", "t": "DRAGON QUEST I & II HD-2D Remake", "r": "", "gb": 8.3, "dlc": 6, "img": "../covers/0100D7C01F254000.jpg", "d": "- This is a Nintendo Switch™ version product. There is also a version of this game for the Nintendo Switch™ 2. Please take care not to buy the wrong version by mistake. DRAGON QUEST I & II HD-2D Remake is a stunning reimagining of the first two legendary adventures in the Erdrick trilogy, brought together in one package. (Players can play either DRAGON QUEST I or II whenever they want by selecting their preferred title on the game's start screen.) DRAGON QUEST I Story: Thanks to the heroic efforts of the legendary Erdrick, the Lord of the Underworld was defeated and peace returned to the land of Alefgard. Yet this peace was not to last, as the diabolical Dragonlord has risen and unleashed hordes of monsters on the realm once more. Now, descendant of Erdrick, it is your destiny to defeat this new evil and rescue the world from its p ay home! Choose your avatar from heroes Smolder Bravestone, Ruby Roundhouse, Mouse Finbar, and Shelly Oberon, and explore uncharted territories home to fierce predators, warring factions and devious traps that can sweep you off your feet. Survive the jungle to reach new zones including forgotten villages, icy mountains, dark caves, and fetid swamps. And always be ready for new threats, because the Jumanji drums could strike at any moment! As you level up your heroes through experience and purchase upgrades with your hard-earned loot, you’ll gain the strength to take on bosses like the cunning Smuggler and vicious Siberian Tiger. You may even discover some of Jumanji’s most secret rooms and lost treasures. The quest to recover the Jewel of Jumanji has", "dl": "en", "cat": "Multiplayer|Action|Adventure|Puzzle", "pl": "4", "ru": false, "rel": "2023", "rt": "10", "nc": ""}, {"id": "010019D010F0E000", "n": "Jump Force Deluxe Edition (EU)", "t": "JUMP FORCE - Deluxe Edition", "r": "", "gb": 11.3, "dlc": 7, "img": "../covers/010019D010F0E000.jpg", "d": "* Уведомление о прекращении продаж и закрытии онлайн-сервиса. Продажа продукта прекратится в следующий период: 8 февраля 2022 года, между 03:00 и 07:00 мск Закрытие онлайн-сервиса состоится в следующий период: 25 августа 2022 года, между 04:00 и 08:00 мск Примечание: указанные сроки могут измениться. Одновременно с закрытием онлайн-сервиса станут недоступны следующие функции: – Вход в сетевое лобби. – Сетевые события. – Клановые функции. – Просмотр доски уведомлений. – Просмотр таблиц лидеров. – Получение наград у регистратора наград. – Игровой магазин. – Премиум-магазин. * Дополнения, купленные до прекращения продаж, останутся доступны даже после закрытия онлайн-сервиса. * Подробности доступны на официальном сайте. ____________________ JUMP FORCE - Deluxe Edition: • Игра • 9 дополнительных героев + их костюмы и приёмы для вашего аватара + 4 дня раннего доступа к ним. Величайшие герои ма", "dl": "ru", "cat": "Файтинг|Экшн", "pl": "6", "ru": true, "rel": "2020", "rt": "12", "nc": ""}, {"id": "01004D300C5AE000", "n": "Kirby and the Forgotten Land", "t": "Kirby™ and the Forgotten Land", "r": "Kirby and the Forgotten Land", "gb": 5.8, "dlc": 0, "img": "../covers/01004D300C5AE000.jpg", "d": "В этой новой игре из серии Кирби вы отправляетесь в загадочный мир, где цивилизация существует в гармонии с природой. Используйте знакомые приемы Кирби: поглощайте, плюйте, прыгайте и копируйте, чтобы свободно перемещаться по уровням 3D и тщательно их исследовать. ◆ Спасите персонажей Waddle Dee Вы отправляетесь в приключения с важным заданием: спасти персонажей Waddle Dee, которых похитили загадочные враги под названием Beast Pack. На каждом уровне вам придется сражаться с членами шайки Beast Pack и преодолевать препятствия, чтобы спасти Waddle Dee и достигнуть своей цели. ◆ Используйте новые приемы Drill (бур) и Ranger (рейнджер) Вы сможете использовать не только хорошо знакомый прием Copy (копирование) в режиме 3D; в вашем распоряжении будут и совершенно новые приемы. Drill (бур) позволяет рыть под землей, а Ranger (рейнджер) — стрелять звездами. ◆ Играйте в совместном режиме для двух", "dl": "ru", "cat": "Экшн|Платформер", "pl": "2", "ru": false, "rel": "2022", "rt": "6", "nc": ""}, {"id": "01007E3006DDA000", "n": "Kirby Star Allies", "t": "Kirby™ Star Allies", "r": "", "gb": 3.9, "dlc": 0, "img": "../covers/01007E3006DDA000.jpg", "d": "Эта игра доступна только на английском, французском, итальянском, немецком и испанском языках. Розовощекий герой возвращается в HD. И в этот раз он будет не один. Кирби возвращается! В этот раз он приходит в HD-качестве на консоль Nintendo Switch! И он будет не один. Заручитесь поддержкой врагов, бросив в них сердечко, и соберите команду из четырех персонажей. Кроме того, для совместной игры к вам могут присоединиться до трех друзей! Функции - Нанимайте в помощники до трех врагов, бросая в них сердечки. - Среди способностей к копированию будут Меч, Огонь, Вода, Бомбы, Метла и другие! - Сочетайте способности к копированию с другими элементами, например ветром, водой, огнем и электричеством, затем передавайте эти способности своим помощникам, чтобы выполнять разрушительные атаки или разгадывать головоломки. - До четырех человек могут играть вместе, используя четыре контроллера Joy-Con в го", "dl": "ru", "cat": "Экшн|Платформер", "pl": "4", "ru": false, "rel": "2018", "rt": "6", "nc": ""}, {"id": "01006B601380E000", "n": "Kirby's Return to Dream Land Deluxe", "t": "Kirby’s Return to Dream Land™ Deluxe", "r": "Kirby's Return to Dream Land Deluxe", "gb": 5.0, "dlc": 0, "img": "../covers/01006B601380E000.jpg", "d": "Kirby’s Return to Dream Land Deluxe для Nintendo Switch — это улучшенная версия Kirby’s Adventure Wii! До четырех человек могут отправиться с Кирби и его друзьями в путешествие по Стране грез, чтобы помочь Маголору починить его космический корабль.", "dl": "ru", "cat": "Платформер|Мультиплеер", "pl": "4", "ru": false, "rel": "2023", "rt": "6", "nc": ""}, {"id": "0100830004FB6000", "n": "L.A. Noire", "t": "L.A. Noire", "r": "", "gb": 27.4, "dlc": 0, "img": "../covers/0100830004FB6000.jpg", "d": "ПРИМЕЧАНИЕ: для загрузки игры требуется карта памяти microSD (продается отдельно); объем необходимого свободного места указан в сведениях о программном обеспечении. Перед началом загрузки вставьте карту памяти microSD. Требуется карта со скоростью чтения не менее 60 МБ/с. Жестокий и мрачный криминальный триллер в антураже Лос-Анджелеса 1940-х. Послевоенная Америка, золотой век Голливуда. У Коула Фелпса, детектива департамента полиции Лос-Анджелеса, не бывает тихих будней: в стремительно развивающемся мегаполисе процветают коррупция и наркобизнес, то и дело совершаются убийства и ограбления. Фелпс честно служит закону и неустанно ведет борьбу с преступностью, пустившей корни даже в рядах его коллег. Поджоги и рэкет, жестокие убийства и заговоры, – распутывая зловещий клубок, со временем детектив подберется к самым тщательно оберегаемым секретам погрязшего в грехах Города ангелов... Исполь", "dl": "ru", "cat": "Экшн|Приключения", "pl": "1", "ru": true, "rel": "2017", "rt": "18", "nc": ""}, {"id": "0100F19006E04000", "n": "LEGO - The Incredibles", "t": "LEGO® The Incredibles", "r": "LEGO® Суперсемейка", "gb": 9.8, "dlc": 1, "img": "../covers/0100F19006E04000.jpg", "d": "Отправляйтесь к приключениям с семьей Parr и помогите им справиться со злоумышленниками и семейными неурядицами по сюжету фильмов \"Суперсемейка\" и \"Суперсемейка 2\" в увлекательном мире LEGO®. LEGO® Суперсемейка — это захватывающие уровни и огромный мир, в котором нашлось место и Municiberg. Применяйте свои \"суперспособности\", чтобы отдать суперзлодеев в руки правосудия. Играйте вместе с друзьями и близкими в режиме для двух игроков и собирайте потрясающие модели LEGO®!", "dl": "ru", "cat": "Экшн", "pl": "2", "ru": true, "rel": "2018", "rt": "6", "nc": ""}, {"id": "010085500130A000", "n": "LEGO City Undercover", "t": "LEGO® CITY Undercover", "r": "", "gb": 8.7, "dlc": 0, "img": "../covers/010085500130A000.jpg", "d": "Присоединяйтесь к Чейзу! В игре LEGO® CITY Undercover вы примерите на себя роль Чейза Маккейна — офицера полиции, которому поручена операция под прикрытием по поиску преступника Рекса Фьюри. В совместном режиме для двух игроков можно исследовать открытый мир мегаполиса LEGO® City, состоящего из более чем 20 кварталов, в котором вас ждут расследования, угонщики, вождение автомобилей и сотни собираемых предметов. LEGO CITY Undercover — это сочетание колоритного сюжета с фирменным юмором LEGO.", "dl": "ru", "cat": "Экшн", "pl": "2", "ru": true, "rel": "2017", "rt": "6", "nc": ""}, {"id": "010052A00B5D2000", "n": "LEGO Harry Potter Collection", "t": "LEGO® Harry Potter™ Collection", "r": "", "gb": 12.1, "dlc": 0, "img": "../covers/010052A00B5D2000.jpg", "d": "LEGO® Harry Potter™ Collection предлагает обновленные версии классических игр LEGO® Гарри Поттер™: Years 1–4 и LEGO® Гарри Поттер™: Years 5–7. В этом волшебном приключении история обширного мира Гарри Поттера рассказана неповторимым языком LEGO. Скорее отправляйтесь в захватывающее путешествие для всех возрастов, в котором вам предстоит использовать заклинания, варить зелья, решать головоломки, ходить на уроки, участвовать в дуэлях и многое другое!", "dl": "ru", "cat": "Приключения|Экшн", "pl": "2", "ru": false, "rel": "2018", "rt": "6", "nc": ""}, {"id": "010073C01AF34000", "n": "LEGO Horizon Adventures", "t": "LEGO® Horizon Adventures™", "r": "", "gb": 7.3, "dlc": 2, "img": "../covers/010073C01AF34000.jpg", "d": "Journey to a distant future, where the land is made of LEGO bricks and lush nature has reclaimed the Earth. Meet the Nora tribe who live in the settlement of Mother’s Heart, and catch your first glimpse of the incredible dinosaur-like machines that roam the forests, mountains, and deserts that stretch beyond the village walls... The LEGO adventure of a lifetime Join hunter Aloy as she battles to save Earth from an ancient digital demon, and a gang of sunworshippers who want to live in a world without shade so they can soak up the rays while everything burns. Play alone or with friends Hunt machines on your own as Aloy, or unlock colorful heroes Varl, Teersa, and Erend, and use their unique skills to defeat enemies and overcome challenges. Share the fun with another player online, or via innovative couch co-op on a single screen, so you’re always in the same world together. Customize your", "dl": "en", "cat": "Action|Adventure", "pl": "2", "ru": true, "rel": "2024", "rt": "10", "nc": ""}, {"id": "01001C100E772000", "n": "LEGO Jurassic World", "t": "LEGO® Jurassic World", "r": "", "gb": 4.7, "dlc": 0, "img": "../covers/01001C100E772000.jpg", "d": "Вас ждут захватывающие приключения в мире юрского периода вместе с игрой LEGO® Jurassic World™, которая позволяет игрокам пережить историю всех четырех фильмов. Перенесенные во вселенную LEGO, эти события теперь доступны на Nintendo Switch™!", "dl": "ru", "cat": "Экшн", "pl": "2", "ru": true, "rel": "2019", "rt": "6", "nc": ""}, {"id": "01006F600FFC8000", "n": "LEGO Marvel Super Heroes", "t": "LEGO® Marvel™ Super Heroes", "r": "", "gb": 5.9, "dlc": 0, "img": "../covers/01006F600FFC8000.jpg", "d": "LEGO® Marvel™ Super Heroes - это уникальная история, которая объединяет в себе всю вселенную Marvel. Игроки могут управлять Железным человеком, Человеком-пауком, Халком, Капитаном Америкой, Росомахой и многими другими персонажами Marvel, которые объединились, чтобы не дать Локи и другим злодеям создать супероружие для уничтожения всего мира.", "dl": "ru", "cat": "Экшн|Приключения", "pl": "2", "ru": true, "rel": "2021", "rt": "6", "nc": ""}, {"id": "010042D00D900000", "n": "LEGO Star Wars The Skywalker Saga", "t": "LEGO® Star Wars™: The Skywalker Saga", "r": "LEGO® Звездные Войны™: Скайуокер. Сага", "gb": 16.0, "dlc": 17, "img": "../covers/010042D00D900000.jpg", "d": "Переживите историю всех девяти фильмов из саги Звездные Войны в новой игре LEGO. Вас ждут веселые приключения, эксцентричный юмор и полное погружение во вселенную LEGO Звездные Войны. Хотите стать джедаем? Ситхом? Повстанцем, охотником за головами или дроидом? \"LEGO Звездные Войны: Скайуокер. Сага\" предлагает сотни игровых персонажей со всей галактики! Будь то на земле или в космосе, вы можете управлять различными транспортными средствами. Совершите прыжок в гиперпространство на \"Тысячелетнем соколе\", летайте на аэроспидере Т-47 или сражайтесь с бомбардировщиком из серии TIE, управляя X-крылом… Во вселенной LEGO Звездные Войны вас ждут незабываемые впечатления.", "dl": "ru", "cat": "Экшн", "pl": "2", "ru": true, "rel": "2022", "rt": "6", "nc": ""}, {"id": "0100838002AEA000", "n": "LEGO Worlds", "t": "LEGO® Worlds", "r": "", "gb": 3.0, "dlc": 4, "img": "../covers/0100838002AEA000.jpg", "d": "ИССЛЕДУЙТЕ. ОТКРЫВАЙТЕ. СОЗДАВАЙТЕ. ВМЕСТЕ. LEGO® Worlds — это скопление миров, сделанных полностью из блоков LEGO. Все миры можно свободно менять и населять моделями из LEGO. Создавайте всё, что придёт вам в голову: строить можно по одному блоку или при помощи масштабных ландшафтных инструментов, которые позволят вам сделать целые горные хребты или усеять мир тропическими островами. Мир можно украсить на свой вкус, поместив туда готовые постройки, а также исследовать его на вертолёте, драконе, мотоцикле или даже на горилле. По мере игры вы будете находить несметные сокровища, которые пригодятся в строительстве, а созданные вами существа будут оживать и общаться с вами и между собой. В мирах LEGO возможно всё! Для игры в LEGO® Worlds каждому игроку потребуется два контроллера Joy-Con™ (или контроллер Nintendo Switch Pro).", "dl": "ru", "cat": "Приключения|Пазл", "pl": "2", "ru": true, "rel": "2017", "rt": "6", "nc": ""}, {"id": "01009C8009026000", "n": "Limbo", "t": "LIMBO", "r": "", "gb": 0.2, "dlc": 0, "img": "../covers/01009C8009026000.jpg", "d": "Надеясь узнать о судьбе своей сестры, мальчик входит в Limbo. Limbo — это отмеченное наградами инди-приключение, полюбившееся критикам за свои захватывающие головоломки и аудиовизуальное оформление, погружающее игроков в неприветливый мир. Его мрачные локации и пугающий сюжет надолго остаются в памяти. Обладательница более 100 наград, включая: - Best Downloadable (Gameinformer) - Best Puzzle Game (Gamespot) - The Best Indie Game (Kotaku) - Digital Game of the Year (GameReactor) - Best Horror Game (IGN) - Best Visual Arts (Game Developers Choice Awards) - Technical Excellence (Independent Games Festival) - Adventure Game of the Year (D.I.C.E. Awards) - Outstanding Achievement in Sound Design (D.I.C.E. Awards)", "dl": "ru", "cat": "Приключения|Пазл|Экшн|Платформер", "pl": "1", "ru": true, "rel": "2018", "rt": "16", "nc": ""}, {"id": "01000A4019FA2000", "n": "Little Kitty Big City", "t": "Little Kitty, Big City", "r": "", "gb": 2.2, "dlc": 0, "img": "../covers/01000A4019FA2000.jpg", "d": "Will you make your way home or will you explore what the big city has to offer first? I mean, getting home is obviously your main priority. Obviously. Well, it's one of your priorities. Maybe more of a guideline... It's definitely on your To-Do list somewhere! But first? Exploration! Features: - Explore the city at your own pace in an open-world playground filled with surprises! - Make friends with a colorful cast of chatty animals. - Complete quests, help your animal friends, or cause a total ruckus. It’s up to you. - Customize your Kitty with a plethora of very adorable hats! - Take a nap in the sunshine. - Find a way home...?", "dl": "en", "cat": "Adventure|Simulation", "pl": "1", "ru": true, "rel": "2024", "rt": "6", "nc": ""}, {"id": "0100FE0014200000", "n": "Little Mouses Encyclopedia", "t": "Little Mouse's Encyclopedia", "r": "Мышкина Энциклопедия", "gb": 0.7, "dlc": 5, "img": "../covers/0100FE0014200000.jpg", "d": "Интерактивная энциклопедия Little Mouse's Encyclopedia идеально подходит для прирожденных исследователей. Гуляя по оживленным сценам, вы сами найдете животных и растения. Используя увеличительное стекло, вы можете открывать карточки, содержащие интересную информацию и рисунки. Великолепные иллюстрации Графический стиль Little Mouse's Encyclopedia вдохновлен классическими сказками и ... детскими энциклопедиями. Этот очаровательный и оригинальный стиль делает исследование еще более приятным, а различные анимации вдыхают жизнь в окружающую среду. Расслабляющая музыка Во время игры расслабтесь, слушая приятную музыку и звуки природы, такие как щебетание птиц или кваканье лягушек. Исследование мира С помощью отважной мыши вы можете исследовать территорию вокруг ее норы, пройти через лес, красться в саду и искупаться в пруду. В каждом из этих мест вас ждут уникальные виды животных и растений. ", "dl": "ru", "cat": "Приключения|Пазл|Обучающая игра|Study", "pl": "1", "ru": true, "rel": "2021", "rt": "6", "nc": ""}, {"id": "01002FC00412C000", "n": "Little Nightmares", "t": "Little Nightmares Complete Edition", "r": "", "gb": 3.0, "dlc": 2, "img": "../covers/01002FC00412C000.jpg", "d": "В НАБОР ВХОДЯТ: - Little Nightmares™ - Little Nightmares™ – «Тайны Чрева» Little Nightmares – это мрачная сказка, которая заставит вас вспомнить свои детские кошмары. Помогите Шестой выбраться из Чрева – подводного судна, полного жутких существ, ищущих, чем бы поживиться. Раскройте тайны Чрева и сыграйте за Беглеца – еще одного пленника, который пытается спастись одновременно с Шестой. Беглец попадает в ранее скрытые части Чрева, позволяя взглянуть на приключения Шестой под другим углом.", "dl": "ru", "cat": "Приключения|Пазл|Экшн", "pl": "1", "ru": true, "rel": "2018", "rt": "16", "nc": ""}, {"id": "010097100EDD6000", "n": "Little Nightmares 2", "t": "Little Nightmares II", "r": "", "gb": 6.6, "dlc": 2, "img": "../covers/010097100EDD6000.jpg", "d": "Вернитесь в мир очаровательных ужасов Little Nightmares II — приключенческой игры с нагнетанием саспенса. Вы играете за мальчика Моно, попавшего в мир, деформированный Передачей от далекой башни. Вместе с Шестой, девочкой в желтом плаще, ставшей его проводником, Моно пытается раскрыть темные тайны Маяка. В нелегком путешествии Моно и Шестая столкнутся со множеством новых угроз со стороны ужасных жителей этого мира. Осмелитесь ли вы противостоять этим новым маленьким кошмарам?", "dl": "ru", "cat": "Приключения|Пазл|Платформер", "pl": "1", "ru": true, "rel": "2021", "rt": "16", "nc": ""}, {"id": "010066101A55A000", "n": "Little Nightmares III", "t": "Little Nightmares III", "r": "", "gb": 11.0, "dlc": 6, "img": "../covers/010066101A55A000.jpg", "d": "Two young friends, lost in a frightening world not made for children. If they cannot find a way out of this Nowhere place, they’ll be condemned to a fate worse than death. FACE YOUR CHILDHOOD FEARS TOGETHER You play as Low and Alone, best friends ever since they found each other in this lonely nightmare. They each possess their own iconic item: a bow for Low and a wrench for Alone. Working together, they’ve become adept at sneaking through hidden passages,  game. But that’s not all—you can bring a friend along in the newly-added Two-Player Mode, which a", "dl": "en", "cat": "Puzzle|Action", "pl": "2", "ru": false, "rel": "2024", "rt": "6", "nc": ""}, {"id": "010060700AC50000", "n": "Marvel Ultimate Alliance 3 The Black Order + DLC", "t": "MARVEL ULTIMATE ALLIANCE 3: The Black Order", "r": "Marvel Ultimate Alliance 3: The Black Order", "gb": 17.8, "dlc": 1, "img": "../covers/010060700AC50000.jpg", "d": "После десятилетнего перерыва серия игр MARVEL ULTIMATE ALLIANCE возвращается. В этот раз она выйдет только на Nintendo Switch! Соберите собственную команду супергероев Marvel, в которую могут войти Мстители, Стражи Галактики, Люди Икс и другие герои! Объедините усилия с друзьями и предотвратите уничтожение галактики, сразившись с сумасшедшим тираном Таносом и его беспощадным Черным Орденом. В этот раз герои и злодеи будут вместе бороздить вселенную Marvel в поисках Камней Бесконечности, чтобы помешать Таносу и Черному Ордену учинить катастрофу вселенского масштаба. Во время этой опасной миссии игроки побывают в Башне Мстителей, Особняке Икс и других культовых местах. Чтобы нейтрализовать действия Таноса вам придется участвовать в самых неожиданных противостояниях с известными персонажами. Прочувствуйте экшен, переключив камеру на вид из-за плеча Heroic Camera, который позволит глубже пог", "dl": "ru", "cat": "Ролевая игра|Экшн", "pl": "4", "ru": false, "rel": "2019", "rt": "12", "nc": ""}, {"id": "0100D4900E82C000", "n": "Metro Last Light Redux", "t": "Metro 2033 Redux", "r": "", "gb": 7.6, "dlc": 0, "img": "../covers/0100D4900E82C000.jpg", "d": "В 2013 году мир был разрушен в ходе ядерной войны. Небольшая группа выживших укрылась в глубинах московского метро... Сейчас 2033 год. Вы — Артём, рождённый в последние мирные дни и воспитанный в подземельях метро. Роковое событие заставляет вас предпринять отчаянное путешествие к самому сердцу метро, чтобы предупредить остатки человечества о надвигающейся страшной угрозе. Metro 2033 Redux — это финальная версия классической игры Metro 2033, впервые выпущенная на Nintendo Switch™. Поклонники оригинальной игры увидят, что уникальный мир «Метро» преобразился — их ждут невероятное освещение, физика и динамические погодные условия. Новички же получат шанс окунуться в мир одного из лучших сюжетных боевиков в истории и пережить эпическое приключение, в котором вы будете вынуждены сражаться, скрываться, исследовать и выживать. Все улучшения игрового процесса и новые возможности игры из продолже", "dl": "ru", "cat": "Экшн|Шутер|Шутер от первого лица", "pl": "1", "ru": true, "rel": "2020", "rt": "16", "nc": ""}, {"id": "010093801237C000", "n": "Metroid Dread", "t": "Metroid™ Dread", "r": "Metroid Dread", "gb": 4.3, "dlc": 0, "img": "../covers/010093801237C000.jpg", "d": "В роли охотницы за головами Самус Аран попытайтесь выбраться с неизвестной планеты, на которой механический ужас будет преследовать вас по пятам, в игре Metroid Dread для Nintendo Switch. Сюжет игры развивается после событий Metroid Fusion; Самус прибывает на планету ZDR, чтобы изучить загадочный сигнал, отправленный в Галактическую Федерацию. Удаленная планета кишит агрессивными формами жизни и жуткими механическими угрозами. Сможет ли непревзойденная Самус справиться с ужасом, затаившимся в глубинах планеты ZDR?", "dl": "ru", "cat": "Экшн", "pl": "1", "ru": true, "rel": "2021", "rt": "12", "nc": ""}, {"id": "010019A01E2F2000", "n": "Metroid Prime 4 Beyond", "t": "Metroid Prime™ 4: Beyond", "r": "", "gb": 26.4, "dlc": 0, "img": "../covers/010019A01E2F2000.jpg", "d": "Deadly sharpshooter Sylux has finally caught up with renowned bounty hunter Samus Aran! After an unexpected accident in the wake of their clash, Samus finds herself transported to Viewros—a mysterious planet once inhabited by an ancient race. Now she must explore this planet, all while battling the strange creatures that inhabit it, to find her way home. Scan your surroundings for clues, make the most of your equipment and weapons, and use Samus’s newfound psychic abilities—and her technologically advanced bike, the Vi-O-La—to traverse and explore the environment. Operate mechanisms, control your charge beam, and more—you’ll need every tool at your disposal to survive and escape Viewros!", "dl": "en", "cat": "Action|Adventure|First-Person Shooter", "pl": "1", "ru": false, "rel": "2025", "rt": "13", "nc": ""}, {"id": "010012101468C000", "n": "Metroid Prime Remastered", "t": "Metroid Prime™ Remastered", "r": "Metroid Prime Remastered", "gb": 6.8, "dlc": 0, "img": "../covers/010012101468C000.jpg", "d": "Невозмутимая и уверенная в себе Самус в одиночку отправляется на задание... вот только она далеко не одна. Исследуйте извилистые тропы и бесконечные лабиринты манящей, но в то же время опасной планеты. Пользуйтесь морфосферой и гравилучом, чтобы добраться до недоступных областей и отыскать путь вперед. Обновленные графика и саундтрек, а также улучшенная схема управления помогут первому 3D-приключению Самус достигнуть новых высот. Используйте интуитивное управление движением, задействуйте оба джойстика, переключайтесь на классическую схему управления или остановитесь на гибридном варианте — решение за вами.", "dl": "ru", "cat": "Экшн|Шутер от первого лица", "pl": "1", "ru": false, "rel": "2023", "rt": "12", "nc": ""}, {"id": "0100646019558000", "n": "Midnight Fight Express", "t": "Midnight Fight Express", "r": "", "gb": 7.2, "dlc": 0, "img": "../covers/0100646019558000.jpg", "d": "You’re Babyface, a former member of the criminal underworld lured back into “the life” by a mysterious AI drone. Your mission against impossible odds: Fight your way across the city before sunrise, and prevent a citywide criminal takeover together. Engage in a brutal and hyper-kinetic brawling ballet, using every environmental tool and street fighting technique at your disposal. Level up your abilities to take down the mounting onslaught of bozos, cronies, and crime lords. Blockbuster Combat Tangle with wa 10069301B1D4000.jpg", "d": "Monster Hunter Stories is an RPG that takes the world of Monster Hunter and expands upon it in new and exciting ways! No longer are you hunting monsters, but raising them! In this deep story featuring heroes known as Monster Riders, you will live alongside monsters and form lifelong bonds with them. The first installment of the Monster Hunter Stories series returns, fully voiced in Japanese and English, with additional features such as a new museum mode where you can listen to music and view concept art, allowing you to dive even deeper into the world of Monster Hunter Stories. Story: As the hero of the story, you were born in a village of Riders who raise monsters for a living. You’ll overcome trials and tribulations as you grow as a Rider, and leave your village to embark on an adventure. Your destination: the world of Hunters, who make their living by hunting monsters. Although their ", "dl": "en", "cat": "RPG", "pl": "1", "ru": true, "rel": "2024", "rt": "10", "nc": ""}, {"id": "0100E21011446000", "n": "Monster Hunter Stories 2 Wings of Ruin", "t": "Monster Hunter Stories 2: Wings of Ruin", "r": "", "gb": 14.3, "dlc": 31, "img": "../covers/0100E21011446000.jpg", "d": "Во второй части пошаговой ролевой игры в мире Monster Hunter вас ждут новые захватывающие приключения! Станьте Наездником, подружитесь с дружелюбными Монстриками и вместе с ними участвуйте в эпических битвах. Вы внук или внучка легендарного наездника Рыжего. Однажды вы сталкиваетесь с виверианкой Иной, которая хранит яйцо грозного Раталоса, и теперь вам обоим предстоит обуздать первозданный хаос и разрушительную мощь легендарного зверя. Проверьте на прочность узы вашей дружбы в путешествии по изменчивому миру и узнайте, правдивы ли древние легенды.", "dl": "ru", "cat": "Ролевая игра|Приключения", "pl": "1", "ru": true, "rel": "2021", "rt": "12", "nc": ""}, {"id": "01006560184E6000", "n": "Mortal Kombat 1", "t": "Mortal Kombat™ 1", "r": "", "gb": 47.9, "dlc": 1, "img": ". ed, diorama-like environmental puzzles • Discover hidden secrets and surprises off the beaten path • Face arcane threats with optional “skip combat” accessibility • Uncover the epic and heartfelt tale of a hero who needs you • Thoughtfully designed and", "dl": "en", "cat": "Adventure|Platformer|Puzzle|Action", "pl": "1", "ru": false, "rel": "2026", "rt": "10", "nc": ""}, {"id": "010039000B68E000", "n": "My Hero One's Justice", "t": "MY HERO ONE'S JUSTICE", "r": "", "gb": 15.0, "dlc": 52, "img": "../covers/010039000B68E000.jpg", "d": "Сражайтесь за справедливость в MY HERO ONE'S JUSTICE! Герои популярной манги и аниме столкнутся на 3D арене лицом к лицу и причуда к причуде. Выберите свой путь, сражаясь за героя или злодея, и испытайте на себе легендарные моменты истории. ・Любимые фанатами герои ・Настройка внешности ・Бои по сети", "dl": "ru", "cat": "Экшн", "pl": "2", "ru": false, "rel": "2018", "rt": "12", "nc": ""}, {"id": "0100E25008E68000", "n": "My Time at Portia", "t": "My Time at Portia", "r": "", "gb": 5.1, "dlc": 4, "img": "../covers/0100E25008E68000.jpg", "d": "Восстановите мастерскую своего отца и верните ей былую славу! Выполняйте заказы, выращивайте урожай, заботьтесь о животных и заводите друзей среди своеобразных обитателей очаровательного постапокалиптического мира! Вооружитесь справочником и старым верстаком отца. Займитесь собирательством, добывайте ресурсы и создавайте предметы. Станьте лучшим мастером в Портии. Помогите местным отстроить город и раскрыть секреты, таящиеся в его глубинах. Готовьтесь... будет нелегко! Портия полна дружелюбных созданий, с которыми вам предстоит познакомиться. Заводите друзей, выполняйте просьбы, обменивайтесь подарками, ходите на свидания и дайте волю романтическим чувствам! ПОСТРОЙТЕ МАСТЕРСКУЮ: Собирайте ресурсы, делайте чудесные машины, выполняйте заказы и просьбы жителей. РАБОТАЙТЕ НА ФЕРМЕ: Выращивайте урожай и заботьтесь о животных. ЗАЙМИТЕСЬ ТВОРЧЕСТВОМ: Делайте мебель, украшения и улучшения масте", "dl": "ru", "cat": "Приключения|Ролевая игра|Симулятор", "pl": "1", "ru": false, "rel": "2019", "rt": "18", "nc": ""}, {"id": "0100B63016916000", "n": "My Time at Sandrock", "t": "My Time at Sandrock", "r": "", "gb": 6.6, "dlc": 27, "img": "../covers/0100B63016916000.jpg", "d": "300 years after the Day of Calamity destroyed most modern technologies, travel to the desert community of Sandrock and take on the role of a fledgling Builder. Use your trusty toolset to gather resources, construct machines, and turn your run-down workshop into a well-oiled production facility to save the town from the jaws of economic ruin. Features: • Discover over 60 hours of adventure with a deep story, sidequests, and rich character backstories • Engage in numerous activities and interactions with NPCs, including romance and the option to get married and have children! • Build your own workshop, craft hundreds of items, decorate your home, plant crops, cook recipes, raise livestock, and meet many animals with unique personalities • Discover treasure, relics, and resources hidden beneath the Eufaula Desert • Face a wide range of enemies in dungeons and experience a realistic and ever", "dl": "ru", "cat": "Симулятор|Ролевая игра|Приключения", "pl": "1", "ru": true, "rel": "2023", "rt": "12", "nc": ""}, {"id": "01006CF00CF60000", "n": "NARUTO", "t": "NARUTO SHIPPUDEN™: Ultimate Ninja® STORM 4 ROAD TO BORUTO", "r": "", "gb": 12.3, "dlc": 0, "img": "../covers/01006CF00CF60000.jpg", "d": "Для Nintendo Switch™ вышла новая игра из серии Ultimate Ninja Storm! В нее входят все дополнения, в том числе NEXT GENERATIONS. Вы сможете принять участие в четвертой Великой войне ниндзя и стать героем истории про Боруто Узумаки. Выбирайте одного из 124 персонажей и сражайтесь где и когда угодно!", "dl": "ru", "cat": "Экшн|Приключения|Файтинг|Ролевая игра", "pl": "2", "ru": true, "rel": "2020", "rt": "12", "nc": ""}, {"id": "0100EC800800C000", "n": "Naruto Shippuden Ultimate Ninja Storm Trilogy", "t": "NARUTO SHIPPUDE 010029B0118E8000.jpg", "d": "Почувствуйте азарт погони и получите настоящий драйв в Need for Speed™ Hot Pursuit Remastered на Nintendo Switch™. Дайте волю неистовой жажде скорости — примерьте на себя роль преступника или служителя закона и носитесь на самых крутых и мощных машинах мира. Перехитрите копов или нейтрализуйте нарушителей, используя свой арсенал, в невероятном мире захватывающих гонок, где можно состязаться вместе с друзьями. Мы обновили визуальную составляющую и кроссплатформенную многопользовательскую игру, в том числе асинхронный режим системы Autolog. Также в Ultimate Edition вошли все основные DLC — это самая полная версия завоевавшей признание критиков игры Need for Speed от Criterion Games. Пора вновь броситься в погоню. КРОССПЛАТФОРМЕННЫЙ МНОГОПОЛЬЗОВАТЕЛЬСКИЙ РЕЖИМ И AUTOLOG — Безрассудно рассекайте по дорогам Seacrest County, участвуя в поистине будоражащих гонках. Революционная система Autolog", "dl": "ru", "cat": "Гонки", "pl": "1", "ru": true, "rel": "2020", "rt": "12", "nc": ""}, {"id": "0100F4300BF2C000", "n": "New Pokemon Snap", "t": "New Pokémon Snap™", "r": "New Pokémon Snap", "gb": 7.3, "dlc": 0, "img": "../covers/0100F4300BF2C000.jpg", "d": "Станьте фотографом покемонов в New Pokémon Snap для Nintendo Switch, в основу которой легла классическая игра для консоли Nintendo 64. Отправляйтесь в сафари по раскаленным пустыням и непролазным джунглям региона Лентал и делайте снимки диких покемонов. Запечатлейте величественного Вэйлорда в кристально чистых тропических водах или сфотографируйте озорного Эйпома, прыгающего с ветки на ветку. Всегда держите камеру наготове, чтобы не упустить шанс сделать редкий кадр.", "dl": "ru", "cat": "Приключения", "pl": "1", "ru": false, "rel": "2021", "rt": "6", "nc": ""}, {"id": "0100EA80032EA000", "n": "New Super Mario Bros U Deluxe", "t": "New Super Mario Bros.™ U Deluxe", "r": "", "gb": 2.5, "dlc": 0, "img": "../covers/0100EA80032EA000.jpg", "d": "Первая игра с Луиджи в главной роли, New Super Luigi U, тоже заслужила обновление и идет в комплекте совершенно бесплатно! Все, что требуется игроку, — один контроллер Joy-Con. До четырех человек могут играть вместе где и когда угодно! Марио, Луиджи, Тоад — все здесь! А если этого мало, Кралик и Тоадетта также примут участие в веселье. Кралик не получает урона от врагов, что может очень пригодиться. Если Тоадетта воспользуется суперкороной, она превратится в Пичетту! Пичетта может выполнять двойной прыжок, медленно планировать и подлетать вверх при падении в пропасть.", "dl": "ru", "cat": "Платформер", "pl": "4", "ru": true, "rel": "2019", "rt": "6", "nc": ""}, {"id": "0100BE7013E06000", "n": "Ni no Kuni II Revenant Kingdom Prince's Edition", "t": "Ni no Kuni™ II: Revenant Kingdom PRINCE'S EDITION", "r": "Ni no Kuni™ II: Revenant Kingdom - The Prince's Edition", "gb": 10.6, "dlc": 0, "img": "../covers/0100BE7013E06000.jpg", "d": "Издание Prince's Edition позволит вам в полной мере познать мир Ni no Kuni. В него входят: – Ni No Kuni II: Revenant Kingdom (базовая игра) – Расширения, добавляющие еще несколько часов игры – Набор Prince's Equipment Помогите юному королю Эвану в его героической попытке основать новое королевство, объединить мир и уберечь подданных от ужасного зла. Эта незабываемая приключенческая игра стирает грань между мультипликацией и видеоиграми. Над дизайном персонажей Ni No Kuni II от студии LEVEL-5 работал знаменитый художник Ёсиюки Момосэ, а музыку к игре написал композитор с мировым именем Дзё Хисаиси.", "dl": "ru", "cat": "Приключения|Ролевая игра", "pl": "1", "ru": true, "rel": "2021", "rt": "12", "nc": ""}, {"id": "0100E5600D446000", "n": "Ni No Kuni Wrath of the White Witch", "t": "Ni no Kuni: Wrath of the White Witch", "r": "Ni no Kuni: Wrath of the White Witch™", "gb": 5.8, "dlc": 0, "img": "../covers/0100E5600D446000.jpg", "d": "Вернитесь в другой мир вместе с Ni no Kuni: Wrath of the White Witch™ Remastered. Классическое приключение от разработчиков студии LEVEL-5 теперь доступно и на Nintendo 0100853015E86000", "n": "No Man's Sky", "t": "No Man's Sky", "r": "", "gb": 7.0, "dlc": 0, "img": "../covers/0100853015E86000.jpg", "d": "В No Man's Sky каждая звезда является светом далекого солнца, на орбите которого вращаются обитаемые планеты, к которым вы сможете отправиться, если сами того пожелаете. Беспрепятственно перемещайтесь между просторами дальнего космоса и поверхностями планет, без каких-либо экранов загрузки и ограничений. В этой бесконечной, процедурно генерируемой вселенной вы откроете для себя места и создания, которых вы не видели ранее и, вероятно, вряд ли увидите когда-нибудь еще. Отправляйтесь в эпохальное путешествие Центром галактики является чрезвычайно сильная пульсация, влекущая к себе каждого, кто хочет раскрыть истинную природу космоса. Однако, столкнувшись с враждебно настроенными созданиями и жестокими пиратами, вы увидите, что смерть обходится дорого, а выживание сводится к выбору вариантов улучшения вашего корабля, оружия и костюма. Найдите собственную судьбу Ваше путешествие по No Man's ", "dl": "ru", "cat": "Экшн|Приключения|Симулятор|Ролевая игра", "pl": "1", "ru": true, "rel": "2022", "rt": "12", "nc": ""}, {"id": "0100A9E00D97A000", "n": "Northgard", "t": "Northgard", "r": "", "gb": 0.8, "dlc": 3, "img": "../covers/0100A9E00D97A000.jpg", "d": "Спустя годы неутомимых поисков отважные викинги обнаружили Нордгард – новую землю, полную тайн, опасностей и богатств. Храбрейшие из северян подняли паруса и отправились покорять чужие берега в надежде прославить свой клан и войти в историю благодаря своим завоеваниям, торговле и ревностному служению богам. Но для этого им придется отбиваться от диких зверей и мертвецов, рыщущих в этих местах, налаживать отношения с йотунами или сражаться с ними и пережить зимы такие суровые, каких север еще не видел. - Постройте свое поселение на открытом викингами континенте — Нордгарде. - Обучите своих викингов различным ремеслам, чтобы они стали крестьянами, воинами, моряками и мудрецами. - Распоряжа нтастических достопримечательностей. Исследуйте несколько проработанных до мелочей районов с разными особенностями, чудесами и опасностями. ОТПРАВЬТЕСЬ В ЭПИЧЕСКОЕ ПРИКЛЮЧЕНИЕ Станьте героем увлекательной оригинальной истории в сказочном мир", "dl": "ru", "cat": "Платформер|Экшн", "pl": "1", "ru": true, "rel": "2024", "rt": "16", "nc": ""}, {"id": "01007A3009184000", "n": "Princess Peach Showtime!", "t": "Princess Peach™: Showtime!", "r": "", "gb": 4.7, "dlc": 0, "img": "../covers/01007A3009184000.jpg", "d": "Masked villains named Grape and the Sour Bunch have taken over the Sparkle Theater and turned all of its plays into disasters! Now it’s up to Peach and the theater’s guardian, Stella, to take the stage and use the power of Sparkle to get things back to normal. Help the performers make the theater shine bright again by using Peach’s ribbon and transformations! Play like a princess and transform to save the day with showstopping abilities Within each play, Peach will magically transform to match that play’s setting. Show off fancy swordplay and slash your way through a storybook play as Swordfighter Peach, or wrangle up outlaws with a lasso as Cowgirl Peach in a western-style one. Each transformation has its own abilities to keep the action fun and fresh—one moment you may be sneaking around as Ninja Peach, and the next you may be singing as Mermaid Peach. She’s the hero each performance n", "dl": "en", "cat": "Action|Adventure", "pl": "1", "ru": true, "rel": "2024", "rt": "10", "nc": ""}, {"id": "0100C3A017834000", "n": "Prodeus", "t": "Prodeus", "r": "", "gb": 1.2, "dlc": 0, "img": "../covers/0100C3A017834000.jpg", "d": "Prodeus is a first-person shooter of old, re-imagined using modern rendering techniques and technology. Experience the quality you’d expect from a modern AAA game, designed with retro aesthetics and gameplay that invoke the tech-imposed limits of older hardware. The game features a hand-crafted campaign from industry FPS veterans, co-op and competitive multiplayer play drawing on classic modes*, and a built-in community map browser for instantaneous action with nearly limitless levels to play. Get ready to paint the walls red. This is the Boomer Shooter you’ve been waiting for. FEATURES: Retro look, modern era Shooters past and present collide with graphics that combine today’s high-quality 3D tech with retro visuals. Experience over-the-top explosions of lo-fi pixels and hi-tech particle effects as you clash against the Prodeans and forces of Chaos. Pure retro FPS chaos Steel yourself f", "dl": "en", "cat": "Shooter|Action", "pl": "1", "ru": true, "rel": "2022", "rt": "17", "nc": ""}, {"id": "0100AAE00CAB4000", "n": "Puyo Puyo", "t": "Puyo Puyo Champions", "r": "", "gb": 6.1, "dlc": 1, "img": "../covers/0100AAE00CAB4000.jpg", "d": "Легко научиться, сложно стать мастером! Мгновенно погружайся в скоростную головоломку, подходящую как для дружеского соперничества, так и для настоящих турниров в Чемпионах Puyo Puyo. Соревнуйся с друзьями и родными в локальной многопользовательской игре или с игроками со всего мира через онлайн-подбор. Это неожиданно азартная классическая головоломка для всех возрастов. - Строй стратегические цепочки и планируй сокрушительные атаки с любимыми персонажами из 25-летней истории Puyo Puyo. - Соревновательные многопользовательские режимы работают по любимым наборам правил из Puyo Puyo 2 и Puyo Puyo Fever. - Ворвись в онлайн-бой в матчах Puyo Puyo League или играй в удовольствие с Free Play. - Устраивай собственные локальные турниры до 8 участников, и тебе будет чем похвастаться!", "dl": "ru", "cat": "Пазл|Мультиплеер", "pl": "4", "ru": false, "rel": "2019", "rt": "6", "nc": ""}, {"id": "01002EE00DC02000", "n": "Railway Empire", "t": "Railway Empire - Nintendo Switch™ Edition", "r": "", "gb": 12.3, "dlc": 7, "img": "../covers/01002EE00DC02000.jpg", "d": "Соединенные Штаты Америки, 1830 год. Усиливается влияние Нового Света – индустрия на подъеме, обостряется борьба за контроль над огда-то называл друзьями. Погрузитесь в историю о борьбе Марстона за право стереть свое кровавое прошлое, разворачивающуюся на живописных просторах американского фронтира и Мексики, в игре – предшественнице Red Dead Redemption 2, нашумевшего хита 2018 года. В комплект также входит дополнение Undead Nightmare – культовый ужастик, в котором мир Red Dead Redemption становится фоном для апокалиптической борьбы за выживание с ордами кровожадных зомби. В комплект входят режимы для одного игрока из обеих игр, в Red Dead Redemption включены материалы из Game of the Year Edition и некоторые другие.* Вне закона до последнего *В Red Dead Redemption входят режимы для одного игрока из Red Dead Redemption и Undead Nightmare, а также бонусные материалы из Game of the Year ", "dl": "ru", "cat": "Экшн|Приключения", "pl": "1", "ru": true, "rel": "2023", "rt": "18", "nc": ""}, {"id": "010050F00BC1A000", "n": "Resident Evil", "t": "Resident Evil", "r": "", "gb": 14.5, "dlc": 0, "img": "../covers/010050F00BC1A000.jpg", "d": "Игра, которую многие считают шедевром, игра, которая положила начало долгому сериалу Resident Evil, теперь доступна в формате HD. Классика, стоящая у истоков жанра «выживание в мире ужасов», познакомит вас с истинным страхом. Итак, 1998 год. Группа «Браво» элитного подразделения спецназа S.T.A.R.S. перестала выходить на связь. Группа «Альфа» отправляется в заросшие лесом окрестности городка Ракун-Сити на поиски пропавших товарищей. На отряд нападают уродливые злобные псы, но двум бойцам «Альфы» Крису и Джилл удается спастись в загадочном особняке посреди леса. Никто не мог представить, какие ужасы ждут их за его дверями...", "dl": "ru", "cat": "Приключения", "pl": "1", "ru": false, "rel": "2019", "rt": "18", "nc": ""}, {"id": "010097000BC10000", "n": "Resident Evil 0", "t": "Resident Evil 0", "r": "", "gb": 13.5, "dlc": 0, "img": "../covers/010097000BC10000.jpg", "d": "Этот эпизод Resident Evil наполняет жанр «выживания в мире ужасов» новыми оттенками азарта и интриги. Узнайте, что происходило до первой игры, и оцените новые захватывающие игровые механики, переключаясь между двумя персонажами в поисках разгадки тайны. В 1998 году в захолустном американском городке Ракун-Сити произошла серия странных и жестоких убийств. Ребекка Чемберс — новобранец элитного спецподразделения S.T.A.R.S. с товарищами по группе «Браво» отправилась расследовать происшествие. Поиски привели ее к застрявшему посреди леса поезду. К несчастью, она не знала, что поезд направляется на станцию «Кошмар»...", "dl": "ru", "cat": "Приключения", "pl": "1", "ru": false, "rel": "2019", "rt": "18", "nc": ""}, {"id": "010099A00BC1E000", "n": "Resident Evil 4 (RUS MOD)", "t": "resident evil 4", "r": "", "gb": 11.4, "dlc": 0, "img": "../covers/010099A00BC1E000.jpg", "d": "Игра открывает новую фазу франшизы Resident Evil рассказом о событиях, произошедших после распада корпорации «Амбрелла». Революционная камера со взглядом из-за плеча приходит на смену фиксированной камере из ранних эпизодов и позволяет добиться невероятной динамики, которую уже широко оценили критики. Как только выяснилось, что в экологической катастрофе невиданных масштабов в Ракун-Сити повинна «Амбрелла», корпорация была немедленно закрыта. Леон С. Кеннеди, которому удалось выжить после катастрофы, стал спецагентом в личном распоряжении президента США. Когда дочь президента оказалась похищена, Леон, расспросив свидетелей, отправился в дремучую деревню в холодных европейских лесах. В этой деревне его ждала новая тайна...", "dl": "ru", "cat": "Приключения", "pl": "1", "ru": false, "rel": "2019", "rt": "18", "nc": ""}, {"id": "010018100CD46000", "n": "Resident Evil 5-6", "t": "Resident Evil 5", "r": "", "gb": 36.3, "dlc": 0, "img": "../covers/010018100CD46000.jpg", "d": "В одну из самых популярных частей Resident Evil теперь можно играть на ходу — присоединяйтесь к Крису Редфилду и его напарнице Шеве Аломар в путешествии к сердцу Африки, чтобы расследовать вспышку эпидемии. Помимо однопользовательского и кооперативного режимов, в издание также входят все выпущенные ранее DLC (сюжетные дополнения Lost In Nightmares и Desperate Escape, режим Versus, дополнительные фигурки и 4 костюма), режим No Mercy, а также новый режим The Mercenaries United, созданный на основе двух самых любимых фанатами режимов: The Mercenaries и The Mercenaries Reunion. Такого вы еще не видели!", "dl": "ru", "cat": "Экшн|Приключения|Шутер", "pl": "2", "ru": false, "rel": "2019", "rt": "18", "nc": ""}, {"id": "0100643002136000", "n": "Resident Evil Revelations (RUS VOICE MOD)", "t": "Resident Evil Revelations", "r": "", "gb": 12.1, "dlc": 0, "img": "../covers/0100643002136000.jpg", "d": "Вернитесь к событиям между Resident Evil 4 и Resident Evil 5 в этой игре в жанре survival horror, получившей высокие оценки критиков, и узнайте всю правду о вирусе T-Abyss. В Resident Evil Revelations вы встретитесь с любимыми персонажами серии: Джил Валентайн и Крис Редфилд, а также их партнерами из BSAA — Паркер Лучиани и Джесикой Шерават. Действие начинается на палубе заброшенного корабля «Королева Зенобия», где за каждым поворотом поджидают кошмарные твари. Затем судьба приводит игроков в развалины города Серая земля. Чудовищная гонка на выживание Resident Evil Revelations началась, и на счету каждый патрон. Воспользуйтесь дополнительными настройками управления движением Nintendo Switch™, чтобы повысить точность прицеливания вашего оружия и глубже погрузиться в игровой мир.", "dl": "ru", "cat": "Экшн", "pl": "1", "ru": true, "rel": "2017", "rt": "16", "nc": ""}, {"id": "010095300212A000", "n": "Resident Evil Revelations 2", "t": "Resident Evil Revelations 2", "r": "", "gb": 23.6, "dlc": 0, "img": "../covers/010095300212A000.jpg", "d": "Повествование Resident Evil Revelations 2 начинается с неожиданного возвращения Клэр Редфилд. Пережив события в Раккун-Сити, описанные в предыдущих играх Resident Evil, Клэр стала работать на Terra Save, организацию по борьбе с биотерроризмом. Во время праздника по случаю
