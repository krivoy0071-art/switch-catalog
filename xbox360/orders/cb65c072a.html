нных игр, сформировавших жанр шутеров от первого лица. Сюда входят DOOM, DOOM II, DOOM 3, DOOM 3: Resurrection of Evil, а также дополнение \"The Lost Mission\". Все материалы DOOM 3 обновлены с учетом возможностей Xbox 360, и теперь вы можете наслаждаться игрой в потрясающе красивом 3D-режиме.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "g60efee5bd4f6", "n": "Dragon Age 1", "t": "Dragon Age: Origins", "r": "", "gb": 11.3, "x": "", "img": "../covers/g60efee5bd4f6.jpg", "d": "Мрачная фэнтезийная эпопея от создателей Mass Effect : Ты - Серый Страж, один из последних воинов древнего ордена хранителей. Древний враг человечества вернулся в мир, королевство охвачено гражданской войной, и судьба избрала тебя для того, чтобы объединить разрозненные земли и навсегда уничтожить архидемона. (1) Погружайся в раздробленный мир, который оказался на грани полного уничтожения. (2) Принимай сложные нравственные решения, которые повлияют на ход игры. (3) Создавай героя по своему образу и подобию или по прихоти своего воображения. (4) Вступай в яростные схватки с громадными и чудовищными тварями.", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2010"}, {"id": "g779f54dbe817", "n": "Dragon Age 2", "t": "Dragon Age II", "r": "", "gb": 8.9, "x": "", "img": "../covers/g779f54dbe817.jpg", "d": "Погрузитесь в эпическое продолжение «Игры года — 2009» от создателей игр «Dragon Age: Начало» и Mass Effect 2, с восторгом принятых критиками. Вы из числа тех немногих, кому удалось пережить гибель своего дома. Теперь вы вынуждены бороться за выживание в постоянно меняющемся мире. Вам предстоит найти опаснейших союзников, обрести славу и богатство и оставить свой след в истории. Это рассказ о том, как мир изменился навсегда. История вашего восхождения к власти начинается. \n\nГлавные особенности:\n• Вас ждет небывалое приключение, которое разворачивается на протяжении десяти лет и на ход которого влияет каждое ваше решение.\n• Вам предстоит пройти долгий путь от нищего беженца до почитаемого защитника города.\n• Новая боевая механика окунет вас в самую гущу сражения, будь вы магом, разбойником или воином. Мыслите как полководец и деритесь как спартанец!\n• Анимация нового поколения с головой з", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Ролевые игры", "pl": "", "ru": null, "rel": "2011"}, {"id": "g5f01e601d97f", "n": "Dragon age inquisition", "t": "", "r": "", "gb": 13.9, "x": "", "img": "../covers/g5f01e601d97f.jpg", "d": "Только вы можете помешать демонам заполонить Тедас.\n\nКатаклизм погрузил земли Тедаса в хаос. Маги вступили в решительную борьбу против своих угнетателей-храмовников. Страны идут друг на друга войной. Именно вам предстоит, возглавив Инквизицию, восстановить порядок и дать отпор поборникам хаоса. Поход за истиной отразится на всех — старые союзы и договоренности будут забыты, им на смену придут новые...", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "g34de85877f4d", "n": "Dragon Ball Raging Blast 2", "t": "DB: Raging Blast 2", "r": "", "gb": 5.7, "x": "", "img": "../covers/g34de85877f4d.jpg", "d": "Feel the destructive power of your bone-crushing blows with tons of Super Attacks at your command, special effects that highlight the moment of impact and destructible environments that sustain massive damage as the battle progresses. Featuring more than 90 playable characters, signature skills and transformations, a variety of both offline and online multiplayer modes, and tons of bonus content, Dragon Ball: Raging Blast 2 turns up the intensity", "dl": "en", "cat": "Fighting", "pl": "", "ru": null, "rel": "2010"}, {"id": "g65fb12e2a36e", "n": "Dragon's Dogma Dark Arisen (рус.)", "t": "DD: Dark Arisen", "r": "", "gb": 11.5, "x": "", "img": "../covers/g65fb12e2a36e.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, японский.\n\nВ играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, японский.\n\nAn epitaph speaks of another's demise...\n\nA mysterious island known as Bitterblack Isle appears off the coast of Gransys. Its depths have claimed the lives of many Arisen; their voices still haunt the labyrinth that lies deep beneath its surface--a labyrinth ripe with secrets waiting to be discovered.\n\nThe time to take up arms has come once again. Delve into the isle's depths and uncover its dark secret!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "ga8c2c69f4bdc", "n": "Dreamworks Super Star Kartz", "t": "", "r": "", "gb": 1.5, "x": "Детские", "img": "../covers/ga8c2c69f4bdc.jpg", "d": "Race to the finish line with an all-star lineup of your favorite DreamWorks Animation characters!  Compete as Shrek, Alex, Hiccup, B.O.B. and 8 other favorites as you navigate wacky, wild and wondrous kart courses and battle to capture the checkered flag.  Challenge the clock and your friends in some of the zaniest racing around!", "dl": "en", "cat": "Family, Racing & Flying", "pl": "", "ru": null, "rel": "2011"}, {"id": "gfe7e0ae9cd3a", "n": "DRIVER San Francisco", "t": "", "r": "", "gb": 5.1, "x": "", "img": "../covers/gfe7e0ae9cd3a.jpg", "d": "DRIVER SAN FRANCISCO returns to deliver new innovation in open-world and authentic urban driving. Racing through the iconic streets of San Francisco in over 130 muscle and super cars, players take on intense driving missions and challenges that revolve around one thrilling manhunt. As a 14M unit brand, DRIVER brings instant audience recognition and excitement to Ubisoft’s first DRIVER title for next-gen through innovative features, an immersive storyline, and intense action-driving.", "dl": "en", "cat": "Action & Adventure, Racing & Flying", "pl": "", "ru": null, "rel": "2011"}, {"id": "gb742f91903f6", "n": "Dungeon Defenders", "t": "Dungeon Defenders", "r": "", "gb": 1.5, "x": "", "img": "../covers/gb742f91903f6.jpg", "d": "Dungeon Defenders sets up to four players (online or local/splitscreen) on an epic adventure to protect the Eternia Crystals in a hybrid tower defense action RPG! Create heroes from one of four classes and fight across a full campaign and host of survival and challenge modes to defend your castle from pure, unadulterated evil. Customize and level your hero by defeating enemies, looting equipment and upgrading your gear and pets.", "dl": "en", "cat": "Role Playing, Strategy & Simulation", "pl": "", "ru": null, "rel": "2011"}, {"id": "g93a08f6d7bb2", "n": "Dungeon Fighter Live - Fall of Hendon Myre", "t": "Dungeon Fighter LIVE", "r": "", "gb": 0.4, "x": "", "img": "../covers/g93a08f6d7bb2.png", "d": "В двумерную ролевую игру с боковой прокруткой Dungeon Fighter LIVE: Fall of Hendon Myre, в которой вам предстоит сражаться с несметными полчищами врагов и развивать своего героя, можно играть и в многопользовательском режиме. Примерьте на себя роль одного из трех классических персонажей — убийцы, стрелка или бойца — чтобы защитить Хендон Майэ от монстров, наводнивших Фантасмалию. Создавайте и улучшайте доспехи, а также наносите уникальные удары путем комбинирования навыков, играя вчетвером за одной консолью или через Xbox LIVE!", "dl": "ru", "cat": "Жанры игр, Драки, Ролевые игры, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2012"}, {"id": "g9c7f5ba353b9", "n": "Dungeon Siege 3 Complete Edition", "t": "Dungeon Siege III", "r": "", "gb": 4.5, "x": "", "img": "../covers/g9c7f5ba353b9.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\n\nNow that evil has returned to Ehb the people turn to the few remaining Legionnaires for the protection of the past . As an heir to the legion will you accept this plea for help?", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Ролевые игры", "pl": "", "ru": null, "rel": "2011"}, {"id": "g587b918d2c7b", "n": "EA Sports MMA", "t": "EA Sports MMA", "r": "", "gb": 6.8, "x": "", "img": "../covers/g587b918d2c7b.jpg", "d": "EA SPORTS MMA brings the authenticity of the world’s most intense combat sport home like never before. Go on the offensive with a dynamic control system for strikes, elbows, knees and kicks and strategically manage advances and counters with an intuitive submission system.  Battle it out in the Strikeforce cage or deliver vicious soccer kicks and head stomps in a ring in Japan. Are you ready?  Let’s get it on!", "dl": "en", "cat": "Fighting, Sports & Recreation", "pl": "", "ru": null, "rel": "2010"}, {"id": "gbd685cd7a88e", "n": "Earth Defense Force 2025", "t": "", "r": "", "gb": 5.1, "x": "", "img": "../covers/gbd685cd7a88e.jpg", "d": "В играх по запросу поддерживаются английский. \n\nСпустя 8 лет после уничтожения захватчиков из космоса и их летающей базы Земля почти вернулась к прежней жизни. Но в 2025 году возникает новая угроза: гигантские пришельцы найдены под землей. Губители эволюционировали, став еще сильнее. Бойцам Earth Defense Force в очередной раз предстоит спасти от них Землю!\nEarth Defense Force®2025 - ожидаемый многими сиквел, в котором вам придется сражаться с гигантскими инопланетянами. Бойцы 4 классов и сотни видов оружия помогут вам спасти мир!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2014"}, {"id": "g62705fab53b0", "n": "El Shaddai ENG", "t": "El Shaddai: Ascension of the Metatron", "r": "", "gb": 5.1, "x": "", "img": "../covers/g62705fab53b0.png", "d": "El Shaddai is an innovative new action-adventure epic that casts the player in the role of a brave warrior who must traverse stunningly surreal landscapes, battle unimaginable foes, and uncover ancient mysteries in order to restore balance between Heaven and Earth.", "dl": "en", "cat": "Action & Adventure, Fighting", "pl": "", "ru": null, "rel": "2011"}, {"id": "gc8d9b08dd225", "n": "Enchanted Arms (рус.)", "t": "Enchanted Arms", "r": "", "gb": 7.0, "x": "", "img": "../covers/gc8d9b08dd225.jpg", "d": for a new breed …", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2009"}, {"id": "gf466f9012d31", "n": "Full Auto", "t": "Full Auto", "r": "", "gb": 3.5, "x": "", "img": "../covers/gf466f9012d31.jpg", "d": "Welcome to the most destructive racing game ever made. Combine raw horsepower with awesome firepower to destroy your rivals and tear the world apart. Don't be afraid of pushing the limits--Full Auto's innovative \"Unwreck\" feature affords you the racing genre's first real-time \"second chance.\"", "dl": "en", "cat": "Action & Adventure, Racing & Flying, Shooter", "pl": "", "ru": null, "rel": "2006"}, {"id": "g5803ea26efff", "n": "Fuse", "t": "Fuse", "r": "", "gb": 5.7, "x": "", "img": "../covers/g5803ea26efff.jpg", "d": "В играх по запросу поддерживаются английский, французский, немецкий, и испанский.\n\nВы можете загрузить руководство пользователя для данной игры, пройдя по ссылке https://help.ea.com/ru/tag/manuals и выбрав соответствующее название в выпадающем списке \"Продукты\".\n\nЧто случится, если люди получат доступ к мощной инопланетной технологии, которая никогда для них не предназначалась? Однажды в руки преступников попадает источник внеземной энергии под названием Fuse. ЦРУ спешно вызывает элитную команду суперагентов Overstrike 9 и поручает им любой ценой заполучить этот источник энергии... Пригласите в команду до трех друзей и в режиме совместной игры уничтожьте военизированную преступную корпорацию, захватившую источник энергии. В вашем распоряжении будут мощные командные действия, координация сокрушительных атак и возможности использования новейшего оружия и технологий. Уникальная функция LEAP", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "g91cc30b11b3c", "n": "Game of Thrones", "t": "Game of Thrones", "r": "", "gb": 6.4, "x": "", "img": "../covers/g91cc30b11b3c.jpg", "d": "Загрузите пробную версию \"Игры престолов: первый сезон\", игры из 6 эпизодов по мотивам новаторского сериала. Эта новая история повествует о клане Форрестеров, благородной семье с севера Вестероса, преданной Старкам из Винтерфелла. Они попадают в центр Войны 5 королей, в котором 7 королевств уничтожают друг друга.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2014"}, {"id": "g46a76ee277a1", "n": "Game Party In Motion", "t": "Game Party: In Motion", "r": "", "gb": 1.7, "x": "Kinect", "img": "../covers/g46a76ee277a1.jpg", "d": "Welcome to Game Party In Motion!", "dl": "en", "cat": "Family, Kinect, Sports & Recreation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g13bf213c9539", "n": "Gears of War 1", "t": "Gears of War", "r": "", "gb": 7.6, "x": "", "img": "../covers/g13bf213c9539.jpg", "d": "Эта игра поддерживает английский, французский, итальянский, немецкий, испанский и китайский языки. A Nightmare from Below. A Hero from Within.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g163fed1d80c4", "n": "Gears of War 2", "t": "Gears of War 2", "r": "", "gb": 8.4, "x": "", "img": "../covers/g163fed1d80c4.jpg", "d": "Приближается зима. Война продолжается. \nЦелые города проваливаются под землю под натиском новой вражеской силы. Скоро человечеству будет нечего защищать. Остается только одно решение: ударить всеми силами по орде Саранчи.\n\n• Новый стандарт игр высокого разрешения\nБлагодаря инновационному управлению и несравненной мощности игрового процесса Gears of War® стала одной из самых продаваемых игр для Xbox 360®. Нового прорыва удалось достичь благодаря усовершенствованному движку Unreal® Engine 3.\n\n• Настоящий блокбастер\nИспользование врагов в качестве щитов, дуэли на бензопилах, новые монстры, оружие и средства передвижения в захватывающей кампании потерь и возмездия.\n\n• Сногсшибательная игра в сети Xbox LIVE®\nСамый жестокий онлайновый шутер стал еще лучше благодаря новым режимам командной игры, новым режимам совместной игры и подбору по системе TrueSkill(TM).", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2008"}, {"id": "g83ed86eff856", "n": "Gears of War 3", "t": "Gears of War 3", "r": "", "gb": 11.0, "x": "", "img": "../covers/g83ed86eff856.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский. “Gears of War 3” - захватывающее завершение одной из самых запоминающихся и популярных игровых серий. Игра “Gears of War 3”, разработанная Epic Games специально для Xbox 360, раскрывает перед игроками увлекательную историю о надежде, борьбе и братстве. В “Gears of War 3” игрок сражается за Маркуса Феникса, закаленного ветерана и командира отряда Дельта. Спустя восемнадцать месяцев после уничтожения последнего людского поселения, война с саранчой вступила в новую фазу. А в это время, глубоко под землей зародилась новая угроза, поражающая планету изнутри. Выжившие рассеяны и разобщены, цивилизация лежит в руинах, так что у Маркуса и его товарищей остается не так много времени на спасение человечества.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "gc4e9b469b384", "n": "Gears of War Judgment", "t": "Gears of War: Judgment", "r": "", "gb": 7.9, "x": "", "img": "../covers/gc4e9b469b384.jpg", "d": "Игры на спрос версия поддерживает английский и русский языки. В играх по запросу поддерживаются английский, русский. После пришествия Саранчи судьба мира легла на плечи молодого лейтенанта Коалиции Дэймона Беарда и его бойцов - отряд \"Кило\". \"Кило\" должен превзойти себя и сделать невозможное в рушащемся вокруг мире Серы: уничтожить ужасного нового противника! Предыстория одной из самых знаменитых серий в истории игровой индустрии.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "g4b229e90a65e", "n": "Ghostbusters", "t": "Ghostbusters", "r": "", "gb": 6.6, "x": "", "img": "../covers/g4b229e90a65e.jpg", "d": "“Join the Ghostbusters in an all new adventure penned by the film’s original creators.  The classic cast is back in the newest installment of the Ghostbusters saga.   Strap on your proton pack and get ready for action, the Ghostbusters are back! A mysterious force is opening cross dimensional portals into a terrifying alternate dimension, and an all new a horde of supernatural terrors is pouring through to unleash their wrath on the big apple.  It’s up to the Ghostbusters to drive this threat …", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2009"}, {"id": "g36f195da78eb", "n": "Girl Fight", "t": "Girl Fight", "r": "", "gb": 1.9, "x": "", "img": "../covers/g36f195da78eb.jpg", "d": "Присоединяйтесь к путешествию восьми бесстрашных женщин со сверхспособностями, которые сражаются друг с другом в секретном правительственном исследовательском центре. Используйте как ближний бой, так и телепатические атаки в различных сценариях конца света. Зарабатывайте виртуальную валюту, исполняя трюки, открывайте новый контент: телепатические способности, костюмы, подробную историю и откровенные иллюстрации с девушками. Телепатическая война начинается здесь!", "dl": "ru", "cat": "Жанры игр, Драки, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2013"}, {"id": "g8e7a9a311468", "n": "Goat Simulator (рус.)", "t": "Goat Simulator - Mmore Goatz Edition", "r": "", "gb": 0.3, "x": "", "img": "../covers/g8e7a9a311468.jpg", "d": "Версия Mmore Goatz — это именно то, чего вы ожидаете — больше козлов, чем вы даже могли себе представить в самом масштабном симуляторе козлов всех времен!\n\nНовейший симулятор ММО позволяет вам стать виртуальным козлом в виртуальном онлайн-мире. Кроме того, вас ждет борьба между кланами козлов и овец.\n\nНу а всех любителей зомби ждет сюрприз — теперь вы можете стать зомби-козлом посреди зомби-апокалипсиса! Примечание: игра содержит зомби, потому что зомби-апокалипсиса без зомби не бывает.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2015"}, {"id": "gbdfc rom the beginning, you know the end. Halo: Reach. Fall 2010. There are no refunds for this item. For more information, see www.xbox.com/live/accounts.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g6c1b1a59497f", "n": "HALO WARS", "t": "Halo Wars", "r": "", "gb": 6.4, "x": "", "img": "../covers/g6c1b1a59497f.jpg", "d": "Приблизительно ЧЕРЕЗ ГОД, в декабре 2021 г. серверы классических игр серии Halo для консоли Xbox 360 прекратят свою работу. Владельцы игр по-прежнему смогут играть в них, но ряд сетевых возможностей, в частности, подбор игроков, станет ограничен или полностью недоступен.  \n\nHalo Wars - это военная стратегия в знаменитой вселенной Halo®.  В вашем распоряжении целые армии спартанцев, \"вепри\" и другая техника. Присоединяйтесь к экипажу \"Духа Огня\" и воюйте с пришельцами из Ковенанта!  Разработанная эксклюзивно для Xbox 360, Halo Wars даст вам возможность возглавить великие армии в легендарных битвах.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Стратегии и симуляторы", "pl": "", "ru": null, "rel": "2010"}, {"id": "g7c9a7fec17d7", "n": "Harry Potter half blood prince", "t": "", "r": "", "gb": 4.5, "x": "", "img": "../covers/g7c9a7fec17d7.jpg", "d": "Вы снова отправляетесь в Хогвартс вместе с Гарри! На этот раз его ждут еще более захватывающие приключения. Между учениками вспыхивают новые романы, а старый враг Гарри замышляет очередную пакость. Получится ли у Гарри добыть воспоминание Слизнорта и вместе с Дамблдором раскрыть коварные планы Волан-де-Морта? Сможет ли Гарри разгадать тайну загадочного Принца-Полукровки? Вы станете участником всех событий шестого года обучения Гарри: от летних каникул до ужасающей битвы с Пожирателями Смерти.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2008"}, {"id": "g19fa9986f1e8", "n": "Hitman Absolution", "t": "Hitman: Absolution™", "r": "", "gb": 7.9, "x": "", "img": "../covers/g19fa9986f1e8.jpg", "d": "Wear the suit of the ultimate assassin, you have the ability to blend into plain sight, kill with your bare hands and fashion a weapon from almost anything. You are Agent 47, the world's deadliest assassin. ", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2013"}, {"id": "g7bf63032903f", "n": "Homefront", "t": "Homefront", "r": "", "gb": 7.1, "x": "", "img": "../covers/g7bf63032903f.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\n2027. America has fallen to a savage military occupation. Join the Resistance and fight for freedom in this gripping, cinematic first person shooter", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "g8f576a178f58", "n": "Hot Wheels Worlds Best Driver", "t": "Hot Wheels: World's Best Driver", "r": "", "gb": 3.6, "x": "", "img": "../covers/g8f576a178f58.jpg", "d": "Gear up for the most intense challenges only Hot Wheels® can deliver!  Join the elite ranks of Team Hot Wheels, choose from thrilling Hot Wheels vehicles and compete in dozens of unique, fast-paced, re-playable challenges! Do you have what it takes to be the World’s Best Driver? ", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2013"}, {"id": "ga32d838877ec", "n": "Hour of Victory ENG", "t": "Hour of Victory", "r": "", "gb": 5.0, "x": "", "img": "../covers/ga32d838877ec.jpg", "d": "Hour of Victory™, available exclusively for the Xbox 360, allows you to play a key role in cinematic battles from the European and North African theaters of World War II.  Sneak into enemy territory as a covert operative, storm the gates as a British Commando, or snipe enemy troops from afar as an Army Ranger - each character’s unique attributes will be necessary in order to successfully arrive at the Hour of Victory.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "g1c96fca77341", "n": "Hunted Demon Forge (рус.)", "t": "Hunted: Кузня Демонов", "r": "", "gb": 6.2, "x": "", "img": "../covers/g1c96fca77341.jpg", "d": "Set in a dark and foreboding fantasy world, Hunted: The Demon’s Forge is an unforgettable co-op fantasy action game that pits you against waves of enemies. Not only will you need to use a range of weapons in cover combat to fight and slash your way through underground dungeons and sweeping vistas.  You will also need your wits about you to complete puzzles and explore the world to find the answers to the game’s deep, dark mysteries.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g79cb4e8251ad", "n": "I Am Alive (рус.)", "t": "", "r": "", "gb": 2.0, "x": "", "img": "../covers/g79cb4e8251ad.jpg", "d": "One year after a cataclysmic event has wiped out most of human civilization, a man struggles for survival. Faced with an insecure, decaying, and hazardous world, he scours a desolated city, searching for his long lost family. Survive the suffocating, murky streets covered in dust. Climb the ruins of the last standing skyscrapers to reach breathable air and find untouched resources. And discover a changed human condition, dangerous armed gangs, and victims in need.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2012"}, {"id": "g29092eef87c5", "n": "Ice Age - Dawn of the Dinosaurs", "t": "Ice Age: Dawn of the Dinosaurs", "r": "", "gb": 6.6, "x": "", "img": "../covers/g29092eef87c5.jpg", "d": "In the Ice Age: Dawn of the Dinosaurs Video Game, join Ice Age’s unlikely herd of prehistoric pals for their wildest, wackiest, most exciting adventure yet! For the first time, play as six beloved Ice Age characters as they embark on a rescue mission across melting snow to the mysterious Dinosaur World – an all-new, fur-raising jungle of carnivorous plants, lush foliage and fierce dinosaurs. Based on the highly anticipated Fox film of the same name, it’s a rollicking ride of mammoth proportions!", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "g03ca092a02b1", "n": "Import Tuner Challenge", "t": "Import Tuner Challenge", "r": "", "gb": 3.4, "x": "", "img": "../covers/g03ca092a02b1.jpg", "d": "Battle rivals to be the fastest racer on the highways of Tokyo!  Customize your car with an overwhelming variations of upgrades to become the champion of the road.", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2008"}, {"id": "gaf873b316fa6", "n": "Infernal ENG", "t": "Infernal: Hell's Vengeance", "r": "", "gb": 3.1, "x": "", "img": "../covers/gaf873b316fa6.jpg", "d": "<String text>", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "g6742750af799", "n": "Injustice Gods Among Us", "t": "Injustice: Gods Among Us", "r": "", "gb": 8.4, "x": "", "img": "../covers/g6742750af799.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, польский, португальский, русский.\n\nЧто если величайшие герои станут нашими врагами? Игра Injustice: Gods Among Us - это новое слово в мире файтингов от удостоенной многих наград NetherRealm Studios, создателей Mortal Kombat. В этой игре границы между добром и злом стерты, а ее герои и злодеи - среди которых такие легенды DC Comics, как Бэтмен, Джокер, Зеленый Фонарь, Флеш, Супермен и Чудо-женщина, - участвуют в эпических битвах.", "dl": "ru", "cat": "Жанры игр, Драки", "pl": "", "ru": null, "rel": "2013"}, {"id": "g82bd3b56a0c8", "n": "Inversion", "t": "Inversion", "r": "", "gb": 3.2, "x": "", "img": "../covers/g82bd3b56a0c8.jpg", "d": "УПРАВЛЯЙТЕ СИЛОЙ ПРИТЯЖЕНИЯ!\nИграйте в роли молодого отца и мужа Дэвиса Рассела, который вынужден сражаться с неизвестным врагом, вторгнувшимся в его город. Привычные оружие и тактика оказались бесполезными. Вам с напарником Лео Дельгадо придется научиться управлять силой притяжения, чтобы отыскать пропавшую дочь и спасти мир.", "dl": "r ": "", "gb": 5.8, "x": "", "img": "../covers/g46a0f06a23a6.jpg", "d": "In Just Cause, take on the role of the flamboyant Rico Rodriguez—an undercover CIA operative specialising in regime change—as he tries to overthrow the corrupt government of San Esperito. This rogue South American island is suspected of stockpiling WMDs and it's your job to negate the threat to world peace. It could be to your advantage that this tropical paradise is about to implode as various factions vie for power—it just needs a gentle nudge in the right direction.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "g668d23928a99", "n": "Just Cause 2", "t": "Just Cause 2", "r": "", "gb": 4.4, "x": "", "img": "../covers/g668d23928a99.jpg", "d": "Игры по запросу версия поддерживает английский, французский, итальянский, немецкий, испанский языки.\n\nЭта игра поддерживает английский, испанский, французский, немецкий и итальянский. Download the manual for this game by locating the game on http://marketplace.xbox.com and selecting “See Game Manual\". \n\nAs agent Rico Rodriguez, your orders are to find and kill your friend and mentor who has disappeared on the island paradise of Panau. With the unique grapple and parachute combo, BASE jump, hijack and create your own high-speed stunts. With 400 square miles of rugged terrain and hundreds of weapons and vehicles, Just Cause 2 defies gravity and belief.\n\nX360- 8/10 “Ludicrously fun\"\n\nNuts- “A Kick-Ass Corker”\n\nGamesmaster- “Pure Gaming Nectar”", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "g848ac5ce8165", "n": "Just dance - Greatest hits", "t": "JustDance GreatestHits", "r": "", "gb": 5.8, "x": "Kinect", "img": "../covers/g848ac5ce8165.jpg", "d": "Самые известные композиции и модные танцевальные движения - это игры Just Dance®! Игра Just Dance® Greatest Hits содержит самые популярные песни из Just Dance® и Just Dance® 2, а еще дополнительные треки из Just Dance® 3! Устройте вечеринку, соревнуйтесь с друзьями в танцевальной битве или просто танцуйте под хиты таких известных исполнителей, как Katy Perry, Rihanna, Beastie Boys и Ke$ha - всего 35 композиций! Впервые игра Just Dance® Greatest Hits использует Kinect™ для Xbox 360® и предлагает вам потанцевать под классические песни из Just Dance и Just Dance® 2. Just Dance® Greatest Hits - откройте для себя популярный танцевальный бренд или играйте снова, если вы уже успели его полюбить!", "dl": "ru", "cat": "Жанры игр, Семейные игры, Музыка, Kinect", "pl": "", "ru": null, "rel": "2012"}, {"id": "g1bc5ae1e2e9d", "n": "Just Dance 2014", "t": "Just Dance 2014", "r": "", "gb": 7.8, "x": "Kinect", "img": "../covers/g1bc5ae1e2e9d.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, датский, нидерландский, финский, норвежский, шведский.\n\nНовая часть франшизы Just Dance улучшит ваши танцевальные способности, и снова погрузит вас в атмосферу лучшего музыкального рандеву этого года!\nЭта часть станет еще более социальной, так как вы сможете танцевать с игроками всего мира и делить с ними уникальный танцевальный опыт. Она становится устроителем вечеринок и содержит отсылки к сегодняшним иконам поп-культуры.\nБудут доступны новые режимы, позволяющие вам и вашим друзьям получать на вечеринках такие ощущения, какие возможны только с Just Dance!", "dl": "ru", "cat": "Жанры игр, Музыка, Kinect", "pl": "", "ru": null, "rel": "2013"}, {"id": "g27624dbc371e", "n": "Just.Dance 2019", "t": "Just Dance® 2019", "r": "", "gb": 7.9, "x": "Kinect", "img": "../covers/g27624dbc371e.jpg", "d": "Танцуйте с Just Dance 2019 где угодно! Вместе с каждой копией игры вы бесплатно получите доступ на 1 месяц! \n\nТанцуйте под 40 новых композиций. Среди них: \n• \"Havana\" от Camila Cabello\n• \"One Kiss\" от Calvin Harris, Dua Lipa\n• \"Finesse (Remix)\" от Bruno Mars Ft. Cardi B\n• \"I Feel It Coming\" от The Weeknd Ft. Daft Punk\n• \"Work Work\" от Britney Spears\n• \"Familiar\" от Liam Payne & J Balvin\n• \"Mad Love\" от Sean Paul, David Guetta Ft. Becky G\n• Bang Bang Bang от BIGBANG\n...и многие другие!", "dl": "ru", "cat": "Жанры игр, Семейные игры, Музыка, Kinect", "pl": "", "ru": null, "rel": "2018"}, {"id": "g467473be03f6", "n": "Kameo Elements of power (рус.)", "t": "Kameo Elements of power", "r": "", "gb": 4.8, "x": "", "img": "../covers/g467473be03f6.jpg", "d": "Unleash the powers within you! An epic adventure from legendary developer Rare, Ltd.", "dl": "en", "cat": "Action & Adventure, Family", "pl": "", "ru": null, "rel": "2010"}, {"id": "g443777578772", "n": "Kane & Lynch 2 Dog Days (рус.)", "t": "Kane & Lynch 2", "r": "", "gb": 6.8, "x": "", "img": "../covers/g443777578772.jpg", "d": "Эта игра поддерживает английский, испанский, французский и итальянский Языков. \n\nAfter a simple job ends in a blood bath, Kane and Lynch are forced to face the consequences of their actions…", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g1397ac533b19", "n": "Kane and Lynch DeadMen (рус.)", "t": "Kane & Lynch: Dead Men", "r": "", "gb": 5.9, "x": "", "img": "../covers/g1397ac533b19.jpg", "d": "Эта игра поддерживает английский, испанский, французский, немецкий и итальянский язык. \n\nA flawed mercenary and a medicated psychopath forced together on a violent and chaotic path seeking redemption and revenge. There are no refunds for this item. For more information, see www.xbox.com/live/accounts.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g01003fdc7c3b", "n": "Killer Is Dead", "t": "Killer Is Dead", "r": "", "gb": 4.8, "x": "", "img": "../covers/g01003fdc7c3b.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, японский.\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nKILLER IS DEAD™ — это новый экшн, разработанный совместно KADOKAWA GAMES и GRASSHOPPER MANUFACTURE, руководствуясь знаменитым чувством стиля SUDA51. \n\nВ центре внимания Мондо Заппа, свежий кадр в уважаемом агентстве по исполнению приговоров. Он выслеживает и обезглавливает отвратительных преступников по всему миру (и даже, возможно, за его пределами). Втянувшись в работу, он идет на сделку со своими внутренними демонами, балансируя между талантом и жестокой справедливостью, мимолетно вспоминая о трудном детстве и сдабривая все это многочисленными победами на личном фронте.\n\nБудь он убийцей, любовником или жиголо, история о его страсти и жестокости начинается с назначения в б", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "g246cdc65a199", "n": "Kinect Adventures!", "t": "Kinect Adventures", "r": "", "gb": 4.8, "x": "Kinect", "img": "../covers/g246cdc65a199.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, португальский, русский, японский, корейский, китайский.\n\nKinect Adventures! — это полноценная игра для Kinect, в которой вы с друзьями можете исследовать мир (и не только его!) в погоне за главной наградой — званием опытного искателя приключений! 20 увлекательных приключений ждут вас! Прыгайте, пригибайтесь и уворачивайтесь, проносясь по ревущим бурунам и преодолевая препятствия на маршруте. Приложите все свои умения и спасите протекающую подводную лабораторию. Проявите себя, выставив на всеобщее обозрение в сети свои фотомоменты и живые статуи. Дух приключения ждет!", "dl": "ru", "cat": "Жанры игр, Другое, Kinect", "pl": "", "ru": null, "rel": "2010"}, {"id": "gd7ff0fd71b25", "n": "Kinect Sports", "t": "Kinect Sports", "r": "", "gb": 3.5, "x": "Kinect", "img": "../covers/gd7ff0fd71b25.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, португальский, русский, японский, корейский, китайский.\n\nЧерез Kinect Sport вы, ваши друзья и близкие сможете попасть на виртуальный стадион и в полной мере раскрыть свой спортивный потенциал. К вашим услугам шесть захватывающих видов спорта: футбол, боулинг, легкая атлетика, бокс, пляжный волейбол и настольный теннис.\n\nВам больше не нужен геймпад — вы сами себе геймпад! Сенсор Kinect воспроизведет любое движение: от безупречной подачи до прыжка через последнее препятствие. Устанавливайте личные рекорды в игре соло, побеждайте компьютерных противников, бросайте вызов игрокам со всего мира через Xbox LIVE или собирайте на состязания теплую компанию друзей вокруг своего телевизора. В случае если активно участвовать в состязаниях хотят все, предусмотрен режим командн", "dl": "ru", "cat": "Жанры игр, Семейные игры, Спорт и отдых, Kinect", "pl": "", "ru": null, "rel": "2010"}, {"id": "gee055180fd06", "n": "Kinect Sports Season Two", "t": "KS: Season Two", "r": "", "gb": 7.2, "x": "Kinect", "img": "../covers/gee055180fd06.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, датский, голландский, финский, норвежский, польский, португальский, русский, шведский, японский, корейский, китайский.\n\nKinect Sports, сезон 2 делает стремительный рывок к игроку, по максимуму используя преимущества революционной технологии Kinect и новейшие потрясающие возможности, в том числе улучшенное отслеживание движений. \nПусть вся семья соберется вместе и поиграет в новом режиме Соревнования по Xbox LIVE с друзьями по всему миру! Игра Kinect Sports, сезон 2 позволяет поучаствовать в дружеском соревновании и получить яркие впечатления всем игрокам - от обычных до настоящих атлетов и продвинутых спортивных болельщиков.", "dl": "ru", "cat": "Жанры игр, Семейные игры, Спорт и отдых, Магазин Xbox LIVE", "pl": "", "ru": null, "rel": "2011"}, {"id": "g2377e0c6de78", "n": "Kinect Star Wars", "t": "Kinect Star Wars", "r": "", "gb": 7.6, "x": "Kinect", "img": "../covers/g2377e0c6de78.png", "d": "Игры по запросу версия поддерживает английский, японский. Корейский, русский, и традиционный китайский.\n\nДля этой игры требуется сенсор Kinect™.\n\nПогрузитесь в мир звездных войн и испытайте физическую модель новой игровой галактики. Пилотируйте звездные истребители, гоняйте на подах и даже перевоплощайтесь в джедая. Топайте, рычите, хватайте и швыряйте штурмовиков, став громадным ранкором, или обходите соперников по гонкам на подах, чтобы стать чемпионом. Танцуйте, развлекая Джаббу Хатта и других персонажей, и наслаждайтесь другими приключениями в одиночку или вместе с друзьями.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Kinect", "pl": "", "ru": null, "rel": "2012"}, {"id": "gc7aa2fa6a87d", "n": "King's Quest", "t": "King's Quest", "r": "", "gb": 8.0, "x": "", "img": "../covers/gc7aa2fa6a87d.jpg", "d": "Download King’s Quest – Chapter 1: A Knight to Remember. An aging King Graham reflects on a life of adventure with his granddaughter, Gwendolyn, taking players back to his teen years and his quest to become a knight of Daventry in King Edward’s royal guard. Discover a wondrous world full of whimsical characters, charming puzzles and perilous dangers in this fun and enchanting coming of age story.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2015"}, {"id": "gdb7e237bca54", "n": "Kingdom Under Fire (рус.)", "t": "KUF: Circle of Doom", "r": "", "gb": 4.4, "x": "", "img": "../covers/gdb7e237bca54.jpg", "d": "A hero answers the call to battle this Winter in Kingdom Under Fire: Circle of Doom…an innovative Action-RPG where the Lords of Light and Darkness wage war for ultimate dominion. To save the world from eternal darkness, you must overcome hordes of demented monsters, journey through twisted, surreal environments and face unspeakable nightmares. Build up your characters health, skill and luck points as you can earn more powerful weapons and learn new abilities by completing quests.  Discover weapo", "dl": "en", "cat": "Action & Adventure, Role Playing", "pl": "", "ru": null, "rel": "2008"}, {"id": "g9dc38df217be", "n": "Kingdoms of Amalur Reckoning (рус.)", "t": "Kingdom Of Amalur: Reckoning", "r": "", "gb": 8.3, "x": "", "img": "../covers/g9dc38df217be.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\n\nАвтор бестселлеров New York Times Р.А. Сальваторе, создатель \"Спауна\" Тодд МакФарлейн и дизайнер Elder Scrolls IV: Oblivion, Кен Ролсон придумали мир, который стоит спасать. Выбери свой путь и пробивайся через орды врагов. Создай персонажа, о котором всегда мечтал и постепенно развивай его при помощи революционной системы Destiny. Здешняя боевая система - самая глубокая, настраиваемая и отзывчивая в жанре!", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2012"}, {"id": "g019ed6e321ac", "n": "Knights Contract", "t": "Knights Contract", "r": "", "gb": 6.9, "x": "", "img": "../covers/g019ed6e321ac.jpg", "d": "ДНЁМ РЫЦАРЬ, НОЧЬЮ ПАЛАЧ\n\nСредневековый мир мечей, магии, охоты на ведьм. Воскресшая ведьма Гретхен и бессмертный палач Генрих борются против сверхъестественных сил, изводящих людей чёрной смертью.\n\nМеч и колдовство - Используй клинок Генриха и магию Гретхен\n\nРыцарь-защитник - Защити Гретхен от ужасного зла, выживайте, объединяясь\n\nСредневековые познания - Исследуй Европу отчаянных времён чёрной магии", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2011"}, {"id": "g13b2c431d846", "n": "L.A.Noire", "t": "L.A. Noire Disc 4", "r": "", "gb": 27.6, "x": "", "img": "../covers/g13b2c431d846.jpg", "d": "A dark and violent crime thriller set against the backdrop of 1940’s Los Angeles, where everyone has something to hide. ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "gaf2700c2c1ca", "n": "Left 4 dead (рус.)", "t": "Left 4 Dead", "r": "", "gb": 4.1, "x": "", "img": "../covers/gaf2700c2c1ca.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, португальский, русский, японский, корейский, китайский.New from Valve® — создатели Counter-Strike®, Half-Life®, Portal™ и Team Fortress® — Left 4 Dead™ — это новая игра, представляющая собой эпической битву четверых \"Выживших\" с ордами бесчисленных зомби и ужасных мутантов \"Зомби-боссов\". Вы готовы к Апокалипсису зомби?", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2009"}, {"id": "gef0842cc17b8", "n": "Left 4 Dead 2 (рус.)", "t": "Left 4 Dead 2", "r": "", "gb": 7.1, "x": "", "img": "../covers/gef0842cc17b8.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, португальский, японский, китайский.\n\nNew from Valve® — создатели Counter-Strike®, Half-Life®, Portal™ и Team Fortress® — Left 4 Dead™ 2 — это новая игра, представляющая собой эпической битву четверых \"Выживших\" с ордами бесчисленных зомби и ужасных мутантов \"Зомби-боссов\". Вы готовы к Апокалипсису зомби?", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Драки, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g96d363c5accd", "n": "Legend of Kay Anniversary (рус.)", "t": "Legend of Kay", "r": "", "gb": 3.0, "x": "", "img": "../covers/g96d363c5accd.jpg", "d": "10 years after its initial release, Legend of Kay - Anniversary is a thoroughly remastered version of the original game: high-resolution textures; new, more detailed character models; modern rendering techniques and crystal-clear surround sound give this great classic a new shine.", "dl": "en", "cat": "Action & Adventure, Role Playing", "pl": "", "ru": null, "rel": "2015"}, {"id": "gc771d7638895", "n": "Legend of the Guardians (рус.)", "t": "Legend of the Guardians: The Owls of Ga'Hoole", "r": "", "gb": 2.6, "x": "", "img": "../covers/gc771d7638895.jpg", "d": "Fight the evil Pure Ones as a legendary Guardian of Ga'Hoole!", "dl": "en", "cat": "Action & Adventure, Family, Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "g775719d0948f", "n": "Legendary (рус.)", "t": "Legendary", "r": "", "gb": 7.3, "x": "", "img": "../covers/g775719d0948f.jpg", "d": "Fight tooth and claw with machine gun and grenade as mythological creatures clash with the modern day in Legendary. The world is changed forever when Charles Deckard, an international art thief, is tricked into opening \"Pandora's Box\" by a secret society determined to harness its power. Engage vicious werewolves, griffons, firedrakes and more as you enter a full-scale war for humanity's survival.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "g3004dfa14729", "n": "Lego Batman 3 Beyond Gotham", "t": "Lego Batman 3: Beyond Gotham", "r": "", "gb": 8.3, "x": "Детские", "img": "../covers/g3004dfa14729.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, датский, нидерландский, польский, португальский, русский.\n\nКрестоносец в плаще объединяет силы с супергероями из комиксов по вселенной DC и улетает в космос, чтобы помешать злобному Брейниаку уничтожить Землю. Брейниак уменьшает миры при помощи Сияющих колец и собирает коллекцию миниатюрных городов со всей Вселенной. Величайшие супергерои должны объединиться с коварнейшими злодеями, вместе облететь все Сияющие миры, собрать там кольца и остановить Брейниака, пока ещё не поздно.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Семейные игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "gf297a2bd9493", "n": "Lego Indiana Jones 2", "t": "Lego Indiana Jones 2: The Adventure Continues", "r": "", "gb": 6.0, "x": "Детские", "img": "../covers/gf297a2bd9493.jpg", "d": "In LEGO® Indiana Jones™ 2: The Adventure Continues, play ALL-NEW levels from The Original Adventures and your favorite new moments from The Kingdom of the Crystal Skull... Or for the first time, create your own levels, for a true one-of-a-kind experience! New levels, vehicles and modes like 2-player split-screen, will let you build and battle your way out of trouble like never before!", "dl": "en", "cat": "Action & Adventure, Family", "pl": "", "ru": null, "rel": "2010"}, {"id": "g3259ac1b403d", "n": "Lego Jurassic World", "t": "Lego Jurassic World", "r": "", "gb": 7.3, "x": "Детские", "img": "../covers/g3259ac1b403d.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, датский, нидерландский, польский, португальский, русский.LEGO® Jurassic World™ — первая видеоигра, где можно набраться впечатлений изо всех четырёх фильмов о парке Юрского периода в смешной форме LEGO.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2015"}, {"id": "gbd4cb2a529ed", "n": "Lego Marvel Super Heroes", "t": "Lego Marvel Super Heroes", "r": "", "gb": 5.7, "x": "Детские", "img": "../covers/gbd4cb2a529ed.jpg", "d": "В играх по запросу поддерживаются Английский, французский, итальянский, немецкий, испанский, датский, голландский, польский, русский.\n\nLEGO ® Marvel Super Heroes™ представляет историю, которая затронет всю вселенную Marvel. Вам предстоит сыграть за самых известных героев комиксов Marvel, таких как Железный человек, Человек-паук, Халк, Капитан Америка, Росомаха и многих других. Они объединят свои силы и способности, чтобы не дать Локи и другим суперзлодеям Marvel собрать оружие, способное уничтожить весь мир.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Семейные игры", "pl": "", "ru": null, "rel": "2013"}, {"id": "gf68d437eb5fe", "n": "Lego Marvel's Avengers", "t": "Lego Marvel's Avengers", "r": "", "gb": 7.4, "x": "Детские", "img": "../covers/gf68d437eb5fe.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, датский, нидерландский, польский, португальский, русский.\n\nМстители, собирайтесь! В популярной серии видеоигр LEGO® Marvel вышла новая динамичная игра о приключениях супергероев. Присоединитесь к команде LEGO® Marvel’s Avengers и сыграйте в первую видеоигру для консолей с персонажами и сюжетами из фильмов и других художественных произведений. Сыграйте за величайших супергероев, которым предстоит спасти мир.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2016"}, {"id": "ga643bdfe7a08", "n": "Lego Movie Videogame", "t": "The Lego Movie Videogame", "r": "", "gb": 6.0, "x": "Детские", "img": "../covers/ga643bdfe7a08.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, датский, нидерландский, польский, португальский, русский.\n\nОтправляйтесь с Эмметом и разношёрстной группой повстанцев в героический поход против злодея Лорда Бизнеса — правда, к этому заданию Эммет совершенно не готов. Вас ждёт увлекательное путешествие, в котором можно играть за более чем 90 персонажей: Batman, Superman, Wonder Woman, Green Ninja, Gandalf, Shakespeare, Cleopatra и других.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Семейные игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "g1c48d54fa32e", "n": "LEGO Star Wars", "t": "LEGO® STAR WARS™: TFA", "r": "", "gb": 7.2, "x": "Детские", "img": "../covers/g1c48d54fa32e.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, датский, нидерландский, польский, португальский, русский.\n\nДа пребудет с вами Сила! В игре LEGO® вы отправитесь в путешествие по мотивам блокбастера «Звездные войны». Сыграйте за персонажей фильма: Рэй, Финна, По Дэмерона, Хана Соло, Чубакку, C-3PO и BB-8, а также за Кайло Рена, генерала Хакса и капитана Фазму.\n\nВ «LEGO Star Wars: Пробуждение силы» вас ждут увлекательные приключения. Вы узнаете, что происходило во вселенной Star Wars между VI и VII эпизодами.\n\nВ игре представлены новые игровые механики: мультиблоки и бластеры. Используйте их для борьбы с Первым орденом.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2016"}, {"id": "g5bb13c5e7c78", "n": "Lego The Hobbit", "t": "Lego The Hobbit", "r": "", "gb": 6.4, "x": "Детские", "img": "../covers/g5bb13c5e7c78.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, датский, нидерландский, польский, португальский, русский\n\nИнтерактивная игра LEGO® Хоббит™ позволяет игрокам участвовать в сценах из своих любимых фильмов и основана на судьбе хоббита Бильбо Бэггинса, которого волшебник Гэндальф призвал на помощь Торину Дубощиту и его компании гномов.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Семейные игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "g7557d02ff01f", "n": "Leisure Suit Larry", "t": "Leisure Suit Larry", "r": "", "gb": 2.2, "x": "", "img": "../covers/g7557d02ff01f.jpg", "d": "Join Larry on his hilarious saucy exploits around his uncle's film studio.", "dl": "en", "cat": "Action & Adventure, Platformer", "pl": "", "ru": null, "rel": "2008"}, {"id": "gd8379ed7ca55", "n": "Life Is Strange (рус.)", "t": "Life Is Strange™ Episode 1", "r": "", "gb": 7.4, "x": "", "img": "../covers/gd8379ed7ca55.png", "d": "Первый эпизод теперь бесплатный!\n\nLife is strange – это удостоенная множества наград и высоко оцененная критиками игра, где можно отматывать время назад и влиять на прошлое, настоящее и будущее.\n\nПеред вами история начинающего фотографа Макс Колфилд, которая научилась отматывать назад время.\nЕй и ее подруге Хлое Прайс предстоит раскрыть исчезновение студентки по имени Рейчел Эмбер. Макс пока еще даже не подозревает, что когда она меняет прошлое, будущее оказывается в опасности.\n\nОсобенности:\n- Интригующий современный сюжет\n- Возможность управлять временем\n- Различные концовки игры\n- Впечатляющая рисованная графика\n- Выдающееся музыкальное сопровождение", "dl": "ru", "cat": "Жанры игр, Другое, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2015"}, {"id": "g971f11dbe6d6", "n": "Limbo", "t": "LIMBO", "r": "", "gb": 0.1, "x": "", "img": "../covers/g971f11dbe6d6.jpg", "d": "Uncertain of his sister's fate, a boy enters LIMBO ...", "dl": "en", "cat": "Platformer, Puzzle & Trivia", "pl": "", "ru": null, "rel": "2010"}, {"id": "g988406ea5dbd", "n": "Lollipop Chainsaw", "t": "LOLLIPOP CHAINSAW", "r": "", "gb": 5.5, "x": "", "img": "../covers/g988406ea5dbd.jpg", "d": "Bursting with sex, blood, and rock 'n’ roll, Lollipop Chainsaw is the 'un-deadly' story of a sweet and killer zombie hunter and her quest to uncover the root of a colossal zombie outbreak.  With her wickedly awesome chainsaw in hand, Juliet slices, dices and splits her way through hordes of the undead, but soon realizes the horde is only the opening act to a festival of zombie rock lords determined to kill the chainsaw wielding cheerleader. ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2012"}, {"id": "gd199634e1625", "n": "Lost Odyssey", "t": "Lost Odyssey Disc 4", "r": "", "gb": 23.2, "x": "", "img": "../covers/gd199634e1625.jpg", "d": "Hironobu Sakaguchi of Mistwalker brings together the talents of Takehiko Inoue, Kiyoshi Shigematsu, and Nobuo Uematsu to present the next generation RPG, Lost Odyssey.", "dl": "en", "cat": "Role Playing", "pl": "", "ru": null, "rel": "2008"}, {"id": "g2cfdfeb7b1c1", "n": "Lost Planet Colonies (рус.)", "t": "LOST PLANET COLONIES", "r": "", "gb": 7.1, "x": "", "img": "../covers/g2cfdfeb7b1c1.jpg", "d": "LOST PLANET has been enhanced with new maps and gameplay modes. Re-visit the great online action!", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g90ff47117a2c", "n": "Mafia II", "t": "Mafia II", "r": "", "gb": 8.7, "x": "", "img": "../covers/g90ff47117a2c.jpg", "d": "В играх по запросу поддерживаются английский, французский, & испанский. Загрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nMafia II - великолепно воссозданная картина мрачного, сурового мира мафии. Высокооктановый геймплей, жестокие схватки и гонки на грани фола воссоздают поистине голливудский стиль на экране. Это захватывающая история Вито Скалетты, который вместе со своим другом детства Джо все глубже погружается в мир организованной преступности. Вместе они делают себе имя в мафии и на улицах города. Начав с мелких заданий, таких как ограбления и угон машин, Вито и Джо быстро поднимаются по иерархической лестнице мафиозной семьи... но жизнь \"человека чести\" далеко не так сладка, как кажется.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "g06331d4ba2b4", "n": "Majin and the Forsaken Kingdom (рус.)", "t": "Majin™", "r": "", "gb": 2.4, "x": "", "img": "../covers/g06331d4ba2b4.jpg", "d": "Вор решается войти в покинутое королевство, чтобы защитить свой родной лес от порождений Тьмы. Вскоре он встречает таинственного великана...\n\n Фантастически красивая игра, неповторимый напарник-великан. Двое сражаются с морем врагов и преодолевают множество препятствий, чтобы спасти королевство от Тьмы!\n\nНовая, немного печальная история. Приключенческая игра \"Мадзин. Покинутое королевство\".", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2011"}, {"id": "g9d50ee3e849e", "n": "Mark of the Ninja", "t": "Mark of the Ninja", "r": "", "gb": 1.6, "x": "", "img": "../covers/g9d50ee3e849e.jpg", "d": "Ниндзя силен и в то же время хрупок. Действует стремительно, но взвешивает каждый шаг. В стелс-платформере Mark of the Ninja вам предстоит стать ниндзя, клану которого грозит исчезновение. Наблюдайте за врагами из темноты, манипулируйте их поведением с помощью простых, но эффективных приспособлений – постигните мастерство ниндзя. \n\nMark of the Ninja вышла из-под пера удостоенной наград студии, давшей миру игру Shank. В этой игре на первый план выходят уловки, манипуляции и самоотречение.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2012"}, {"id": "gc3135eb2701f", "n": "Mars War Logs (рус.)", "t": "Mars: War Logs", "r": "", "gb": 1.6, "x": "", "img": "../covers/gc3135eb2701f.jpg", "d": "Компьютерная ролевая игра Mars War Logs отправит вас на Марс, спустя почти век после катаклизма, приведшего планету и ее колонистов к хаосу. Вода стала самым драгоценным ресурсом планеты, и несколько компаний ведут непрерывную войну за контроль над ней.\nВы окажетесь в гуще этого боя, играя за Роя, ренегата, попавшего в эпическое приключение, где значение будет иметь каждый сделанный выбор.", "dl": "ru", "cat": "Жанры игр, Ролевые игры, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2013"}, {"id": "g374261d3574a", "n": "Marvel Avengers Battle for Earth", "t": "Marvel Avengers: B4E", "r": "", "gb": 2.7, "x": "Kinect", "img": "../covers/g374261d3574a.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, польский, португальский, нидерландский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nДля этой игры требуется сенсор Kinect™\n\nВ непревзойденной игре-драке Marvel Avengers™: Battle for Earth с участием супергероев присутствует 20 различных персонажей, включая мстителей: Железного человека, Халка, Капитана Америки и Тора, а также других любимых и забавных персонажей из вселенной Marvel.", "dl": "ru", "cat": "Жанры игр, Kinect", "pl": "", "ru": null, "rel": "2012"}, {"id": "g77d867ae87ef", "n": "Marvel vs. Capcom 2", "t": "Marvel vs. Capcom 2", "r": "", "gb": 0.2, "x": "", "img": "../covers/g77d867ae87ef.jpg", "d": "(Online Interactions Not Rated by the ESRB) Classic arcade fighting with your favorite comic book and Capcom characters!", "dl": "en", "cat": "Classics", "pl": "", "ru": null, "rel": "2010"}, {"id": "g6ef69df49c17", "n": "Marvel vs. Capcom 3", "t": "Marvel vs. Capcom 3: Fate of Two Worlds", "r": "", "gb": 3.0, "x": "", "img": "../covers/g6ef69df49c17.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, японский.\n\nThe latest in Capcom's Versus fighting series is here: Marvel vs. Capcom 3! Choose from your favorite Marvel and Capcom characters in the greatest fighting match-up of all time!", "dl": "ru", "cat": "Жанры игр, Драки", "pl": "", "ru": null, "rel": "2799"}, {"id": "g3ed6e9648c40", "n": "Marvel vs. Capcom 3 ULTIMATE", "t": "Ultimate Marvel vs. Capcom 3", "r": "", "gb": 3.4, "x": "", "img": "../covers/g3ed6e9648c40.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, японский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».", "dl": "ru", "cat": "Жанры игр, Драки", "pl": "", "ru": null, "rel": "2799"}, {"id": "g5293fd1e0779", "n": "Mass Effect", "t": "", "r": "", "gb": 10.3, "x": "", "img": "../covers/g5293fd1e0779.jpg", "d": "Mass Effect™– это научно-фантастическая ролевая игра (RPG), созданная компанией BioWare, заслужившим признание рынка и критиков разработчиком таких RPG-игр, как Jade Empire™, Star Wars®: Knights of the Old Republic™, Neverwinter Nights и серии Baldur's Gate . Mass Effect – дает игроку полный эффект погружения, оформленный в изумительный видеоряд.\n\nИздателем игры является Microsoft Game Studios. Mass Effect – выпускается только для системы игр и развлечений Xbox 360™. В роли первого человека в рядах «Призраков» – преданных защитников галактического мира, миссия игрока – остановить наступление армий легендарного агента, принявшего сторону зла. Ведите свою элитную команду по враждебным чужим мирам и раскройте истинные масштабы вселенской угрозы.", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2007"}, {"id": "gf3c6d1403d78", "n": "Mass Effect 2", "t": "Mass Effect 2 Disc 2", "r": "", "gb": 17.5, "x": "", "img": "../covers/gf3c6d1403d78.jpg", "d": "В разных уголках галактики внезапно пустеют человеческие колонии. В роли капитана Шепарда вам придется собрать команду из самых опытных специалистов, чтобы вместе отправиться в опаснейшую область космоса, из которой еще никто пока не возвращался. Вы сможете загрузить новое снаряжение и получить новые задания, чтобы приключения не заканчивались даже после выполнения основной миссии. Поговаривают, что это задание - настоящее самоубийство. Вы способны доказать, что это не так!", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2010"}, {"id": "gccb88c8c76ce", "n": "Mass Effect 3", "t": "Mass Effect 3 Disc 1", "r": "", "gb": 26.7, "x": "", "img": "../covers/gccb88c8c76ce.jpg", "d": "Не всем суждено выжить. Древняя инопланетная раса, известная как Жнецы, начала глобальное вторжение, оставляя за собой руины цивилизаций. Земля захвачена, галактика стоит на грани полного уничтожения, и только ты можешь исправить положение. Цена ошибки - небытие. Твоя роль - капитан Шепард, персонаж, которого создаешь ты сам. Только ты решаешь, как будут разворачиваться события, какие планеты будут исследованы, и кто станет участником альянса, который ты соберешь, чтобы раз и навсегда ликвидировать угрозу со стороны Жнецов. Ты поведешь эту войну на свое усмотрение: можешь атаковать в лоб, поливая врага огнем или составить хитрый план внезапного нападения. Собери универсальный отряд профессионалов или выбери путь одинокого волка. Атакуй противника с расстояния или сойдись с ним в жестокой рукопашной. Mass Effect 3 будет реагировать на каждое принятое тобой решение - эту историю предстоит ", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Ролевые игры, Kinect", "pl": "", "ru": null, "rel": "2012"}, {"id": "ga48348bc8b81", "n": "Max payne 3", "t": "Max Payne 3 Disc 1", "r": "", "gb": 16.7, "x": "", "img": "../covers/ga48348bc8b81.jpg", "d": "Версия Games on Demand поддерживает английский, французский, итальянский, немецкий, испанский, польский, португальский бразильский и русский языки.\n\nMax Payne 3 – это кинематографичный боевик от Rockstar Games, примечательный детализированной графикой и полным отсутствием экранов загрузки. Революционная механика стрельбы (Bullet Time® и Shootdodge™) сочетается в этой игре с мрачным сюжетом, полным неожиданных и жутких поворотов.\n\n©2004-2012 Rockstar Games. Rockstar Games, R* и Max Payne являются товарными знаками Take-Two Interactive Software. Значок (или значки) рейтинга и прочие логотипы являются собственностью соответствующих владельцев. Все права сохранены.\n\nДанная видеоигра является полностью вымышленной. Любое сходство с настоящими событиями, людьми, организациями или продуктами является ненамеренным. Take Two не одобряет демонстрируемое в игре поведение и не призывает пользователе", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2012"}, {"id": "g211fe39ff010", "n": "Max The Curse Of Brotherhood", "t": "MAX TCoB", "r": "", "gb": 2.1, "x": "", "img": "../covers/g211fe39ff010.jpg", "d": "«Макс: Проклятие братства» - это динамичное приключение, полное интересных загадок и необычных решений. В фантастическом и враждебном мире, где зло скрывается за каждым поворотом, вооруженный лишь волшебным маркером Макс должен спасти своего младшего брата, Феликса. Пуститесь в приключение вместе с Максом!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Платформер, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2014"}, {"id": "gafef927f77e3", "n": "Medal of Honor 2010 (рус.)", "t": "Medal of Honor", "r": "", "gb": 5.9, "x": "", "img": "../covers/gafef927f77e3.jpg", "d": "Об этом специальном отряде, напрямую подчиняющемуся Верховному командованию и используемому для выполнения самых ответственных заданий, мало что известно. Они - элита спецназа.\nБолее 2 миллионов солдат, моряков, летчиков и десантников носят форму. Из них примерно 50 тысяч напрямую подчиняются командованию войск специального назначения. Бойцы элитного спецназа вне этой системы. Они на уровень выше самого лучшего из обычных спецназовцев. Их точная численность неизвестна, хотя говорят, что их всего несколько сотен. Это живые, мыслящие, безжалостные инструменты войны. Применять силу - их работа. Новая игра из серии Medal of Honor создавалась при участии бойцов того самого элитного спецназа. Игрокам предстоит почувствовать себя в шкуре этих бойцов и применить все свои уникальные навыки в борьбе с новым врагом во враждебных условиях Афганистана наших дней.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g72b89a251d38", "n": "Medal of Honor Airborne 2007 (рус.)", "t": "Medal of Honor: Airborne", "r": "", "gb": 6.4, "x": "", "img": "../covers/g72b89a251d38.jpg", "d": "Take to the skies in Medal of Honor Airborne, where your choices will turn the tide of WWII.  Starting with your jump from a C-47, every choice you make can seal your fate.  In the air, control your parachute to select the landing spot that brings you the greatest strategic advantage.  On the ground, explore the open, vertical environment for positions that will provide you a tactical edge against your enemies.  Then, head onto Xbox LIVE for furious multiplayer battles in three different modes,", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g62ab336ecf9c", "n": "Medal of Honor Warfighter 2012 (рус.)", "t": "Medal of Honor: Warfighter", "r": "", "gb": 9.7, "x": "", "img": "../covers/g62ab336ecf9c.jpg", "d": "При создании Medal of Honor™ Warfighter разработчиков консультировали бойцы Первого ранга, принимавшие участие в реальных боевых действиях по всему земному шару. Игрок сможет ощутить себя в шкуре настоящего бойца элитного отряда, почувствовать всю агрессию и грязь настоящего боя. Medal of Honor Warfighter - это возможность увидеть современную войну своими глазами и дать отпор глобальной террористической угрозе. \n\nВ Medal of Honor Warfighter рассказывается история бойца Первого ранга по прозвищу “Проповедник”. Он вернулся домой после долгой зарубежной командировки и обнаружил, что его семья не перенесла долгой разлуки и распалась. Пытаясь спасти остатки брака, \"Проповедник\" вспоминает за что он сражался - за семью. Но когда сильнейшая взрывчатка проникает в его мирную жизнь и два мира смыкаются воедино, \"Проповедник\" и его боевые товарищи отправляются решать проблему. Они принимают бой и ", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "g9c79f71c443b", "n": "Megamind", "t": "Megamind", "r": "", "gb": 2.4, "x": "Детские", "img": "../covers/g9c79f71c443b.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\nJoin Megamind on his journey to track down the Doom Syndicate and the mastermind behind the latest attacks on the City. Megamind is an exciting action game that furthers the adventures of our slender blue hero, with beautiful graphics and compelling game-play.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Семейные игры, Платформер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g429355fa7b4f", "n": "Mercenaries 2", "t": "Mercenaries 2", "r": "", "gb": 6.9, "x": "", "img": "../covers/g429355fa7b4f.jpg", "d": "В игре нового поколения Mercenaries 2 вам предстоит навести шороху в Южной Америке. Создайте собственную военную организацию, чтобы найти и уничтожить опасного террориста, но не забывайте, что в Венесуэле разгорается война. Мы создаем в игре уникальный мир, в котором есть и \"горячие точки\", и относительно мирные регионы. У вас будет возможность уничтожать все на своем пути - и это не пустое обещание! В распоряжении персонажей будет лучшее вооружение и техника - как военная, так и гражданская. Кроме того, в Mercenaries 2 будет реализована возможность, которую так долго ждали игроки, - возможность прохождения в режиме совместной игры!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g686767a6d9e0", "n": "Metal Gear Rising", "t": "METAL GEAR RISING", "r": "", "gb": 8.0, "x": "", "img": "../covers/g686767a6d9e0.jpg", "d": "METAL GEAR RISING: REVENGEANCE takes the renowned METAL GEAR franchise into exciting new territory by focusing on delivering an all-new action experience unlike anything that has come before. ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2013"}, {"id": "gea3d5bf734d3", "n": "Metal Gear Solid Peace Walker", "t": "MGS PEACE WALKER HD", "r": "", "gb": 8.7, "x": "", "img": "../covers/gea3d5bf734d3.jpg", "d": "1974 The Peace Walker Incident To preserve peace and neutrality in Costa Rica, the \"Soldiers without Borders\" move into action.  In time, they would come to be known as the founders of \"Outer Heaven.\"  ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "g89ced5102831", "n": "Metal Gear Solid V The Phantom Pain", "t": "", "r": "", "gb": 9.8, "x": "", "img": "../covers/g89ced5102831.png", "d": "【Важные уведомления】\nВерсия Xbox 360 «METAL GEAR SOLID V: THE PHANTOM PAIN» и «METAL GEAR ONLINE» будет прекращена онлайн-сервиса в 6 часов (UTC) 31 мая 2022 года.\nВы можете играть в основную игру в автономном режиме даже после окончания работы онлайн-сервиса.\n\nВ играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, португальский, Русский, японский. Перейдите в новую эру франшизы с\nпередовыми технологиями, работу которых обеспечивает графический процессор Fox Engine. Игроков ожидает масса положительных эмоций, поскольку теперь им будет предоставлена свобода выбора тактики в миссиях в открытом мире.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2015"}, {"id": "gb2d8fe64a975", "n": "Metro 2033", "t": "", "r": "", "gb": 5.2, "x": "", "img": "../covers/gb а при виде Naughty Bear (симпатичного, но на всю голову больного плюшевого медведя, вымещающего свой гнев на незадачливых медведях Perfection Island). Громите, крушите и убивайте милых и пушистых мишек, вставших на вашем пути.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "g03e313a45748", "n": "NBA Jam", "t": "NBA JAM", "r": "", "gb": 1.3, "x": "", "img": "../covers/g03e313a45748.jpg", "d": "BOOMSHAKALAKA!  NBA JAM возвращается – еще лучше, чем прежде, – ее представляет вам EA SPORTS™.", "dl": "ru", "cat": "Жанры игр, Спорт и отдых", "pl": "", "ru": null, "rel": "2010"}, {"id": "g07efe44bbd23", "n": "NBA Street", "t": "NBA STREET Homecourt", "r": "", "gb": 4.7, "x": "", "img": "../covers/g07efe44bbd23.jpg", "d": "NBA STREET Homecourt merges legendary playgrounds with the hometown courts of your favorite NBA stars. Set roots in your own homecourt as an anonymous baller with big dreams. Earn a name for yourself and garner respect as you progress along your hometown journey and become a legend", "dl": "en", "cat": "Sports & Recreation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g3776b9a39879", "n": "Need for Speed Hot Pursuit", "t": "NFS Hot Pursuit", "r": "", "gb": 7.6, "x": "", "img": "../covers/g3776b9a39879.jpg", "d": "This November, Need for Speed Hot Pursuit will transform online entertainment for this generation.  Criterion Games is redefining the meaning of cops versus racers by providing players with the opportunity to play a full career as either a cop or a racer, advancing through the ranks by accruing bounty.Players will experience stunning speeds, takedowns and getaways as they chase, battle, escape or bust their buddies.The innovative Need for Speed Autolog is poised to re-think head-to-head social …", "dl": "en", "cat": "Action & Adventure, Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "g3fb9ca1e4f6d", "n": "Need for Speed Most Wanted 2012", "t": "NFS: Most Wanted", "r": "", "gb": 3.8, "x": "", "img": "../covers/g3fb9ca1e4f6d.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, нидерландский, польский, русский, японский и китайский языки.\n\nПолучить статус самого разыскиваемого не так просто: для этого нужно одурачить копов, обогнать друзей и обхитрить соперников. Полицейские следуют за вами по пятам, так что решения придется принимать в доли секунды. Открытый мир игры предлагает вам укрытия, трамплины и новые машины - будьте на шаг впереди соперников.\nКак и во всех играх от Criterion Games, друзья - основной элемент вашей игры. В открытом мире игры не будет никаких меню и фойе. Вы можете мгновенно начинать разнообразные соревнования с друзьями и показывать им свое водительское мастерство. Соперники сделают все, чтобы не дать вам забраться на вершину. Но здесь есть только один самый разыскиваемый.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Авиасимуляторы и автогонки, Kinect", "pl": "", "ru": null, "rel": "2012"}, {"id": "g5cfde6526f82", "n": "Need for Speed Rivals", "t": "Need for Speed™ Rivals", "r": "", "gb": 9.4, "x": "", "img": "../covers/g5cfde6526f82.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, нидерландский, польский, португальский, русский, японский, и китайский языки.\n\nВы можете загрузить руководство пользователя для данной игры, пройдя по ссылке https://help.ea.com/ru/tag/manuals и выбрав соответствующее название в выпадающем списке \"Продукты\".\n\nДобро пожаловать в округ Редвью, где вражда на дорогах между полицией и гонщиками не прекращается ни на секунду - обе стороны сражаются за всеобщее внимание в реалистичной дорожной обстановке, стремясь обладать самыми быстрыми машинами, улучшениями и техническими средствами. Играйте в роли полицейского или гонщика - для каждой из сторон есть свои испытания, награды и последствия. Рискуйте всем в этом величайшем состязании с высокими ставками.", "dl": "ru", "cat": "Жанры игр, Авиасимуляторы и автогонки", "pl": "", "ru": null, "rel": "2013"}, {"id": "ga106f6af5a85", "n": "Need for Speed SHIFT", "t": "Need for Speed™ SHIFT", "r": "", "gb": 4.5, "x": "", "img": "../covers/ga106f6af5a85.jpg", "d": "Download the manual for this game by locating the game on http://marketplace.xbox.com and selecting “See Game Manual\". \n\nВ Need for Speed™ SHIFT вы можете по-настоящему ощутить, что значит сесть за руль мощной гоночной машины. Фантастические новые возможности, такие как, реалистичный вид из кабины и абсолютно новая физическая модель аварий, дают вам ни с чем не сравнимое чувство скорости и ощущение машины в предельных режимах. Вне зависимости от того, играете вы в сети или развиваете собственную карьеру, ваш уникальный профиль пилота будет изменяться от гонки к гонке - вы будете награждены за то, что управляете машиной в собственном стиле.", "dl": "ru", "cat": "Жанры игр, Авиасимуляторы и автогонки", "pl": "", "ru": null, "rel": "2010"}, {"id": "g273f5fcaa17d", "n": "NFS Carbon", "t": "Need for Speed: Carbon", "r": "", "gb": 5.4, "x": "", "img": "../covers/g273f5fcaa17d.jpg", "d": "The Battle for the City is Won in the Canyon What starts in the city is settled in the canyons as Need for Speed™ Carbon immerses you in the world’s most dangerous and adrenaline-filled form of street racing. You and your crew must race in an all-out war for the city, risking everything to take over your rivals’ neighborhoods one block at a time. As the police turn up the heat, the battle ultimately shifts to Carbon Canyon, where territories and reputations can be lost on every perilous curve. W", "dl": "en", "cat": "Action & Adventure, Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "g4dcb1ea76af3", "n": "NFS Most wanted 2005", "t": "NFS Most Wanted", "r": "", "gb": 7.4, "x": "", "img": "../covers/g4dcb1ea76af3.jpg", "d": "Wake up to the smell of burnt asphalt as the thrill of illicit street racing permeates the air. From the makers of the hit Need for Speed™ Underground series that has sold more than 15 million copies worldwide, Need for Speed™ Most Wanted challenges you to become the most notorious and elusive street racer.  Some multi-player functionalities may no longer be supported.", "dl": "en", "cat": "Action & Adventure, Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "gf73ca6a59110", "n": "NFS ProStreet", "t": "Need for Speed: ProStreet", "r": "", "gb": 5.4, "x": "", "img": "../covers/gf73ca6a59110.jpg", "d": "Compete at the highest level of street racing with Need for Speed ProStreet. It’s no longer good enough to simply rule your local neighborhood; you need to dominate on a global stage. Build the ultimate battle machine, take it to multi-disciplinary showdowns and pit your skills and reputation against the world’s best street racers. Every dent, every scratch and every crumpled body panel is a battle scar, proof of your commitment and competitive mettle. This is your chance to prove that you have", "dl": "en", "cat": "Action & Adventure, Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "g20d0cbf43a0b", "n": "NFS Shift 2 Unleashed", "t": "Shift 2: Unleashed", "r": "", "gb": 6.3, "x": "", "img": "../covers/g20d0cbf43a0b.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, русский.\n\nSHIFT 2 UNLEASHED™ - новая игра в заслужившей признание критиков серии SHIFT. Эта игра позволяет получить сравнимые с управлением реальной машиной ощущения от вождения и почувствовать адреналин в гонках и состязаниях с другими пилотами. Принципиально новая камера на шлеме пилота, ночные гонки, пугающе реальная физика и столкновения — все это позволяет погрузиться в волнующую атмосферу автогонок и получить незабываемый гоночный опыт в игре SHIFT 2 UNLEASHED™.", "dl": "ru", "cat": "Жанры игр, Авиасимуляторы и автогонки, Стратегии и симуляторы", "pl": "", "ru": null, "rel": "2011"}, {"id": "g163feb1 ars... This is the masterpiece of horror strategy. Semi real time battle system provides the reality of actual battle. All features in WW2 like scorching desert, severe cold snowfield, violent street fighting and existing army weapons are very realistic too.  As a member of British secret special command \"Blood Pack\", fight and complete special missions! Battle, plot, tragedy, failure... overcome dramatic events to reveal enemy's conspiracy, and grab the peace", "dl": "en", "cat": "Strategy & Simulation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g50276b24f570", "n": "Operation Flashpoint Dragon Rising", "t": "Operation Flashpoint: Dragon Rising", "r": "", "gb": 6.8, "x": "", "img": "../covers/g50276b24f570.jpg", "d": "Operation Flashpoint®: Dragon Rising™ takes gamers as close to war as they'll ever want to get; recreating the brutal reality of the modern combat experience in stunning detail. Through an epic single and multi-player campaign set on a vast open-world battlefield, Operation Flashpoint®: Dragon Rising™ challenges players to survive the chaos and rapidly evolving situations of contemporary warfare.", "dl": "en", "cat": "Action & Adventure, Strategy & Simulation", "pl": "", "ru": null, "rel": "2009"}, {"id": "ge231043b1af2", "n": "Otomedius Excellent", "t": "Otomedius Exellent", "r": "", "gb": 2.4, "x": "", "img": "../covers/ge231043b1af2.jpg", "d": "It's time to SHOOT THE CORE in this all-new Gradius-style shooter, featuring the lovely ladies of OTOMEDIUS in their first North American appearance.", "dl": "en", "cat": "Classics, Shooter", "pl": "", "ru": null, "rel": "2011"}, {"id": "g7367ffc47e0b", "n": "Overlord 2 (рус.)", "t": "Overlord II", "r": "", "gb": 2.3, "x": "", "img": "../covers/g7367ffc47e0b.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский. Загрузите руководство для этой игры, выбрав игру на сайте http://marketplace.xbox.com, а затем нажмите \"См. руководство игры\". \n\nOverlord II, sequel to the critically acclaimed cult hit, sees the return of the chaotic Minions and their new Dark Master. Bigger, badder and more beautifully destructive, Overlord II has a Glorious Empire to smash, a massive Netherworld to revive, Minion mounts to mobilise, a trio of mistresses to woo, War Machines to crush opposition and lots of cute creatures to, err... murder (and a mini-map)", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Ролевые игры", "pl": "", "ru": null, "rel": "2009"}, {"id": "g019ca4dac31a", "n": "Painkiller Hell and Damnation (рус.)", "t": "Painkiller H&D", "r": "", "gb": 2.1, "x": "", "img": "../covers/g019ca4dac31a.jpg", "d": "Игра по запросу\" доступна на английском, французском, немецком, испанском языках Венгерский, польский и чешский. Руководство пользователя вы сможете прочитать, найдя игру на http://marketplace.xbox.com и выбрав \"См. руководство к игре\".\nУбийца из загробного мира вернулся... И жаждет мести.\nЗло снова здесь! Демонические силы в образе мириад ужасных созданий сражаются за души, томящиеся в Чистилище.\nИ вновь Дэниел Гарднер оказывается в незавидном положении Проклятья Тьмы и Игрушки Света, с боем продираясь сквозь орды демонов и чудовищ. \nИ здесь остается два вопроса... \"В состоянии ли один человек уничтожить могущественные силы, вставшие у него на пути? Сможет ли он выбраться из Чистилища и воссоединиться с женой?\"\nPainkiller Hell & Damnation - захватывающий современный триллер, ремейк классического убойного шутера!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "gd23e98a01eaf", "n": "Payday 2", "t": "PAYDAY 2", "r": "", "gb": 6.4, "x": "", "img": "../covers/gd23e98a01eaf.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nPAYDAY 2 — это шутер для 4
