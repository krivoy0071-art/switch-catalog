rry out assassination, infiltration and sabotage. In a dark and gruesome Europe ravaged by war, …", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2009"}, {"id": "g4844063259a4", "n": "Venetica", "t": "Venetica", "r": "", "gb": 5.1, "x": "", "img": "../covers/g4844063259a4.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\nBecome as powerful as Death himself in this action-packed cinematic RPG which hides a huge game world and a wealth of features under a simple and beautiful interface.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Ролевые игры", "pl": "", "ru": null, "rel": "2009"}, {"id": "g9fa6184c8816", "n": "Virtua Fighter 5 ENG", "t": "Virtua Fighter 5 FS", "r": "", "gb": 4.1, "x": "", "img": "../covers/g9fa6184c8816.jpg", "d": "Разбуди в себе воина и приготовься к последнему бою! Virtua Fighter 5 Final Showdown включает все улучшения с 2007 года.", "dl": "ru", "cat": "Жанры игр, Драки, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2012"}, {"id": "ge94b1f3f7443", "n": "Virtua Tennis 4", "t": "Virtua Tennis 4", "r": "", "gb": 3.3, "x": "Kinect", "img": "../covers/ge94b1f3f7443.jpg", "d": "The No.1 selling tennis series is back with an all-star line-up including Nadal, Federer, Murray, Djokovic, Del Potro, Sharapova, Williams and Wozniacki. Virtua Tennis 4 lets you play with Kinect™  or your Xbox 360 Controller and comes with a host of features including, a new career mode and online centre.", "dl": "en", "cat": "Sports & Recreation", "pl": "", "ru": null, "rel": "2011"}, {"id": "g9f0f25078108", "n": "Wanted Weapons of Fate", "t": "", "r": "", "gb": 7.2, "x": "", "img": "../covers/g9f0f25078108.jpg", "d": "Featuring intense third-person action, the Wanted video game will take combat to the next level with iconic moves—such as \"Curving Bullets\" and \"Assassin Time\"—drawn directly from the film, as well as an innovative, multi-layered cover mechanic.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "ga14cabb4ee9f", "n": "Warhammer 40000 Space Marine (рус.)", "t": "Warhammer 40,000: Space Marine", "r": "", "gb": 6.3, "x": "", "img": "../covers/ga14cabb4ee9f.jpg", "d": "Step fearlessly into the heart of combat as Captain Titus of the Ultramarines, unleashing visible violent death against the enemies of mankind in the first 3rd person action shooter set in the dark future of the Warhammer 40,000 universe.  Storm into battle and use a combination of the most lethal ranged and melee weapons against the feral Orks and insidious forces of Chaos. Form your own Space Marine squad or Chaos Space Marine warband and take the battle online. ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "geb676ec02627", "n": "Warhammer Battle March", "t": "Warhammer: Mark of Chaos", "r": "", "gb": 7.3, "x": "", "img": "../covers/geb676ec02627.jpg", "d": "Warhammer: Battle March {\\n}brings the brutality, strategy and drama of warfare to life {\\n}with six unique playable armies, fully customizable units {\\n}and intense online clashes.", "dl": "en", "cat": "Strategy & Simulation", "pl": "", "ru": null, "rel": "2008"}, {"id": "g2fc352d35540", "n": "Warriors Legends Of Troy (рус.)", "t": "", "r": "", "gb": 6.6, "x": "", "img": "../covers/g2fc352d35540.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\nТри тысячи лет назад, поэт пел о героях достаточно сильны, чтобы один против целой армии.\nВ Warriors: Legends Трои, опыт эпического Троянской войны с точки зрения как греки и троянцы, как две великие битвы народов за любовь к одной женщине.\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Драки", "pl": "", "ru": null, "rel": "2011"}, {"id": "gf2a553afa875", "n": "Watch Dogs", "t": "", "r": "", "gb": 9.5, "x": "", "img": "../covers/gf2a553afa875.jpg", "d": "В играх по запросу поддерживаются английский. \n\nДля французской, немецкой, испанской, итальянской, русской и португальской версий потребуется загрузить бесплатный дополнительный языковой пакет через пункт \"Дополнительный контент\" в главном меню игры.\n\nНовейшая компьютерная система в Чикаго управляет всеми устройствами в городе и содержит информацию обо всех его жителях. \nВы играете за Эйдена Пирса - хакера и бывшего убийцу, чье прошлое приведет к семейной трагедии. В погоне за теми, кто причинил зло вашей семье, манипулируя городскими системами, вы сможете взламывать любые устройства, отключать светофоры и электросети, загружать личные данные и многое другое.\nГород Чикаго - ваше особое оружие возмездия.\nВ мире технологий наше оружие - взлом!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2014"}, {"id": "g819db349a613", "n": "Way of the Samurai 3 (рус.)", "t": "Way of the Samurai 3", "r": "", "gb": 3.0, "x": "", "img": "../covers/g819db349a613.jpg", "d": "The consequences of your actions will determine your fate. Choose to fight along side good or evil during the tumultuous time of the Sengoku Era and carve your name into history. Take the role of a samurai and choose your own path, blazing a trail of honor, loyalty and respect, or one of villainy, corruption, murder and greed. Become a hero or become infamous, the choice is yours. With over 15 different endings, every action has a reaction and the following consequences open up new paths to exp…", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g7d2dd76bfbb0", "n": "WET", "t": "WET", "r": "", "gb": 4.6, "x": "", "img": "../covers/g7d2dd76bfbb0.jpg", "d": "WET is a highly-stylized third person shooter that seamlessly blends gun play, sword kills and over-the-top acrobatics to create the ultimate interactive action experience. The game allows you to shoot anywhere, anytime. You will have the freedom to shoot while running, sliding down ladders, sliding across the floor, or performing any number of acrobatic moves. Featuring an ironic mix of humor and violence, unique retro film visual treatment, and original 70’s inspired music, WET is a third-per…", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "gac64cb92539b", "n": "Wolfenstein (рус.)", "t": "Wolfenstein", "r": "", "gb": 6.8, "x": "", "img": "../covers/gac64cb92539b.jpg", "d": "Обратите против нацистов их собственные темные силы, вступив в схватку с невообразимым злом.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2009"}, {"id": "g2fbc3c653b38", "n": "Wolfenstein The New Order (рус.)", "t": "Wolfenstein®: TNO Disc 4", "r": "", "gb": 23.2, "x": "", "img": "../covers/g2fbc3c653b38.jpg", "d": "Европа, 1960 год. Используя таинственные передовые технологии, запугивание и грубую силу, нацистская Германия победила во Второй мировой войне, поставив на колени даже самые сильные нации, и теперь держит весь земной шар в своем железном кулаке. Вы — Би Джей Бласковиц, американский солдат-герой. Только вы можете сломить ход истории.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2014"}, {"id": "gab8fa13a1b17", "n": "Worms Revolution", "t": "Worms™ Revolution", "r": "", "gb": 0.5, "x": "", "img": "../covers/gab8fa13a1b17.jpg", "d": "Worms™ Revolution – это взрывающаяся овца, подложенная под конфликт между червями и отправляющая его прямиком в 21-е столетие.\n• 32 миссии и 20 миссий-головоломок.\n• 4 уникальных типов местности.\n• Локальные бои или бои в Интернете с максимум 4-мя игроками.\n• 3 разных игровых режимов.\n• 3 разных классов червей.\n• Широкие возможности настройки!\n• Новая динамическая вода и физические объекты.\n• Новые виды оружия.\n• Увлекательный сценарий.", "dl": "ru", "cat": "Жанры игр, Стратегии и симуляторы, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2012"}, {"id": "gbf0ef80b9882", "n": "WRC 5", "t": "WRC5", "r": "", "gb": 4.4, "x": "", "img": "../covers/gbf0ef80b9882.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.Машины, пилоты, официальные ралли — в 2015 FIA World Rally Championship есть ВСЕ, что положено симулятору гонок.\nРеалистичная передача езды по различным дорожным покрытиям и рельефам, динамический урон, система день/ночь, погода... Испытайте всю гамму ощущений от авторалли в WRC 5!", "dl": "ru", "cat": "Жанры игр, Авиасимуляторы и автогонки, Спорт и отдых", "pl": "", "ru": null, "rel": "2015"}, {"id": "g47385b32d73e", "n": "WSC Real 2011", "t": "WSC Real 2011", "r": "", "gb": 4.2, "x": "", "img": "../covers/g47385b32d73e.jpg", "d": "Welcome to the Official game of World Snooker, with all the top players and real tournaments. The all new K4 physics system provides jaw dropping ball behaviour in super-slow motion replays - you can even watch your shot unwind in reverse. WSC Real 2011 now includes online tournaments, a refined control system, and the ability to save every shot in a match and continue playing from any point in time!", "dl": "en", "cat": "Independent & Music Videos, Music and Short Videos, Sports, Sports & Recreation, Xbox LIVE Marketplace", "pl": "", "ru": null, "rel": "2011"}, {"id": "g8595f7af2774", "n": "ww 13", "t": "", "r": "", "gb": 8.2, "x": "", "img": "../covers/g8595f7af2774.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский. Загрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре». Окунитесь в Эру Аттитюды WWE в новом и уникальном сюжетном режиме. Новая система представления WWE Live™ предлагает вам полностью переработанную звуковую картину и множество зрелищных моментов. WWE ’13 обещает стать самым энергичным, реалистичным и увлекательным симулятором WWE всех времен.", "dl": "ru", "cat": "Жанры игр, Драки", "pl": "", "ru": null, "rel": "2012"}, {"id": "g7af33277ad6c", "n": "WWE 2K17", "t": "", "r": "", "gb": 7.8, "x": "", "img": "../covers/g7af33277ad6c.png", "d": "ПРИМЕЧАНИЕ: все серверы сетевого режима игры WWE 2K17 будут отключены 31/05/2018. Начиная с этого времени, все функции игры, требующие соединения с онлайн-серверами, станут недоступны.\n\nВ играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, японский и китайский языки. \n\nДобро пожаловать в Suplex City, появившийся на свет при содействии Superstar Brock Lesnar! WWE 2K17 - новый действующий чемпион во флагманской серии видеоигр, посвященных рестлингу!", "dl": "ru", "cat": "Жанры игр, Драки, Спорт и отдых", "pl": "", "ru": null, "rel": "2016"}, {"id": "g348076b6adb7", "n": "X-Blades", "t": "X-Blades", "r": "", "gb": 2.2, "x": "", "img": "../covers/g348076b6adb7.png", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, чешский, венгерский, польский, русский.\n\nХ-Blades: искрометный экшн в аниме-стилистике", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2009"}, {"id": "gb8a48d1ed79e", "n": "X-Men 2006", "t": "X-Men: The Official Game", "r": "", "gb": 6.7, "x": "", "img": "../covers/gb8a48d1ed79e.jpg", "d": "Wield the fury of Wolverine, the agility of Nightcrawler, and the speed of Iceman in an all-new action adventure game.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "g8c1fffb64128", "n": "X-Men Destiny 2011", "t": "X-Men: Destiny", "r": "", "gb": 8.0, "x": "", "img": "../covers/g8c1fffb64128.png", "d": "В играх по запросу поддерживаются английский, немецкий.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nFate has dealt you a new hand: A destiny yet unwritten. Seize the power, and the future will show you who yo
