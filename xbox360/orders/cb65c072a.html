анды бегают и ведут себя как в реальности. Все новые элементы Полного контроля в PES 2013 дают вам абсолютный контроль за каждым движением, это означает, что двух одинаковых голов не будет. ID игрока усиливает эффект, так как лучшие игроки двигаются и ведут себя как их реальные прототипы.", "dl": "ru", "cat": "Жанры игр, Спорт и отдых", "pl": "", "ru": null, "rel": "2012"}, {"id": "gf6137cfeb9f5", "n": "PES 2018", "t": "[X360-CLUB] PES 2018", "r": "", "gb": 6.2, "x": "", "img": "../covers/gf6137cfeb9f5.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, русский, нидерландский, и турецкий. \nВозвращение игры PES проходит под лозунгом «Здесь воспитывают легендарных игроков» — вас ждут новые функции, режимы и невероятный игровой процесс.\n\nВсе элементы в игре PES 2018 переработаны и улучшены — вас ждут новые режимы, улучшения геймплея, режим случайного выбора матча и полностью обновленный дизайн с реалистичными моделями игроков , а также новыми меню.", "dl": "ru", "cat": "Жанры игр, Спорт и отдых", "pl": "", "ru": null, "rel": "2017"}, {"id": "gee7785830c78", "n": "Peter Jacksons King Kong", "t": "Peter Jacksons King Kong", "r": "", "gb": 7.0, "x": "", "img": "../covers/gee7785830c78.jpg", "d": "Capturing the imagination, vision, and emotion of this epic, you will delve deeper into the film, playing as both Jack Driscoll and the great Kong himself. Experience these alternative viewpoints to truly feel the tension of the adventure.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2005"}, {"id": "gdfa4fff1412d", "n": "PGR 3", "t": "Max Public Slots", "r": "", "gb": 6.5, "x": "", "img": "../covers/gdfa4fff1412d.jpg", "d": "PGR 3", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2008"}, {"id": "g5862422831a1", "n": "PGR 4", "t": "PGR 4", "r": "", "gb": 6.2, "x": "", "img": "../covers/g5862422831a1.jpg", "d": "Global competition with Kudos, iconic cars, and blazing bikes", "dl": головоломки и широкая сюжетная линия.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2011"}, {"id": "gd1574f1fe12c", "n": "Portal Still Alive", "t": "Portal: Still Alive", "r": "", "gb": 0.7, "x": "", "img": "../covers/gd1574f1fe12c.png", "d": "As unwilling test subjects in a sinister laboratory, players must break the laws of physics using ‘portal’ technology to solve puzzles and survive. Featuring a darkly comic story that weaves adventure with brain-bending puzzles; ‘Portal: Still Alive’ also introduces 14 brand new bonus puzzles to challenge even the most skilled test subjects. Players can also get a glimpse into the making of ‘Portal: Still Alive’ with commentary from the developers.", "dl": "en", "cat": "Puzzle & Trivia", "pl": "", "ru": null, "rel": "2010"}, {"id": "g81fb8208c92c", "n": "Prey", "t": "Prey", "r": "", "gb": 4.7, "x": "", "img": "../covers/g81fb8208c92c.jpg", "d": "Prey tells the story of Tommy, a Cherokee garage mechanic stuck on a reservation going nowhere. Along with his people, he is abducted to a menacing mothership orbiting Earth, where he sets out to save himself, his girlfriend, and eventually his planet.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g2ef536fc5c5a", "n": "Prince of Persia", "t": "", "r": "", "gb": 4.4, "x": "", "img": "../covers/g2ef536fc5c5a.jpg", "d": "Пройдите путь молодого воина, оказавшегося между сражающимися силами Добра и Зла. Бросьте вызов темному богу и спасите древнее персидское царство от чумы, грозящей уничтожить весь мир.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Платформер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g4b4d3c82d874", "n": "Prince of Persia The Forgotten Sands", "t": "", "r": "", "gb": 4.8, "x": "", "img": "../covers/g4b4d3c82d874.jpg", "d": "Пройдите путь молодого воина, который оказался втянутым в битву между силами добра и зла. Бросьте вызов темному богу, избавьте древнее персидское царство от нашествия смертоносной тьмы и спасите мир.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "g61a0f91b15dc", "n": "Prison Break The Conspiracy (рус.)", "t": "Prison Break", "r": "", "gb": 2.8, "x": "", "img": "../covers/g61a0f91b15dc.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\nPrison Break - The Conspiracy takes you inside the Prison Break world like you've never experienced it before. You are Tom Paxton, a Company agent sent inside Fox River Penitentiary to observe and report on prisoner Michael Scofield... What you encounter will change your Prison Break experience forever.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Драки, Платформер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g8302b64bd852", "n": "Prizefighter Don King Presents", "t": "Don King Presents - Prizefighter", "r": "", "gb": 6.9, "x": "", "img": "../covers/g8302b64bd852.jpg", "d": "Don King Presents Prizefighter is equal parts sports simulation and true boxing drama that takes place both inside and outside the ring. Build your boxing career from rags to riches and see your story unfold in a unique sports documentary style featuring famous boxers, celebrities, and Don King himself. Or play with up to 8 people on Xbox Live using any of the 40 professional boxers available or a customized boxer creation of your own. Need to work up a quick sweat, simply unleash your pugilisti", "dl": "en", "cat": "Sports & Recreation", "pl": "", "ru": null, "rel": "2008"}, {"id": "g5bc6e19232b5", "n": "Project Sylpheed (рус.)", "t": "[X360-CLUB] Project Sylpheed - Arc of Deception [RUS]", "r": "", "gb": 6.6, "x": "", "img": "../covers/g5bc6e19232b5.jpg", "d": "Project Sylpheed is an engaging space saga from Square Enix, the makers of Final Fantasy & Kingdom Hearts. For five centuries, Terran forces have colonized the galaxy. The rebel ADAN “Freedom Alliance” has declared war to end the so-called “Terran tyranny”. Two best friends and up-and-coming Terran ace pilots--Katana and Margras--are separated by the unstable political situation on Margras’ home planet of Acheron. Soon after Margras is forced into exile, Acheron is destroyed in a suspicious acci", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g40ddf3497db6", "n": "Prototype", "t": "[PROTOTYPE]™", "r": "", "gb": 7.2, "x": "", "img": "../covers/g40ddf3497db6.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, испанский. New York 2009. You are the PROTOTYPE. Armed with amazing shapeshifting abilities, hunt your way to the heart of the conspiracy which created you, and make those responsible pay.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Драки", "pl": "", "ru": null, "rel": "2009"}, {"id": "g73cc90b167a2", "n": "Prototype 2", "t": "[PROTOTYPE®2]", "r": "", "gb": 8.0, "x": "", "img": "../covers/g73cc90b167a2.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: русский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nДОБРО ПОЖАЛОВАТЬ В НЬЮ-ЙОРК ЗЕРО. Prototype® 2 включает непревзойденный боевой опыт первой части Prototype® и позволяет продолжить приключения, став мощнейшей машиной смерти, способной менять облик. Страшная эпидемия вируса унесла жизни родных сержанта Джеймса Хеллера, а его самого превратила в ПРОТОТИП. С помощью невероятных способностей и возможности менять облик вам предстоит охотиться, убивать и поглощать своих жертв на территории Нью-Йорк Зеро, чтобы отомстить виновному: Алексу Мерсеру.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2012"}, {"id": "g7132ff2ea97d", "n": "Pure Football", "t": "Pure Football", "r": "", "gb": 2.4, "x": "", "img": "../covers/g7132ff2ea97d.jpg", "d": "The world's greatest players meet in secret to play in a manner that is no longer available to them in their professional lives. Along with 4 teammates they indulge in a form of the beautiful game where tackling hard is as cherished as playing with skill - it is only on these hidden pitches that the players feel truly alive. Enter your created player into this world where he will take on the pros and other likeminded individuals in tournaments where only the fittest and the strongest will survi…", "dl": "en", "cat": "Sports & Recreation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g5a75193c8b49", "n": "QUAKE 2", "t": "", "r": "", "gb": 0.4, "x": "", "img": "../covers/g5a75193c8b49.png", "d": "Quake 2", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "g505c009a6a08", "n": "Quantum Theory", "t": "QUANTUM THEORY", "r": "", "gb": 7.2, "x": "", "img": "../covers/g505c009a6a08.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\nA dark tower looms over a wasted world. Infected by the diablosis, the living battlefields within shift and twist while a lone warrior, Syd, fights his way to the top.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "gc63a145d728d", "n": "Rabbids Invasion", "t": "Rabbids Invasion", "r": "", "gb": 7.4, "x": "Kinect", "img": "../covers/gc63a145d728d.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, венгерский, норвежский, польский.\nДля этой игры требуется сенсор Kinect™.\n\nДетский мультсериал Rabbids® Invasion стал видеоигрой!\n\nМаленькие игроки могут выбрать любой из имеющихся эпизодов и принять в нем активное участие, став не только зрителями, но и актерами любимого сериала.\n\nДля игры доступны 20 эпизодов Rabbids® Invasion\nСмотрите, играйте и взаимодействуйте с кроликами на протяжении всего эпизода.\n\nВеселитесь, выполняя с помощью движений более 400 безумных действий\nУстраивайте с кроликами виртуальные бои яйцами, выполняйте задания на время, повторяйте их нелепые позы и знаменитый безумный вопль...\n\nИграйте с семьей и друзьями\nНаслаждайтесь весельем с членами своей семьи и друзьями! Бросьте им вызов и станьте чемпионом эпизода! Открывайте дополнительные материалы в битве за рекорды!\n\nПозво", "dl": "ru", "cat": "Жанры игр, Семейные игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "g408803d0f48e", "n": "Race Pro", "t": "Race Pro", "r": "", "gb": 10.3, "x": "", "img": "../covers/g408803d0f48e.jpg", "d": "CLOSER THE ACTION, CLOSER TO THE THRILL  RACE PRO BRINGS YOU EVERY DETAIL  UNPARALLELED REALISTIC PHYSICS, HANDLING & SOUNDS  UNIQUE DEGREE OF REALISM USING REAL LIFE DATA AND ENGINE SOUNDS DIRECLY FROM ACTUAL RACE CARS  EXTENSIVE MULTIPAYER FEATURES  12 - PLAYER XBOX LIVE, SYSTEM LINK, EXCLUSIVE HOT SEAT MODE  350 ULTRA REALISTIC CAR MODELS  HIGHLY DETAILED DAMAGE REALISTICALLY AFFECTS HANDLING  EXCLUSIVE FIA CHAMPIONSHIPS ON REAL RACE TRACKS  CHAMPIONSHIPS INCLUDE MINI CHALL…", "dl": "en", "cat": "Racing & Flying, Strategy & Simulation", "pl": "", "ru": null, "rel": "2009"}, {"id": "gebd2360fb378", "n": "RAGE", "t": "RAGE MultiPlayer", "r": "", "gb": 25.6, "x": "", "img": "../covers/gebd2360fb378.jpg", "d": "Rule the Wasteland in RAGE - the new title from the Inventors of the First-Person Shooter, id Software.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2011"}, {"id": "g3e0204cd49f3", "n": "Rambo The Video Game (рус.)", "t": "RAMBO THE VIDEO GAME", "r": "", "gb": 2.1, "x": "", "img": "../covers/g3e0204cd49f3.jpg", "d": "John J. Rambo is a special forces war hero that won a Congressional Medal of Honour in the Vietnam War.  Rambo was a member of Baker Team and the star trainee of Col. Samuel Trautman.   RAMBO ® THE VIDEO GAME will put players in Rambo’s combat boots and take them on an action-packed journey through the iconic action-sequences and story-arcs of motion-picture classics FIRST BLOOD ™, RAMBO: FIRST BLOOD PART II ™ & RAMBO III ™.  ", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2014"}, {"id": "g2bc7d42e0f1b", "n": "Raven Squad Operation Hidden Dagger (рус.)", "t": "[X360-CLUB] Raven Squad: Operation Hidden Dagger", "r": "", "gb": 2.0, "x": "", "img": "../covers/g2bc7d42e0f1b.jpg", "d": "Desperate measures in Amazonia.", "dl": "en", "cat": "Action & Adventure, Shooter, Strategy & Simulation", "pl": "", "ru": null, "rel": "2009"}, {"id": "gec27b2c4dab1", "n": "Raving Rabbids Alive & Kicking", "t": "Rabbids A&K", "r": "", "gb": 2.8, "x": "Kinect", "img": "../covers/gec27b2c4dab1.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, португальский.\n\n\"Кролики уже завоевывали мир, вторгались в прошлое, в телевизор, на луну... А теперь пришел черед вашего дома - они полезут буквально изо всех щелей, и разбираться с ними надо будет самолично, посредством смешных и нелепых испытаний. \nТеперь с дополненной реальностью - смотрите, как кролики лезут в вашу жизнь прямо на ваших глазах!\n\nВпервые на Xbox Kinect: множество безумных мини-игр одновременно для четырех участников!\n\nВам когда-нибудь хотелось приблизиться к кролику настолько, чтобы отвесить ему пощечину, пнуть его и вообще - повеселиться с ним? Теперь это стало возможно на Xbox Kinect благодаря дополненной реальности.\n\nСкачите, вертитесь, лупите и еще много чего - лишь бы остановить вторжение кроликов! Используйте против них свои самые бредовые", "dl": "ru", "cat": "Жанры игр, Другое, Семейные игры, Kinect", "pl": "", "ru": null, "rel": "2011"}, {"id": "g6240fce4f44f", "n": "Rayman Origins", "t": "Rayman Origins", "r": "", "gb": 6.0, "x": "", "img": "../covers/g6240fce4f44f.jpg", "d": "Michel Ancel, celebrated creator of Rayman®, Beyond Good & Evil® and the Raving Rabbids® returns to his roots to bring us Rayman® Origins:  a new 4-player co-op comic adventure set in a lush, 2D world, teeming with unexpected secrets and outlandish enemies.  When the Glade of Dreams is overrun by “nefurrious” Darktoons, it is up to Rayman and his buddies Globox and the Teensies to save the day. Their challenge, restore peace to the Glade or witness their beloved home vanish like a bad dream...", "dl": "en", "cat": "Family, Platformer", "pl": "", "ru": null, "rel": "2011"}, {"id": "g27ed5febf340", "n": "Rayman Raving Rabbids", "t": "Rayman Raving Rabbids", "r": "", "gb": 4.8, "x": "", "img": "../covers/g27ed5febf340.jpg", "d": "Rayman Raving Rabbids is a casual game where you play as Rayman, challenges 75 trials minigame to save baby globox and get out of the jail of raving rabbit. Play score mode to beat record of 75 trials and unlock movies as well as artworks.", "dl": "en", "cat": "Family", "pl": "", "ru": null, "rel": "2007"}, {"id": "gce8dde9f4702", "n": "Red Dead Redemption", "t": "", "r": "", "gb": 7.3, "x": "", "img": "../covers/gce8dde9f4702.jpg", "d": "Версия Games on Demand поддерживает английский, французский, итальянский, немецкий и испанский языки.\n\nАмерика, 1911 год. Дикий Запад умирает. Чтобы защитить свою семью от федеральных агентов, Джон Марстон вынужден вновь нацепить на пояс кобуру и начать охоту на бандитов, которых когда-то называл друзьями. Вас ждет эпическая борьба за выживание на бескрайних просторах западной Америки и Мексики. Чтобы искупить былые грехи, Джон Марстон будет нести в мир справедливость – по одной пуле за раз.\n\n©2006-2010 Rockstar Games. Rockstar Games, R*, Red Dead Redemption и другие знаки являются товарными знаками Take-Two Interactive Software. Все права сохранены.\n\nДанная видеоигра является полностью вымышленной. Любое сходство с настоящими событиями, людьми, организациями или продуктами является ненамеренным. Take Two не одобряет демонстрируемое в игре поведение и не призывает пользователей к таким д", "dl": "ru", "cat": ает следующие языки: английский, французский. Шахтер Алек Мейсон прибыл на Марс, чтобы начать новую жизнь. Однако он довольно быстро понял, что его надеждам на лучшее будущее не суждено осуществиться. Многочисленные Силы Обороны Земли из защитников превратились в угнетателей. Столкновения между армией и колонистами все учащаются, и Красная Бригада (подпольная организация, созданная для борьбы с СОЗ) набирает силу. Судьба всей планеты зависит от действий Мейсона и Красной Бригады.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g006d35a7dfd8", "n": "Remember Me", "t": "Remember Me™", "r": "", "gb": 6.8, "x": "", "img": "../covers/g006d35a7dfd8.jpg", "d": "В играхпозапросуподдерживаютсяанглийский, французский, итальянский, немецкий, испанский, польский, русский.\n\nНовый Париж. 2084 год. Личные воспоминания стало возможно оцифровать, купить и продать. Развитие социальных сетей начала XXI века получило ожидаемое продолжение, стеревшее остатки приватности. Люди сами согласились с надзором за собой ради удобств, обещанных новыми интеллектуальными технологиями. Экономика, основанная на продаже памяти, дала власть над обществом небольшой группе людей. Remember Me™ — это экшн-приключение от третьего лица, в котором игрок управляет Нилин, некогда талантливой охотницей за памятью, умевшей входить в сознание людей и похищать или даже подтасовывать их воспоминания. Власти, напуганные знаниями и умениями Нилин, арестовали ее и стерли ей память. Сбежав из заключения, Нилин пытается вспомнить себя, в чем ей помогает последний и единственный друг. Но в ре", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "g0ead9299cac0", "n": "Resident Evil 0", "t": "[X360-CLUB] Resident Evil 0", "r": "", "gb": 3.8, "x": "", "img": "../covers/g0ead9299cac0.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский и японский языки. Загрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре». Resident Evil 0 рассказывает всю правду о происшествии в особняке, породившем все последующие события серии Resident Evil. В обновленной версии сохранены сюжет и игровой процесс оригинальной игры, дополненные потрясающей HD-графикой, звуком в формате 5.1, возможностью выбора улучшенных элементов управления и поддержкой широкоформатных телевизоров. Приготовьтесь раскрыть ужасные секреты, скрывающиеся в колыбели зла.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2016"}, {"id": "g54a2103bc3b2", "n": "Resident Evil 4", "t": "resident evil 4 FreedomHellVOICE", "r": "", "gb": 5.1, "x": "", "img": "../covers/g54a2103bc3b2.jpg", "d": "Six years after the destruction of Raccoon City, Leon Kennedy, now an agent with the US Secret Service, is sent on a rescue mission in Europe. His target is Ashley Graham, the president's daughter.  Leon locates a man in a remote house in the mountains and inquires about Ashley's whereabouts, but receives no answer.  Suddenly, the man turns and attempts to strike Leon! Visions of the horror of Raccoon City flood Leon's mind as he realizes his nightmare has not yet ended.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "g7ebde149605d", "n": "Resident Evil 5", "t": "RESIDENT EVIL 5", "r": "", "gb": 8.2, "x": "", "img": "../covers/g7ebde149605d.jpg", "d": "The Resident Evil series continues with this highly anticipated sequel. Searing heat from the merciless sun scorches the earth, while a new evil draws closer.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g19ed8322958e", "n": "Resident Evil 6", "t": "RESIDENT EVIL 6", "r": "", "gb": 8.2, "x": "", "img": "../covers/g19ed8322958e.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, польский, португальский, русский, японский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nВспыхнувшие результате чудовищных актов биотерроризма эпидемии в Америке, восточной Европе и Китае грозят погрузить мир в хаос. Но на борьбу с вирусной угрозой встают бесстрашные герои. Их судьбы связаны между собой и все теснее переплетаются по мере того, как история неумолимо движется к развязке. Resident Evil 6 подарит вам непревзойденный синтез драматических переживаний и ужаса!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2012"}, {"id": "g92c889ac976f", "n": "Resident Evil Code Veronica X", "t": "Resident Evil CODE: Veronica X HD", "r": "", "gb": 1.8, "x": "", "img": "../covers/g92c889ac976f.png", "d": "It has been 3 months since the destruction of Raccoon City. Claire Redfield travels to Europe in search of her brother.  Claire infiltrates the Paris laboratory of Umbrella Corporation, but is captured after a heated gun fight. The captured Claire is then sent to Rockfort Island, but shortly after her arrival the island is attacked!  Amidst the chaos, a horde of zombies are released!  Can Claire escape the horrors of the island?", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "g9b6595515f98", "n": "Resident Evil HD", "t": "Resident Evil", "r": "", "gb": 6.3, "x": "", "img": "../covers/g9b6595515f98.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский и японский языки.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nКлассика жанра ужасов и выживания, игра Resident Evil возвращается в обновленной версии HD.\n\nВ 1998 г. отряд особого назначения направляют расследовать жестокие и странные убийства вблизи Раккун-сити. Стая кровожадных псов вынуждает их укрыться в особняке неподалеку, но там воздух тоже пропитан запахом смерти. Припасов почти нет, и жизни бойцов висят на волоске.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2014"}, {"id": "g163d47f7b903", "n": "Resident Evil Operation racoon city", "t": "Resident Evil: ORC", "r": "", "gb": 4.8, "x": "", "img": "../covers/g163d47f7b903.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, голландский, русский.\n\nOperation Raccoon City — это уникальный трехсторонний шутер в мире Resident Evil. Из-за T-вируса почти все жители Раккун-Сити умерли или стали зомби. «Амбрелла» не хочет, чтобы о ее причастности к этому стало известно. Вы — боец войск особого назначения корпорации «Амбрелла» (ВОНА), посланных в умирающий город, чтобы правда не всплыла. Город полон зомби и биоорганического оружия, но есть и более весомая угроза. За вами охотится спецназ, желая захватить улики, которые вы пытаетесь уничтожить.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "g88e57e419813", "n": "Resident Evil Revelations", "t": "Resident Evil Rev.", "r": "", "gb": 8.3, "x": "", "img": "../covers/g88e57e419813.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский,нидерландский, польский, португальский, русский, японский, языки.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nСюжет разворачивается до биотерактов в Киджуджу и Ланьшиане, вскоре после учреждения АООБ. Вместе с Джил Валентайн вам предстоит искать её бывшего напарника Криса Редфилда на борту корабля-призрака в Средиземном море. Узнайте скрываемую правду об уничтожении плавучего города. Или вместе с друзьями отстреливайте врагов в многопользовательском режиме \"Рейд\".", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2799"}, {"id": "g58ef233bb846", "n": "Resident Evil Revelations 2", "t": "Resident Evil Revelations 2", "r": "", "gb": 8.4, "x": "", "img": "../covers/g58ef233bb846.jpg", "d": "В сюжете Resident Evil Revelations 2 на протяжении четырех эпизодов переплетаются две кошмарные истории.\n\nПервый эпизод: «В исправительной колонии»\nКлэр и Мойра похищены группой неизвестных преступников. Они приходят в себя на острове, населенном чудовищными созданиями. Все, что им остается, — это сражаться с окружающим их кошмаром.\n\n*Первый эпизод включает в себя режим «Рейд», так любимый поклонниками игры.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2015"}, {"id": "gc9216785877d", "n": "Resonance of Fate", "t": "Resonance of Fate", "r": "", "gb": 7.2, "x": "", "img": "../covers/gc9216785877d.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, японский.\n\nIn the far future, mankind's descendants live within\nBasel, an enormous mechanical tower that stretches to\nthe heavens. Now, the bells begin to toll the beginning\nof the world's end. Experience cinematic, gun-toting\naction and an in-depth, post-apocalyptic story in this\noriginal game from SEGA and acclaimed RPG developer\ntri-Ace!", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2010"}, {"id": "gc5cfacdd97b8", "n": "Ridge Racer Unbounded", "t": "", "r": "", "gb": 1.7, "x": "", "img": "../covers/gc5cfacdd97b8.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\nRidge Racer Unbounded gears up to carve its own destructive path on a spectacular collision course!\nRidge Racer is on its way back into the eager hands of gamers & Ridge Racer™ Unbounded is coming to add an unexpected dimension to the series and deliver an original blast of ferocious racing adrenaline.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Авиасимуляторы и автогонки", "pl": "", "ru": null, "rel": "2012"}, {"id": "g47679c252b0e", "n": "Rio", "t": "", "r": "", "gb": 2.0, "x": "", "img": "../covers/g47679c252b0e.jpg", "d": "From the makers of the hit ICE AGE series comes RIO, a 3D comedy adventure about taking a walk on the wild side.  The game focuses on Blu, a rare domesticated bird who travels to the exotic land of Rio.  With the help of his female counterpart, Jewel and a group of wise-cracking and smooth-talking city birds, Blu goes on the adventure of his life! Along the way Blu journeys through Rio, dodging soccer balls, collecting tropical fruits and soaring across the beach.  ", "dl": "en", "cat": "Action & Adventure, Family", "pl": "", "ru": null, "rel": "2011"}, {"id": "g6f088d424409", "n": "Rise of Nightmares", "t": "Rise of Nightmares", "r": "", "gb": 2.3, "x": "Kinect", "img": "../covers/g6f088d424409.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, испанский, \n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nДля этой игры требуется сенсор Kinect™.\n\nA truly mature experience for Microsoft® Kinect. Survive one hellish night as you fight hand to hand against undead enemies and mad scientists using the hands-free controls of Microsoft Kinect. Using knives, chainsaws and your bare hands, rip your foes limb from limb while uncovering the location of your kidnapped wife.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Kinect", "pl": "", "ru": null, "rel": "2013"}, {"id": "g7c00f2d572ec", "n": "Rise Of The Argonauts", "t": "Rise of the Argonauts", "r": "", "gb": 5.6, "x": "", "img": "../covers/g7c00f2d572ec.jpg", "d": "Rise of the Argonauts", "dl": "en", "cat": "Action & Adventure, Fighting, Role Playing", "pl": "", "ru": null, "rel": "2008"}, {"id": "g87c8f2231a53", "n": "Risen 2 Dark Waters (рус.)", "t": "Risen 2", "r": "", "gb": 2.5, "x": "", "img": "../covers/g87c8f2231a53.jpg", "d": "Игры по запросу версия поддерживает английский, французский, итальянский, немецкий, испанский, польский. Скачайте инструкцию для этой игры счет размещения игры на http://marketplace.xbox.com и выбрав \"См. руководство игры\".\nУстановить несколько лет после окончания Воскресшего, бушующие титаны опустошили мир и подтолкнул человечество на грань существования. Впоследствии, чудовищные существа поднялись из глубин моря и свои атаки принесли все мореплавание к полной остановке. Герой, ныне член Инквизиции, отправляется, чтобы выяснить, как остановить хаос, вызванный этими существами из глубоких.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Ролевые игры", "pl": "", "ru": null, "rel": "2012"}, {"id": "g07353a1cc8c9", "n": "Risen 3 Titan Lords", "t": "Risen 3 - Titan Lords", "r": "", "gb": 3.4, "x": "", "img": "../covers/g07353a1cc8c9.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский. \n\nБоги покинули мир, оставив лишь шрамы от буйства Титанов. Человечество пытается восстановить силы и объединиться. Однако есть более важные проблемы: ваша собственная жизнь была разбита, и вам нужно отправиться на поиски того, что потеряно среди тьмы, распространившейся по всему миру. Кто знает, может быть, одновременно вы сможете спасти мир?\n\nПеред вами лежат три нити судьбы. Три способа восстать против Титанов и вернуть свою душу. Какой путь выбрать? Вам решать.\n\nИсследуйте и выживайте\nПогрузитесь в мир классической ролевой игры, полный грубого очарования, колоритных персонажей и демонических опасностей.\n\nСвобода выбора\nВыберите, когда и где вы хотите пережить последствия сделанного выбора.\n\nМагия возвращается!\nМагия кристалла вернулась вместе с новыми разрушительными боевыми способностями.", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "g9d714939883a", "n": "Rumble Roses XX", "t": "", "r": "", "gb": 5.6, "x": "", "img": "../covers/g9d714939883a.jpg", "d": "The sexy and extreme wrestling action, Rumble Roses is back with high-def sexiness! Offering not only photorealistic graphics, but vastly improved gameplay! Enjoy the drama in the all new tag team mode! Hit your partner mistakenly; you may end up being ignored when making a tag move. Outdoor stages includes skyscrapers, beach and even Death Valley! New fighting mode on the streets! Increase your popularity and even dress up like a super star! ", "dl": "en", "cat": "Action & Adventure, Fighting, Sports & Recreation", "pl": "", "ru": null, "rel": "2008"}, {"id": "g33ff3dae8cdd", "n": "Sacred 2 Fallen Angel", "t": "Sacred 2 Fallen Angel", "r": "", "gb": 6.8, "x": "", "img": "../covers/g33ff3dae8cdd.jpg", "d": "SACRED 2 - Fallen Angel is a vast and deeply playable Action RPG. Embark upon Light and Shadow campaigns in a seamless game world that blends solo and multiplayer gameplay, and is packed full of quests, characters, adventure and deadly combat.", "dl": "en", "cat": "Action & Adventure, Role Playing", "pl": "", "ru": null, "rel": "2009"}, {"id": "g46e6ce9c9056", "n": "Sacred 3", "t": "Sacred 3", "r": "", "gb": 7.5, "x": "", "img": "../covers/g46e6ce9c9056.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский. Sacred 3 это экшен-аркада для четырех игроков, которые участвуют в битве за Анкарию. Выбирайте своих легендарных героев и сражайтесь вместе против восставшего зла. Вам предстоит преодолеть полчища гриммоков, жутких тварей, легионы наемников и колдунов. Развивайте способности своего персонажа и действуйте в команде, чтобы использовать целые комбинации атак. Победа будет нашей. Слава — моей.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Ролевые игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "gd6ce232aa4bb", "n": "Sacred Citadel (рус.)", "t": "Sacred Citadel", "r": "", "gb": 0.5, "x": "", "img": "../covers/gd6ce232aa4bb.jpg", "d": "Над мирными землями Анкарии нависла смертельная угроза. Злая Пепельная Империя поработила её жителей и использует гриммоков для уничтожения поклявшихся защищать её сирафим. Для победы требуется показать все свои воинские умения, обуздать ужасающих монстров, приобрести навыки достойные могучего героя, добыть мощное оружие и бесценные сокровища. Приглашайте друзей и присоединяйтесь к сопротивлению!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2013"}, {"id": "g76531840e213", "n": "Saints Row - Gat Out of Hell", "t": "SR: Gat out of Hell", "r": "", "gb": 5.4, "x": "", "img": "../covers/g76531840e213.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, польский, русский.\n\nПосле Saints Row IV поклонников серии ждет... встреча с Сатаной! Johnny Gat и Kinzie Kensington поставят преисподнюю на уши ради спасения души своего босса.\n\nЧто нового:\n• Летайте на крыльях падшего ангела, натравливайте на врага бесов и окружайте себя божественной аурой. \n• Пройдите по пяти районам ада, спасайте союзников, бейте морды демонам, ограбьте адский завод.\n• Задействуйте целый арсенал адских прибамбасов: жабогранаты, полчища саранчи и самое удобное (и страшное) кресло в преисподней.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2015"}, {"id": "g145697e821ca", "n": "Saints Row 2", "t": "Saints Row 2", "r": "", "gb": 8.0, "x": "", "img": "../covers/g145697e821ca.jpg", "d": "Помогите Святым с 3-й стрит вернуть свой город во взрывном продолжении хита 2006 года! В игре Saints Row 2 вы создаете и развиваете неповторимого уникального персонажа, которому предстоит открыть огромный мир на земле, в воде и в воздухе. Также доступен режим совместной игры, где вы с другом можете играть по сети.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "gb7470631602c", "n": "Saints Row 3", "t": "Saints Row: The Third", "r": "", "gb": 7.5, "x": "", "img": "../covers/gb7470631602c.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, голландский, польский, русский.\n\nSaints Row®: The Third™: мир у ваших ног. Легендарное преступное сообщество Syndicate, распространившееся по планете, бросает вам вызов. В ролике \"Strap It On\" показана первая встреча Saints с их новым врагом, которая выливается в кровопролитную схватку за власть в городе Steelport. Пристегнитесь — новый ролик игры Saints Row®: The Third™ заставит вас затаить дыхание.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "ga8128d63c32b", "n": "Saints Row 4", "t": "Saints Row IV", "r": "", "gb": 8.8, "x": "", "img": "../covers/ga8128d63c32b.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский. Загрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nЕдва Saints обосновались в Белом доме, на Землю вторглись пришельцы. С арсеналом сверхспособностей и необычного оружия вам предстоит одолеть Zinyak и спасти Землю в неистовой игре с открытым миром!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "g4de7da8a5e4b", "n": "Saw", "t": "Saw", "r": "", "gb": 2.1, "x": "", "img": "../covers/g4de7da8a5e4b.jpg", "d": "Jigsaw has killed your partner and destroyed your life. Now he has trapped you in an abandoned insane asylum that he alone controls. If you can defeat his brutal traps and survive, you may just discover the truth behind what drives this twisted serial killer. SAW is a third-person perspective, survival horror game based on the SAW film franchise. The game features many of the deadly mechanical traps seen in the film, as well as terrifying new ones.", "dl": "en", "cat": "Action & Adventure, Other", "pl": "", "ru": null, "rel": "2009"}, {"id": "gb84125a8f325", "n": "Screamride (рус.)", "t": "ScreamRide", "r": "", "gb": 2.1, "x": "", "img": "../covers/gb84125a8f325.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, польский, португальский, русский и японский.\n\nScreamRide предлагает вам потрясающую графику высокого разрешения, сотни настраиваемых строительных элементов, основанное на физике разрушение, кинематографические столкновения, уровни для разблокирования, список лидеров в игре, глобальный рейтинг и многое другое. ScreamRide это мир безграничной инновации. Выйдите за пределы выносливости искателей острых ощущений. Выберите себе роль, чтобы пройти каждый уровень по-разному. Любители покричать могут доказать свои навыки пилотирования, инженеры могут решить хитрые строительные головоломки, а подрывники-эксперты могут все это взорвать. Выбор пути зависит только от вас!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2015"}, {"id": "g92ca29568d9d", "n": "Secret Service - Ultimate Sacrifice", "t": "[X360-CLUB] Secret Service: Ultimate Sacrifice", "r": "", "gb": 3.0, "x": "", "img": "../covers/g92ca29568d9d.jpg", "d": "Secret Service", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "g8558b4567ea3", "n": "Section 8 ENG", "t": "Section 8", "r": "", "gb": 2.6, "x": "", "img": "../covers/g8558b4567ea3.jpg", "d": "\"Section 8 is an intense first-person shooter that gives players unprecedented strategic control over the battlefield, employing tactical assets and on-demand vehicle deliveries to dynamically alter the flow of combat. Set in the distant future when humanity is facing a growing insurrection among its colonies, Earth dispatches the elite 8th Armored Infantry to turn the tide.\"", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "g2a856f4b4115", "n": "Section 8 Prejudice", "t": "Section 8: Prejudice", "r": "", "gb": 2.4, "x": "", "img": "../covers/g2a856f4b4115.jpg", "d": "Prejudice – это первый sci-fi шутер с захватывающим боем, где ка ation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g2536fdf8deba", "n": "Syndicate", "t": "Syndicate", "r": "", "gb": 7.6, "x": "", "img": "../covers/g2536fdf8deba.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, португальский и русский.\n\n2069 – мир разделен на регионы, контролируемые мега-корпорациями, Синдикатами. Покупателям теперь больше не нужны никакие устройства для доступа к мировой информационной сети, ведь все это можно делать буквально... моргнув глазом - с помощью вживленного нейрочипа. Люди выстроились в очереди, чтобы стать \"очипованными\" и насладиться услугами своего Синдиката - бытовыми, медицинскими, банковскими, страховыми, образовательными, развлекательными и карьерными. Один пакет услуг. Один стиль жизни. Власть правительств стала формальной, а вот бизнес в буквальном смысле превратился в войну. Синдикаты не остановятся ни перед чем, чтобы получить абсолютную власть над рынком.\nНа передовой этой тайной войны стоят Агенты, биологически модифицированные бойцы Синдикатов со встроенными чипами, значи", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "gcf3e198ba932", "n": "Tales of Vesperia", "t": "Tales of Vesperia", "r": "", "gb": 7.0, "x": "", "img": "../covers/gcf3e198ba932.jpg", "d": "\"Tales of Vesperia\" is the latest installment in the worldwide multi-million selling Tales RPG series. Experience sharp, beautiful graphics in HD, captivating voiced events and real-time, action-packed battles featuring all new enhanced systems such as \"Fatal Strikes\" and \"Burst Artes.\"", "dl": "en", "cat": "Role Playing", "pl": "", "ru": null, "rel": "2008"}, {"id": "g6a3fb8ac21c6", "n": "Tekken 6", "t": "", "r": "", "gb": 7.1, "x": "", "img": "../covers/g6a3fb8ac21c6.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, русский, японский, корейский.\n\nИгра TEKKEN, разошедшаяся по всему миру тираж "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "g5f35f1e6262c", "n": "Terraria", "t": "Terraria", "r": "", "gb": 0.0, "x": "", "img": "../covers/g5f35f1e6262c.png", "d": "Добро пожаловать в Terraria! КОПАЙТЕ, СРАЖАЙТЕСЬ, ИССЛЕДУЙТЕ, СТРОЙТЕ! В этой насыщенной событиями и действием игре возможно все. Вас ждет более десятка карт и сотни врагов и предметов. Мир станет вашим холстом - нарисуйте свою картину!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2013"}, {"id": "g03342edd51e9", "n": "Test Drive Ferrari Racing Legends", "t": "Test Drive: FRL", "r": "", "gb": 2.3, "x": "", "img": "../covers/g03342edd51e9.jpg", "d": "Test Drive: Ferrari Racing Legends is the ultimate driving experience for fans of the Ferrari brand.", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2012"}, {"id": "g57daf31b7723", "n": "Test Drive Unlimited 2", "t": "Test Drive Unlimited 2", "r": "", "gb": 7.0, "x": "", "img": "../covers/g57daf31b7723.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\nChase glory from behind the wheel of the most exclusive performance cars and take the race online to challenge rivals around the world. Customise your life as you tear through the streets and kick up dust off - road on the sun - kissed islands of Ibiza and Hawaii.", "dl": "ru", "cat": "Жанры игр, Авиасимуляторы и автогонки", "pl": "", "ru": null, "rel": "2011"}, {"id": "g0a6272846bb7", "n": "The Black Eyed Peas Experience", "t": "The Black Eyed Peas Experience", "r": "", "gb": 7.3, "x": "Kinect", "img": "../covers/g0a6272846bb7.jpg", "d": "The Games on Demand version supports English, French, Italian, German, Spanish.  Get the party started in your living room with the world’s hottest group in the world’s hottest new dance game.  Download the manual for this game by locating the game on http://marketplace.xbox.com and selecting “See Game Manual\".  This game requires a Kinect™ Sensor", "dl": "en", "cat": "Kinect, Music", "pl": "", "ru": null, "rel": "2011"}, {"id": "g333151695a0c", "n": "The Chronicles of Riddick (рус.)", "t": "", "r": "", "gb": 7.1, "x": "", "img": "../covers/g333151695a0c.jpg", "d": "The Chronicles of Riddick™ Assault on Dark Athena", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "g86ac17cdc026", "n": "The Club", "t": "The Club", "r": "", "gb": 5.0, "x": "", "img": "../covers/g86ac17cdc026.jpg", "d": "Bizarre Creations and SEGA offer a glimpse into The Club™", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "gc10e7325c2c4", "n": "The Darkness", "t": "The Darkness", "r": "", "gb": 7.3, "x": "", "img": "../covers/gc10e7325c2c4.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский. Загрузите руководство для этой игры, выбрав игру на сайте http://marketplace.xbox.com, а затем нажмите \"См. руководство игры\". \nOn his 21st birthday, the destructive powers of a timeless force known as The Darkness awaken within Jackie Estacado, a hitman for the Franchetti crime family. Jackie must learn to fully command The Darkness so he can take back control of the Franchetti family which is ruled by his “Uncle” Paulie, a despicable man who is almost universally despised. But Jackie will quickly learn that The Darkness has a will of its own…", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2007"}, {"id": "ga46aac1ed167", "n": "The Darkness II", "t": "The Darkness II", "r": "", "gb": 6.4, "x": "", "img": "../covers/ga46aac1ed167.jpg", "d": "Darkness II - динамичный боевик с видом от первого лица, в котором вам предстоит сыграть роль Джеки Эстакадо, дона Нью-Йоркского мафиозного клана и обладателя древней сверхъестественной силы хаоса, известной под названием Тьма.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "g017439e07772", "n": "The Elder Scrolls 4 Oblivion (рус.)", "t": "TES IV Oblivion GOTY RUS", "r": "", "gb": 6.9, "x": "", "img": "../covers/g017439e07772.jpg", "d": "Step inside the most richly detailed and vibrant game-world ever created. Oblivion is the latest chapter in the epic Elder Scrolls saga. With a powerful combination of freeform gameplay and unprecedented graphics, you can unravel the main quest at your own pace or explore the vast world and find your own challenges.", "dl": "en", "cat": "Role Playing", "pl": "", "ru": null, "rel": "2010"}, {"id": "g12225da43230", "n": "The First Templar", "t": "The First Templar", "r": "", "gb": 3.7, "x": "", "img": "../covers/g12225da43230.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, немецкий.\n\nThe First Templar follows the story of a French Templar and his companion, a noble lady who has been proclaimed a heretic. Taking control over these two unlikely allies, the player must uncover the mysteries behind the Templar Order, play a role in a grand conspiracy, and discover the secret of the Holy Grail.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2011"}, {"id": "gb27c4516fe5a", "n": "The Godfather", "t": "The Godfather™", "r": "", "gb": 6.1, "x": "", "img": "../covers/gb27c4516fe5a.jpg", "d": "Exclusive game content downloads coming November 2006!", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "gac8d847e6e22", "n": "The Godfather 2", "t": "The Godfather™ II", "r": "", "gb": 7.3, "x": "", "img": "../covers/gac8d847e6e22.jpg", "d": "Сетевые функции этой игры больше не доступны. После загрузки вы получите доступ только к одиночной игре.\n\nНа заре Кубинской революции несколько преступных группировок собрались на совет в Гаване. Встреча прошла не очень гладко - дона вашей семьи убили, и теперь вам придется принять бразды правления и навести порядок в семье. Успех открыл дорогу к новым возможностям, и когда за Майкла Корлеоне взялся комитет по борьбе с организованной преступностью, семья Корлеоне предложила вам вести дела в Нью-Йорке и расширить их сферу влияния до Майами. Наладьте связи с союзниками, соберите арсенал и разгромите врагов. За вашу голову назначат награду, а ваша спина все время будет под прицелом... но в этом нет ничего личного. Это всего лишь бизнес.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2009"}, {"id": "g2dbe89221cd7", "n": "The Hip Hop Dance Experience", "t": "The Hip Hop Dance Experience", "r": "", "gb": 3.8, "x": "Kinect", "img": "../covers/g2dbe89221cd7.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nДля этой игры требуется сенсор Kinect™.\n\nОсвойте более 700 знаковых танцевальных хип-хоп-движений из 40 хип-хоп хитов на шести потрясающих мероприятиях. Вызовите друга на танцевальную битву или играйте вместе в 4 разных игровых режимах. Наконец-то у вас есть танцевальная игра, посвященная только хип-хопу!", "dl": "ru", "cat": "Жанры игр, Kinect", "pl": "", "ru": null, "rel": "2013"}, {"id": "gf942830c08a1", "n": "The King of Fighters '98, The Ultimate Match 2009", "t": "The King of Fighters '98: Ultimate Match", "r": "", "gb": 0.2, "x": "", "img": "../covers/gf942830c08a1.jpg", "d": "All the fighters are waiting for you in [KOF98UM]!", "dl": "en", "cat": "Classics", "pl": "", "ru": null, "rel": "2009"}, {"id": "g76bbc4ce6f96", "n": "The King of Fighters 2002, The Unlimited Match 2010", "t": "The King of Fighters 2002 Unlimited Match", "r": "", "gb": 0.6, "x": "", "img": "", "d": "", "dl": "", "cat": "", "pl": "", "ru": null, "rel": ""}, {"id": "g7449f74d2376", "n": "The King of Fighters XII 2009", "t": "The King of Fighters XII", "r": "", "gb": 0.8, "x": "", "img": "../covers/g7449f74d2376.jpg", "d": "KOF RE-BIRTH. An all new KOF, reborn as a next generation fighting game for the Xbox 360™. The invigorating attack combo Critical Counter.Deadlock, where you can fend off incoming blows with your own attacks.Simple Mode makes it easy for players new to fighting games to execute special moves. Enjoy battles via Xbox LIVE. Experience an all new KOF!", "dl": "en", "cat": "Fighting", "pl": "", "ru": null, "rel": "2009"}, {"id": "g0c8370b2ad01", "n": "The King of Fighters XIII 2011", "t": "The King of Fighters XIII", "r": "", "gb": 2.2, "x": "", "img": "../covers/g0c8370b2ad01.jpg", "d": "“THE KING OF FIGHTERS XIII” comes to Xbox 360 as the ultimate versus fighting game, in an upgraded version of the original arcade game! The final chapter of the “Ash Saga”, full of anger and betrayal, ends here!!", "dl": "en", "cat": "Fighting", "pl": "", "ru": null, "rel": "2011"}, {"id": "gf60eaee47976", "n": "The King of Fighters, The Sky Stage 2010", "t": "The King of Fighters: Sky Stage", "r": "", "gb": 0.3, "x": "", "img": "../covers/gf60eaee47976.jpg", "d": "(Online Interactions Not Rated by the ESRB) Brand new vertical scroll shooter \"KOF SKY STAGE\" comes to Xbox360! Characters well known in the 2D fighting game \"KOF\" comes to fight in the new stage, in SKY!", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g3dce6381c9fc", "n": "The Last Remnant (рус.)", "t": "The Last Remnant Disc 2", "r": "", "gb": 13.2, "x": "", "img": "../covers/g3dce6381c9fc.jpg", "d": "Square Enix's storming new RPG for the world. A war centering around the awesome power of Remnants begins.", "dl": "en", "cat": "Role Playing", "pl": "", "ru": null, "rel": "2008"}, {"id": "gd27fa68488d8", "n": "The Lord of the Ring Conquest 2009", "t": "The Lord of the Rings: Conquest", "r": "", "gb": 6.0, "x": "", "img": "../covers/gd27fa68488d8.jpg", "d": "Middle-earth stands on the brink of destruction. You will unit р, Экшн и приключения, Ролевые игры", "pl": "", "ru": null, "rel": "2011"}, {"id": "g215a2db3da84", "n": "The Orange Box", "t": "The Orange Box", "r": "", "gb": 4.2, "x": "", "img": "../covers/g215a2db3da84.jpg", "d": "Orange Box — сборник, включающий в себя пять игр от Valve: Half-Life 2; Half-Life 2: Episode One; Half-Life 2: Episode Two; Team Fortress 2, продолжение игры, которая подарила миру многоклассовую командную войну; и Portal, игру, в которой совместились головоломка, экшен с видом от первого лица и приключенческая игра, сочетание — породившее невиданный прежде игровой процесс.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер, Головоломки и викторины", "pl": "", "ru": null, "rel": "2008"}, {"id": "gdd1a2bfa8a13", "n": "The sabouter", "t": "The Saboteur", "r": "", "gb": 5.3, "x": "", "img": "../covers/gdd1a2bfa8a13.jpg", "d": "Сетевые функции этой игры больше не доступны. После загрузки вы получите доступ только к одиночной игре.\n\nОкунись в незабываемый мир экшн и приключений, созданный Pandemic Studios и Electronic Arts - игру The Saboteur™. Ты в оккупированном нацистами Париже. Дерись, карабкайся, гоняй на болидах, но достань и уничтожь тех, кто отнял у тебя все. Впервые в видео игре: стань диверсантом в злачном мире стилизованного Парижа 1940х годов, где девушки сексуальны, миссиии героичны, а жажда мести удовлетворяется сполна.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2009"}, {"id": "g2cff79d46da2", "n": "The Simpsons Game", "t": "", "r": "", "gb": 4.4, "x": "", "img": "../covers/g2cff79d46da2.jpg", "d": "From the writers and producers of The Simpsons TV show comes perhaps the most mind-blowingly astounding video game experience to ever grace the disc drive of your Xbox 360 console. Your eyes will explode with delight as they witness, for the first time ever in a video game, new 3D-to-2D technology that delivers the actual look of the TV show. Your spleen will rupture with laughter as The Simpsons take aim at the video game industry with all their trademark humor. Your colon will sigh with relief", "dl": "en", "cat": "Platformer", "pl": "", "ru": null, "rel": ""}, {"id": "g47d318b42c66", "n": "The Walking Dead (рус.)", "t": "Unable to read name.", "r": "", "gb": 3.2, "x": "", "img": "../covers/g47d318b42c66.jpg", "d": "A five-part game series set in the same universe as Robert Kirkman’s award-winning comic book series. ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2012"}, {"id": "gbcebd0fb6733", "n": "The Walking Dead Season 2 (рус.)", "t": "The Walking Dead: Season 2", "r": "", "gb": 2.7, "x": "", "img": "../covers/gbcebd0fb6733.jpg", "d": "Скачайте Эпизод 1 \"Ходячих мертвецов: Сезон 2\", пятисерийной игры, продолжающей историю Клементины, девочки, оставшейся сиротой в результате атаки зомби. Вынужденная заботиться о себе сама, она научилась выживать в этом безумном мире. Прошло несколько месяцев после событий из Сезона 1 \"Ходячих мертвецов\", и Клементине нужна безопасность. Но что может сделать обычный ребенок, чтобы выжить, когда жизнь так же ужасна - а иногда и ужаснее - чем смерть? Играя за Клементину, вы будете проверены разными ситуациями и дилеммами, которые протестируют ваши моральные принципы и инстинкт выживания. Ваши решения и действия изменят историю в этом сиквеле Игры года 2012.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2013"}, {"id": "gb4657e8fdad4", "n": "The Walking Dead Survival Instinct (рус.)", "t": "TWD: Survival Instinct", "r": "", "gb": 5.7, "x": "", "img": "../covers/gb4657e8fdad4.jpg", "d": "В играх по запросу поддерживаются русский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nThe Walking Dead: Survival Instinct - шутер от первого лица, сделанный по мотивам сверхпопулярного телесериала Ходячие мертвецы. Вам предстоит играть за таинственного выжившего, Дэрила Диксона.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "gd0bc79ac3a72", "n": "The Witcher 2 - Assassins of Kings", "t": "The Witcher 2 Disc 1", "r": "", "gb": 16.6, "x": "", "img": "../covers/gd0bc79ac3a72.png", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, чешский, венгерский, польский, русский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nВо времена хаоса, когда головы королей летят с плеч, гнев народов растет, а королевства рушатся, ведьмак Геральт из Ривии должен вернуть себе доброе имя и раскрыть заговор, который угрожает жизням его близких и подвергает опасности весь мир. \"Ведьмак 2\" подарит вам захватывающий игровой процесс благодаря продуманному нелинейному сюжету, зрелищным боям в реальном времени, великолепной графике и непередаваемой атмосфере бескрайнего мира.", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2012"}, {"id": "gf65ddaa43330", "n": "Thief", "t": "Thief", "r": "", "gb": 5.8, "x": "", "img": "../covers/gf65ddaa43330.jpg", "d": "В играх по запросу поддерживаются английский, польский, русский\n\nВсе твое - мое. Гаррет, мастер-вор, выходит из тени в Город. В этом коварном месте он может довериться только собственным навыкам. Под руководством Ориона угнетенные горожане готовы на все, чтобы вырвать свой Город из лап Барона. Если Гаррет останется в стороне, улицы будут залиты кровью и жители разорвут друг друга на части.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2014"}, {"id": "g226ca0d31c47", "n": "Time Shift (рус.)", "t": "", "r": "", "gb": 4.0, "x": "", "img": "../covers/g226ca0d31c47.jpg", "d": "The megalomaniacal Dr. Krone has created a disturbing alternate reality. Armed with the experimental Beta Suit, you alone can SLOW, STOP, and REVERSE the flow of time itself. Perfect this ability to end Krone's madness. Join the battle for survival and lead the uprising to victory.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2007"}, {"id": "g126ed0648442", "n": "TMNT Out of the Shadows", "t": "TMNT:OOTS", "r": "", "gb": 2.5, "x": "", "img": "../covers/g126ed0648442.png", "d": "Teenage Mutant Ninja Turtles: Out of the Shadows takes you back to how it all began.  Be the four Turtles Leonardo, Donatello, Michelangelo, and Raphael in the fight to save New York City from mutants, the Foot and Shredder.  With seamless drop-in, drop-out co-op, along with team combo moves and relentless combat, this is the game fans have been waiting for.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2013"}, {"id": "gf72aad4a35e9", "n": "TMNT Turtles in Time Re-Shelled", "t": "Turtles In Time RS", "r": "", "gb": 0.3, "x": "", "img": "../covers/gf72aad4a35e9.jpg", "d": "(Online Interactions Not Rated by the ESRB) The Turtles are back! Relive, or discover for the first time, the flashy visual style and humor of one of the most acclaimed arcade games of all time.  Starring Leonardo, Donatello, Raphael and Michelangelo - everyone’s favorite pizza-loving, wise-cracking, reptilian crime fighters.  The game has been recreated in beautiful full 3D HD graphics and enhanced animations but still has all of the favorite moments and gameplay from the original.", "dl": "en", "cat": "Puzzle & Trivia", "pl": "", "ru": null, "rel": "2010"}, {"id": "g3422d53e6737", "n": "TNA Wrestling iMPACT!", "t": "TNA iMPACT!™", "r": "", "gb": 7.4, "x": "", "img": "../covers/g3422d53e6737.jpg", "d": "TNA iMPACT!™ is the exclusive Total Nonstop Action wrestling game based on the top-rated weekly television show, TNA iMPACT!™  Choose the wrestling style, custom move set and clothing to construct the ultimate champion.  TNA iMPACT!™ drenches the player in moves and match types that allow amazing acrobatic and aerial feats along with the bone-jarring crush of hard-hitting impacts.  The game also features top wrestling talent such as Kurt Angle, Jeff Jarrett, Rhino, Samoa Joe, AJ Styles, Sting, C", "dl": "en", "cat": "Sports & Recreation", "pl": "", "ru": null, "rel": "2008"}, {"id": "g8e383eaf7ba6", "n": "Tom Clancy Advanced Warfighter", "t": "G.R.A.W.", "r": "", "gb": 5.9, "x": "", "img": "../covers/g8e383eaf7ba6.jpg", "d": "The face of war has changed. New enemies and new threats require a new type of warfare - a new type of soldier. Enter the Ghosts.    Become the soldier of the future:  Using a fully integrated combat system with cutting-edge weapons and revolutionary communication systems, gain a realistic view of how war will be fought in the next decade.    Customizable multiplayer experience and Unique Online Co-op Campaign: Create your own identity, create your own gametypes, and take the battle online …", "dl": "en", "cat": "Action & Adventure, Shooter, Strategy & Simulation", "pl": "", "ru": null, "rel": "2010"}, {"id": "gdd0fba7f993e", "n": "Tom Clancy Rainbow Six Vegas 2", "t": "", "r": "", "gb": 6.8, "x": "", "img": "../covers/gdd0fba7f993e.jpg", "d": "The sequel to the award-winning next-generation first-person shooter returns to Sin City. Tom Clancy's Rainbow Six Vegas 2 is your last chance to rescue Vegas from an escalating terrorist siege that will force you into heart-pounding action from beginning to end. The best are back and this time winner takes all.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "gb72208cca369", "n": "Tom Clancy's H.A.W.X", "t": "Tom Clancy’s H.A.W.X", "r": "", "gb": 6.4, "x": "", "img": "../covers/gb72208cca369.jpg", "d": "Tom Clancy’s H.A.W.X puts you in command of the most powerful jet fighters on Earth. In 2014, as a former elite USAF pilot, you join a powerful Private Military Company. Your missions will take you all around the world over photo-realistic, well-known locations, using real satellite data. H.A.W.X gives you total control over the plane’s flying assistance mode: turn it on or off and trigger 2 unique gameplay experiences. Assistance ON gives you full technology support. It can display intercepti…", "dl": "en", "cat": "Action & Adventure, Strategy & Simulation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g0dd13e52371b", "n": "Tom Clancy's H.A.W.X 2 (рус.)", "t": "Tom Clancy’s H.A.W.X.2", "r": "", "gb": 6.4, "x": "", "img": "../covers/g0dd13e52371b.jpg", "d": "Tom Clancy's H.A.W.X.® 2 places you in the shoes of an elite pilot with access to the most advanced and most deadly aircraft ever built.  The action packed missions take you around the world, in a race against the clock to uncover a conspiracy that threatens the safety of the world.  Dogfights are visceral, up close and personal, with engagements that bring enemies closer to you than you've ever seen before. ", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "gbb2bc38a642a", "n": "Tom Clancy's Rainbow Six Vegas", "t": "Rainbow Six® Vegas", "r": "", "gb": 7.1, "x": "", "img": "../covers/gbb2bc38a642a.jpg", "d": "Rainbow operatives take to the chaotic streets of Las Vegas as an escalating terrorist siege in “Sin City” threatens to take world terrorism to new, uncontrollable heights. The future of global security hangs in the balance as you battle to defend classic Vegas locations and environments like Fremont Street, the Strip, and casinos.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g9f5e3393704a", "n": "Tom Clancy's Splinter Cell Blacklist (рус.)", "t": "Tom Clancy's Splinter Cell: Blacklist", "r": "", "gb": 8.4, "x": "", "img": "../covers/g9f5e3393704a.jpg", "d": "Группа террористов, называющая себя «Инженеры», готовит ультиматум, известный как ЧЕРНЫЙ СПИСОК – список атак, направленных против важных для США объектов, которые будут осуществлены, если не будут выполнены их требования. Специальный агент Сэм Фишер теперь возглавляет недавно сформированный «Четвертый эшелон» – секретное подразделение, подотчетное только Президенту США. Любой ценой необходимо выследить «Инженеров», прежде чем угрозы из Черного списка будут осуществлены. Сетевые режимы и функции в этой игре больше не доступны.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "g7b940778a420", "n": "Tom Clancy's Splinter Cell Conviction (рус.)", "t": "Tom Clancy's Splinter Cell: Conviction", "r": "", "gb": 7.2, "x": "", "img": "../covers/g7b940778a420.jpg", "d": "В играх по запросу поддерживаются русский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nSPLINTER CELL - CONVICTION (Одиночная кампания)\nМного лет назад Сэм Фишер стал волком-одиночкой и вышел на охоту за убийцей своей дочери. Но след привел его в Вашингтон - город, куда Сэм надеялся никогда не возвращаться. Теперь ему придется сотрудничать с бывшими друзьями, которым он не верит, и спасать страну, которой он уже не служит. А кроме безликого могущественного противника Сэм должен победить и куда более опасного врага - собственное прошлое. Только так он узнает, что произошло с его дочерью... и с ним самим.\n\nSPLINTER CELL - CONVICTION (Совместная кампания)\nИз России украдено оружие массового уничтожения, которое нужно вернуть, пока его не продали на черном рынке. В поисках похитителей агент Арчер из \"Третьего эшелона\" и Ке", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "g4e7c1b050c8c", "n": "Tom Clancy's Splinter Cell Double Agent (рус.)", "t": "Tom Clancy's Splinter Cell: Double Agent", "r": "", "gb": 7.2, "x": "", "img": "../covers/g4e7c1b050c8c.jpg", "d": "Splinter Cell Double Agent is a Stealth-Action game where you play as Sam Fisher, a secret NSA agent, infiltrating a terrorist cell to destroy it from within. Face the gut-wrenching dilemmas of a Double Agent's life, do whatever it takes to complete your mission, and get out alive.  Play Online Multiplayer, as a Spy or a Mercenary, to experience either the chilling tension of infiltrating and hacking unseen or the brutal power of hunting and eliminating intruders. Use acrobatic moves against h…", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g92efd85625c5", "n": "Tom Clancy’s Ghost Recon - Future Soldier 2012 (рус.)", "t": "TC's Ghost Recon FS", "r": "", "gb": 10.3, "x": "", "img": "../covers/g92efd85625c5.jpg", "d": "Armed with the most advanced combat technology, the Ghosts are an untraceable unit of soldiers who track down the highest-value targets in the highest-risk conflict areas around the world. In the near future, 4 of these elite soldiers serve as the tip of the spear in a hidden war raging across the globe.  As the Ghosts accomplish their objectives, they discover a far greater threat - one that could alter the international balance of power forever.", "dl": "en", "cat": "Kinect, Shooter", "pl": "", "ru": null, "rel": "2012"}, {"id": "g75e12ea26772", "n": "Tomb Raider - Tomb of the Lost Adventurer", "t": "Tomb Raider", "r": "", "gb": 7.2, "x": "", "img": "../covers/g75e12ea26772.jpg", "d": "В играх по запросу поддерживаются русский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nСтаньте участником удивительной истории о том, как Лара Крофт превращается в бесстрашную расхитительницу гробниц. Чтобы выжить на полном опасностей острове, Лара должна раскрыть все его темные тайны, полагаясь только на свой ум и интуицию.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "g0426cc65354c", "n": "Tomb Raider Anniversary", "t": "", "r": "", "gb": 3.2, "x": "", "img": "../covers/g0426cc65354c.png", "d": "Это игра поддерживает английский, испанский, французский, немецкий и итальянский Языков.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nWhen Lara Croft is hired to retrieve a mythical object called the Scion, she begins a dangerous search across isolated and desolate worlds, places untouched for thousands of years. But Lara is not alone; the tombs are guarded by fearsome creatures, and close behind are others desperate to learn the Scion’s powerful secrets.\n\nCelebrate ten years of Lara Croft with her latest action adventure inspired by the original Tomb Raider, one of the greatest action adventure games of all time.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Стратегии и симуляторы", "pl": "", "ru": null, "rel": "2010"}, {"id": "g7efee1c223f4", "n": "Tomb Raider Legend", "t": "", "r": "", "gb": 6.9, "x": "", "img": "../covers/g7efee1c223f4.png", "d": "Эта игра поддерживает английский, испанский, французский, немецкий и итальянский язык. \n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nLara Croft, one of the greatest explorers of our time, is on the path of one of History’s greatest legends, a weapon with the power to command peace or destroy.\nIn hostile locations around the globe, diabolical traps, ancient guardian machinery and a figure from Lara’s past stand between her and the powerful relic. \nIn this thrilling adventure for the truth behind a Legend, Lara will discover the key to her own past, and her future.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Стратегии и симуляторы", "pl": "", "ru": null, "rel": "2010"}, {"id": "gd4262e9b306c", "n": "Tomb Raider Rise Of The", "t": "Rise of Tomb Raider", "r": "", "gb": 8.7, "x": "", "img": "../covers/gd4262e9b306c.png", "d": "Rise of the Tomb Raider — динамичная масштабная приключенческая игра с упором на выживание в опасных и вместе с тем завораживающих декорациях; вместе с расхитительницей гробниц Ларой Крофт вы отправитесь в ее самую первую экспедицию. Поражающие воображение гробницы и усыпальницы: героиня будет исследовать величественные сооружения, полные смертельных ловушек и хитрых головоломок, находить зашифрованные в надписях ключи и подсказки и, конечно же, распутывать тайны древнего мира. Женщина против природы: за каждую разгадку придется сражаться в жестких условиях на обширной местности, таящей опасность, посреди защищающих гробницы хищников. Партизанская война: враг превосходит и числом, и вооружением, так что придется скрываться на деревьях и под водой или нападать оттуда, совершенствовать снаряжение, оружие, боеприпасы, в том числе неизменные боевые луки и топор альпиниста, а также изготавлив", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2015"}, {"id": "gf2af4c33ac15", "n": "Tomb Raider Underworld", "t": "", "r": "", "gb": 6.7, "x": "", "img": "../covers/gf2af4c33ac15.png", "d": "Designed specifically to take advantage of the latest technologies Tomb Raider Underworld represents a new advancement in exploration-based gameplay. As fearless adventurer Lara Croft explore exotic locations around the world, each designed with an incredible attention to detail resulting in breathtaking high-definition visual fidelity that creates a truly believable world and delivers a new level of challenge and choice.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "gefb949338cf9", "n": "Tony Hawk's Pro Skater HD", "t": "Tony Hawk's Pro Skater HD", "r": "", "gb": 0.5, "x": "", "img": "../covers/gefb949338cf9.png", "d": "Tony Hawk’s Pro Skater HD is a downloadable title for Xbox LIVE Arcade that takes the best elements of the classic THPS games and gives them a fresh update to create an all new skateboarding experience. Tapping into fans’ muscle memories, the gameplay returns to controllers and focuses on the satisfaction of linking sick tricks for maximum points. Combining sharp visuals, the best controls ever in a Tony Hawk game, and fresh online modes, the feel is cutting edge yet timeless.", "dl": "en", "cat": "Sports & Recreation", "pl": "", "ru": null, "rel": "2012"}, {"id": "g orlds", "t": "Two Worlds", "r": "", "gb": 5.6, "x": "", "img": "../covers/gb887ef7ac12e.jpg", "d": "Open World RPG Game", "dl": "en", "cat": "Role Playing", "pl": "", "ru": null, "rel": "2007"}, {"id": "g3c8137715a02", "n": "UFC 2009 Undisputed", "t": "UFC 2009 Undisputed", "r": "", "gb": 7.1, "x": "", "img": "../covers/g3c8137715a02.jpg", "d": "UFC 2009 Undisputed is an explosive fighting game detailing the action, intensity and attitude of the Ultimate Fighting Championship®  (UFC).   Featuring an authentic and comprehensive UFC atmosphere, including an extensive roster of the best mixed martial arts fighters in the world, players will push the envelope with a powerful new game engine and put their best fighting disciplines to the test in the world famous Octagon.  Take your best shot - UFC 2009 Undisputed is as real as it gets!", "dl": "en", "cat": "Fighting, Sports & Recreation", "pl": "", "ru": null, "rel": "2009"}, {"id": "g10d304fc1439", "n": "UFC Undisputed 2010", "t": "UFC Undisputed 2010", "r": "", "gb": 6.6, "x": "", "img": "../covers/g10d304fc1439.jpg", "d": "So … you want to be a fighter?  UFC® Undisputed™ 2010 is the only mixed martial arts (MMA) videogame that delivers the action, intensity and prestige of the Ultimate Fighting Championship® (UFC).  Step into the Octagon™ to experience the most advanced and commanding virtual MMA action with more than 100 of the best UFC fighters in the world.  Experience intelligent and intuitive combat, increased fighter customization, robust career progression, challenging new gameplay modes and explosive onli…", "dl": "en", "cat": "Fighting, Sports & Recreation", "pl": "", "ru": null, "rel": "2010"}, {"id": "gb5412c8311d7", "n": "UFC Undisputed 3", "t": "UFC Undisputed 3", "r": "", "gb": 7.4, "x": "", "img": "../covers/gb5412c8311d7.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, португальский.\n\nThe best-selling franchise
