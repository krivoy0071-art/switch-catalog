<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог игр</title>
<style>
:root{--bg:#141518;--card:#1f2125;--line:#2e3137;--fg:#e8e8e8;--mut:#9aa0a6;--acc2:#1e88e5;--ok:#4caf50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#141518ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{padding:10px 14px 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px}
input[type=search]{flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.lang span{padding:6px 10px;cursor:pointer;color:var(--mut);font-size:13px}.lang span.on{background:var(--acc2);color:#fff}
.note{padding:0 14px 10px;color:#ffcc80;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 14px 130px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative;transition:border-color .15s}
.card.on{border-color:var(--acc2)}.card img{width:100%;aspect-ratio:var(--ar);object-fit:cover;display:block;background:#2b2d31}
.card .noimg{width:100%;aspect-ratio:var(--ar);background:#2b2d31;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;text-align:center;padding:8px}
.card .b{padding:8px}.card .n{font-weight:600;font-size:14px;line-height:1.25}.card .t{color:var(--mut);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{color:#cfd8dc;font-size:12px;margin-top:4px}.card .chk{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:6px;background:#0008;border:2px solid #fff9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.card.on .chk{background:var(--acc2);border-color:var(--acc2)}
.card .inf{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:#000a;border:1px solid #fff6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.card .ru{position:absolute;left:8px;bottom:auto;top:38px;background:#2e7d32;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700}
.dbox img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;background:#2b2d31}.dbox h3{margin:10px 0 4px;font-size:17px}.dbox .meta{color:var(--mut);font-size:13px;margin-bottom:8px}.dbox .txt{white-space:pre-wrap;font-size:14px;line-height:1.45}
footer{position:fixed;left:0;right:0;bottom:0;background:#1a1b1f;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer .sum{flex:1;min-width:160px}button{padding:10px 14px;border-radius:8px;border:0;background:var(--acc2);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button.sec{background:#2b2d31;color:var(--fg)}textarea{width:100%;height:130px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto}.box label{display:block;color:var(--mut);font-size:13px;margin:8px 0 4px}
.box input[type=text],.box input[type=tel]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.hint{color:var(--mut);font-size:12px}
.bar{height:6px;background:#2b2d31;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
</style></head><body>
<header><div class="hrow"><h1 id="h1"></h1><input id="q" type="search"><select id="card"></select><span id="cnt" class="hint"></span><div class="lang"><span data-l="ru">RU</span><span data-l="uz">UZ</span></div></div><div class="note" id="note"></div></header>
<div class="grid" id="grid"></div>
<footer><div class="sum"><div id="sum"></div><div class="bar" id="barw" style="display:none"><i id="bar"></i></div></div><button class="sec" id="bClear" onclick="clearAll()"></button><button id="bOrder" onclick="openOrder()"></button></footer>
<div class="modal" id="dm" onclick="if(event.target===this)this.classList.remove('on')"><div class="box dbox"><div id="dmc"></div><div class="row"><button id="dmSel" onclick="dmToggle()"></button><button class="sec" onclick="document.getElementById('dm').classList.remove('on')" id="dmClose"></button></div></div></div>
<div class="modal" id="m"><div class="box"><b id="mTitle"></b>
<label id="lWho"></label><input type="text" id="who"><label id="lPhone"></label><input type="tel" id="phone">
<label id="lList"></label><textarea id="txt" readonly></textarea>
<div class="row"><button id="bTg" onclick="sendTg()"></button><button class="sec" id="bCopy" onclick="copyTxt()"></button><button class="sec" id="bClose" onclick="document.getElementById('m').classList.remove('on')"></button></div>
<div class="hint" id="mHint" style="margin-top:8px"></div></div></div>
<script>
const DATA=[{"id": "g238ce883d9ed", "n": "007 Blood Stone", "t": "[X360-CLUB] 007: Blood Stone", "r": "", "gb": 7.2, "x": "", "img": "../covers/g238ce883d9ed.jpg", "d": "The UK’s top secret biochemical project has fallen into enemy hands. Only one can unravel the sinister goal, and defeat those behind it: Bond, James Bond.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g72471f54cf8b", "n": "Ace Combat 6 FOL", "t": "ACE COMBAT 6", "r": "", "gb": 5.3, "x": "", "img": "../covers/g72471f54cf8b.jpg", "d": "Witness high definition graphics rendering the world around you into super realistic war zones, made possible only by next generation  processing power. Lead not only aerial combat units but also naval and ground combat units to victory. Massive conflicts unfold on a “living battlefield” integrated by the “Dynamic Operation System” where up to six independent aerial, ground, and naval battles can break out at once as allies and enemies clash in real-time.", "dl": "en", "cat": "Action & Adventure, Racing & Flying", "pl": "", "ru": null, "rel": "2007"}, {"id": "gafc09bc2f88b", "n": "Ace Combat Assault Horizon", "t": "Ace Combat: Assault Horizon", "r": "", "gb": 8.8, "x": "", "img": "../covers/gafc09bc2f88b.png", "d": "В играх по запросу поддерживаются английский, русский. Загрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nЛетайте на сверхзвуковых скоростях и получайте удовольствие от воздушных боев и массированных бомбардировок!\nИспользуя штурмовики, уничтожайте силы противника за один налет, маневрируя между взрывами!\nУничтожайте противника за штурвалом различных видов самолетов: штурмовиков, истребителей и бомбардировщиков с различным вооружением!\nОщутите реалистичный сюжет в игровом процессе кампании и многопользовательских режимах с участием от 2 до 16 игроков! \n\nВесь сценарий и описанные события вымышлены. Любое сходство с существующими названиями государств и географических мест, именами людей (живых или мертвых), названиями корпораций и организаций случайно. В продукте присутствуют изображения и упоминания существующих архитектурных", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Авиасимуляторы и автогонки, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "g9baabbf4cf96", "n": "Afro Samurai (рус.)", "t": "AFRO SAMURAI", "r": "", "gb": 3.5, "x": "", "img": "../covers/g9baabbf4cf96.jpg", "d": "The quest for #1 comes to the Xbox 360! Afro Samurai is an action-adventure game featuring never before seen combat mechanics, stunning visuals, and an amazing cast of characters creating a brutally fresh entertainment experience. Afro Samurai utilizes a dynamic cross-hatching art style and cut-scene paneling that makes the game look like a comic come to life while its innovative combat system gives players the ability to dynamically cut enemies at any point in the body. Starring Samuel L. Jack…", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "ge862acc192ab", "n": "Air Conflicts Vietnam", "t": "Air Conflicts: Vietnam", "r": "", "gb": 3.6, "x": "", "img": "../covers/ge862acc192ab.jpg", "d": "", "dl": "", "cat": "", "pl": "", "ru": null, "rel": ""}, {"id": "g441de70846c3", "n": "Alan Wake", "t": "Alan Wake", "r": "", "gb": 7.9, "x": "", "img": "../covers/g441de70846c3.jpg", "d": "ВО ТЬМЕ, БОРЯСЬ СО СВЕТОМ.\n\nКомпания Remedy, мастер кинематографичных боевиков, выпускает игру от третьего лица, наполненную почти непреодолимыми мистическими явлениями и отчаянной борьбой за жизнь.\n\nКогда жена автора детективных бестселлеров Алана Уэйка исчезает во время отпуска, он начинает находить страницы якобы написанного им триллера, который он не помнит. Темная Сущность окутывает городок Брайт Фоллс и доводит Уэйка, пытающегося разгадать тайну и спасти свою любимую, до грани безумия.\n\nВ игре «Алан Уэйк» соединяются черты боевика и психологического триллера, и этот коктейль способен серьезно пощекотать нервы.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "gd65b42f00899", "n": "Alice Madness Returns (рус.)", "t": "", "r": "", "gb": 6.1, "x": "", "img": "../covers/gd65b42f00899.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\nОдиннадцать лет назад ужасный пожар навсегда разлучил Алису с родителями и оставил глубокие незаживающие следы в хрупком сознании девочки. Алису поместили в лечебницу для умалишенных Рутледж, в которой она научилась убегать от демонов, поселившихся в ее сознании, все дальше и дальше в выдуманную страну, Страну чудес. Даже сейчас, спустя десять лет, когда она наконец оказалась на свободе, ее разум так и не оправился от последствий тяжелой психологической травмы. Искалеченное сознание не может понять, почему странные видения, сны и воспоминания вызывают такой ужас. Поэтому она вновь пытается спастись от них в Стране чудес. Она всегда так делала. В путешествии по выдуманному миру она ищет того, чего была лишена в \"настоящем\": чувства защищенности, понимания и осозна", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2011"}, {"id": "g910936bff5d7", "n": "Alien Isolation Ripley Edition", "t": "Alien: Isolation", "r": "", "gb": 12.1, "x": "", "img": "../covers/g910936bff5d7.jpg", "d": "Игры на версии Demand поддерживает английский, французский, итальянский, немецкий, испанский, польский, португальский, русский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nОщутите подлинный страх в мире Alien: Isolation - триллере с атмосферой ужаса и смертельной угрозы. Спустя 15 лет после событий Alien™ дочь Эллен Рипли, Аманда, начинает искать истинную причину исчезновения матери и вступает в схватку за выживание.\n\nВ роли Аманды вы погрузитесь во взрывоопасный мир: вам будут угрожать отчаявшиеся, паникующие местные обитатели и непредсказуемый, безжалостный Чужой.\n\nВы - слабая девушка, поэтому ищите ресурсы и импровизируйте, стараясь выжить в этом аду.\n\nСоздано на базе CATHODE™.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2014"}, {"id": "g527c4e2fd6ec", "n": "Aliens Colonial Marines", "t": "Aliens: Colonial Marines", "r": "", "gb": 8.9, "x": "", "img": "../covers/g527c4e2fd6ec.png", "d": "В играх по запросу поддерживаются русский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nПрославленная студия Gearbox Software и Twentieth Century Fox Consumer Products представляют Aliens: Colonial Marines, продолжение знаменитой серии. Сразись с ксеноморфами, самыми ужасными машинами убийства во вселенной! Почувствуй cтрах, от которого кровь стынет в жилах!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "g52f7eccf4a01", "n": "Aliens vs. Predator", "t": "Aliens vs Predator", "r": "", "gb": 6.7, "x": "", "img": "../covers/g52f7eccf4a01.jpg", "d": "Станьте участником беспощадной схватки между культовыми персонажами.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2014"}, {"id": "g4c66806ec0b0", "n": "Alone in the dark", "t": "Alone In The Dark", "r": "", "gb": 6.9, "x": "", "img": "../covers/g4c66806ec0b0.jpg", "d": "Central Park is hiding a secret.  One of the original video game innovators, Alone In The Dark returns to re-define action gaming with an apocalyptic action blockbuster.   The game's hero, Edward Carnby, must uncover the earth-shattering truth behind Manhattan's vast parkland.  With an unprecedented level of real-world interaction, physics, and a new degree of narrative intensity, Alone In The Dark breaks gaming clichés to fulfill the next-gen promise.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "g5ed64f696714", "n": "Alpha Protocol (рус.)", "t": "Alpha Protocol", "r": "", "gb": 6.3, "x": "", "img": "../covers/g5ed64f696714.jpg", "d": "Worldwide political tensions reach the breaking point in Obsidian Entertainment’s latest game Alpha Protocol, the espionage themed RPG for 2010. Amidst a mire of crooked arms dealers, sinister terrorist groups, and shadowy government organizations, Michael Thorton stands alone, capable of staving off or hastening the world’s destruction. With whom to trust and what to believe in question, Thorton’s swift thinking and bold actions are his greatest allies.", "dl": "en", "cat": "Action & Adventure, Role Playing, Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "ga344d3ce92d7", "n": "Amy (рус.)", "t": "AMY", "r": "", "gb": 1.7, "x": "", "img": "../covers/ga344d3ce92d7.jpg", "d": "Город заражен! Ходячие мертвецы шмыгают ноздрями, вынюхивая последних оставшихся в живых. Лишь одна вещь сдерживает вас от того, чтобы не пуститься наутек - маленькая девочка, которая все время держит вас за руку. Без нее вы никуда не пойдете.\nС AMY вы испытаете невиданные ощущения погружения в жанр хоррора на выживание. Играйте за двух оригинальных персонажей, которые беспомощны по отдельности, но вместе могут дать отпор полчищам нежити. Готовьтесь к заражению!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2012"}, {"id": "gaed92ea75e9a", "n": "Anarchy reigns", "t": "ANARCHY REIGNS", "r": "", "gb": 8.3, "x": "", "img": "../covers/gaed92ea75e9a.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, испанский, корейский\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nANARCHY REIGNS™ - сетевой многопользовательский симулятор рукопашных схваток: постапокалиптическое будущее, непревзойденная боевая система, огромный и непредсказуемый мир. Выберите бойца - человека или киборга - и погрузитесь в мир сетевых схваток, где правит бал анархия!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2012"}, {"id": "g3ebebaa5c1d5", "n": "Apache Air Assault (рус.)", "t": "Apache: Air Assault", "r": "", "gb": 1.5, "x": "", "img": "../covers/g3ebebaa5c1d5.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, немецкий, испанский.\nApache: Air Assault is a modern combat flight simulation game where players control a variety of lethal Apache attack helicopters outfitted with cutting-edge military weaponry. The goal is to prevent terrorist attacks by raining down destruction from above in the world’s most volatile warzones.", "dl": "ru", "cat": "Жанры игр, Авиасимуляторы и автогонки", "pl": "", "ru": null, "rel": "2010"}, {"id": "gf9cbb30cb199", "n": "Arcana Heart 3", "t": "Arcana Heart 3", "r": "", "gb": 7.6, "x": "", "img": "../covers/gf9cbb30cb199.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, японский.\n\nSensational all-girl fighting action with stunning 2D artwork, incredible aerial combos and eye-watering special attacks!", "dl": "ru", "cat": "Жанры игр, Драки", "pl": "", "ru": null, "rel": "2011"}, {"id": "g45def56e79a0", "n": "Arcania Gothic 4 (рус.)", "t": "ArcaniA - Gothic 4", "r": "", "gb": 5.4, "x": "", "img": "../covers/g45def56e79a0.jpg", "d": "ArcaniA continues the successful \"Gothic\" RPG-Series. Ten years have passed since the end of Gothic 3 and the world has changed - the Southern Islands have become embroiled in a grueling conflict, and set the stage for the player to brave countless adventures in the guise of a nameless hero. In a vibrant and elaborate environment, decisions will have to be made which will change not only the future of the Southern Islands, but of the entire world.", "dl": "en", "cat": "Role Playing", "pl": "", "ru": null, "rel": "2013"}, {"id": "gd94cba6dc974", "n": "Armored core V", "t": "ACV", "r": "", "gb": 3.6, "x": "", "img": "../covers/gd94cba6dc974.jpg", "d": "The ravages of war & natural disasters have depleted natural resources, leaving mankind in peril. Wage fierce battles for control of territories using the most powerful weapons of war: Armored Core!  ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "g5890c814d355", "n": "Army of Two T 40th D", "t": "Army of TWO™: TFD", "r": "", "gb": 6.5, "x": "", "img": "../covers/g5890c814d355.jpg", "d": "When a man-made disaster of epic proportions strikes Shanghai, China, Rios and Salem find themselves right in the middle of it all. Fortunately for you, you’ve got a bigger playbook of features and a new arsenal of co-op moves that either player can perform at any time, opening up fresh strategies and choices for both players. You’ve also got the tools you need to help the Army of TWO™ fight and prevail with an incredibly deep, advanced weapon customization and upgrade system.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "gaedac3ec9bac", "n": "Army of Two™", "t": "AoT", "r": "", "gb": 6.6, "x": "", "img": "../covers/gaedac3ec9bac.jpg", "d": "When one man is not enough, it will take an army of two to fight through war, political turmoil and a conspiracy so vast it threatens the entire world.  Some multi-player functionalities may no longer be supported.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "g3b137ebd0209", "n": "Army of Two™ The Devil's Cartel", "t": "Difficulty", "r": "", "gb": 7.8, "x": "", "img": "../covers/g3b137ebd0209.jpg", "d": "В играх по запросу поддерживаются английский, французский, испанский.\n\nВы можете загрузить руководство пользователя для данной игры, пройдя по ссылке https://help.ea.com/ru/tag/manuals и выбрав соответствующее название в выпадающем списке \"Продукты\".\n\nПрародитель тактических игр возвращается! Студия Visceral Games, прославившаяся игрой Dead Space™, создала Army of TWO™ The Devil’s Cartel - увлекательный и самобытный шутер от третьего лица, построенный на новом графическом движке Frostbite 2, способном живописать масштабные разрушения. Чтобы побороть наркокартель, захвативший Мехико, вам с напарником придется уничтожить все на своем пути. В каждом из заданий игрок должен выполнять личные задания, чтобы достичь общей цели. Чем эффективнее вы работаете в паре, тем серьезнее награда - новый режим Overkill дарит вам сокрушительную мощь, чтобы творить хаос! Вы сможете пройти потрясающую боевую", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "g07ca023ada3a", "n": "Assassin's Creed Brotherhood", "t": "AC Brotherhood", "r": "", "gb": 8.3, "x": "", "img": "../covers/g07ca023ada3a.jpg", "d": "В играх по запросу поддерживаются английский, русский, итальянский.\n\nВерсия для раздела \"Игры по запросу\" поддерживает следующие языки: русский, польский. \n\nBE A LEGEND\nLIVE AND BREATHE AS EZIO, A LEGENDARY MASTER ASSASSIN, IN HIS ENDURING STRUGGLE AGAINST THE POWERFUL TEMPLAR ORDER. JOURNEY INTO ITALY’S GREATEST CITY, ROME, CENTER OF POWER, GREED AND CORRUPTION TO STRIKE AT THE HEART OF THE ENEMY.\n\nFOR THE FIRST TIME, TAKE PART IN AN INNOVATIVE MULTIPLAYER LAYER AND EMBODY AN ASSASSIN OF YOUR CHOOSING, DEFINE THEIR KILLING STYLE AND MATCH YOUR SKILLS AGAINST OTHER PLAYERS FROM AROUND THE WORLD.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "g28dc769dde94", "n": "Assassin's Creed II", "t": "Assassin's Creed II", "r": "", "gb": 7.2, "x": "", "img": "../covers/g28dc769dde94.jpg", "d": "В играх по запросу поддерживаются польский, русский.\n\nЮноша, которого предали правящие семьи Италии, начинает свой трудный путь мстителя.\nЧтобы искоренить коррупцию и восстановить честь семьи, он будет изучать тайны древнего Кодекса, написанного Альтаиром.\nДля друзей он станет силой, приносящей перемены, бойцом за свободу и справедливость.\nДля врагов он будет ангелом мщения, истребителем тиранов, угнетающих народ Италии.\nЕго имя - Эцио Аудиторе да Фиренце.\nОн - ассасин.\nСетевые режимы и функции в этой игре больше не доступны.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "g6d9f3bf80aea", "n": "Assassin's Creed Revelations", "t": "AC Revelations", "r": "", "gb": 7.7, "x": "", "img": "../covers/g6d9f3bf80aea.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nКогда человек выиграл все битвы и одолел всех врагов, к чему еще стремиться? Где отыскать дальнейшую цель и смысл жизни? Чтобы найти ответы на эти вопросы, Эцио отправляется на восток, на поиски потерянной библиотеки ассасинов.\n\nВ Assassin’s Creed® Revelations мастер-ассасин Эцио Аудиторе идет по стопам легендарного Альтаира. Опасный путь откровений и открытий приводит Эцио в Константинополь - самое сердце Оттоманской Империи, где растущая армия Тамплиеров угрожает миру и спокойствию всего региона.\nСетевые функции в этой игре больше не доступны.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2011"}, {"id": "g6427147a1f9d", "n": "Assassin's Creed Rogue (рус.)", "t": "Assassin's Creed Rogue PM", "r": "", "gb": 7.4, "x": "", "img": "../covers/g6427147a1f9d.jpg", "d": "В играх по запросу поддерживаются английский, русский, \n\nXVIII век. Северная Америка. Вы играете за Шея Патрика Кормака, бесстрашного юного ассасина. После трагедии, произошедшей во время выполнения задания, Шей ушел из Братства, чем навлек на себя гнев бывших товарищей. Шей отомстит за предательство и станет самым известным охотником на ассасинов в истории.\n\n●Станьте искусным воином, цель которого - уничтожить Братство в Америке\n\n●Преодолейте опасности Арктики за штурвалом \"Морриган\"\n\n●Исследуйте Америку от Нью-Йорка до Ривер-Вэлли", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2014"}, {"id": "g74b82aac125e", "n": "Assassins Creed 4 Black Flag", "t": "Assassin's Creed IV Disc 1", "r": "", "gb": 7.4, "x": "", "img": "../covers/g74b82aac125e.jpg", "d": "В играх по запросу поддерживаются английский. \n\nДля французской, немецкой, испанской, итальянской, русской и португальской версий потребуется загрузить бесплатный дополнительный языковой пакет через пункт \"Дополнительный контент\" в главном меню игры.\n\n1715 год, пираты заполонили Карибское море и создали отдельную республику, где царят беззаконие и хаос. И среди этих преступников - молодой и грозный капитан Эдвард Кенвей. Своими подвигами он заслужил уважение легендарных пиратов, одним из которых является Черная Борода, но эти же подвиги втянули его в древнюю войну, которая может разрушить все, чего добились пираты.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "ga806b3615430", "n": "Asura's Wrath", "t": "ASURA'S WRATH", "r": "", "gb": 11.2, "x": "", "img": "../covers/ga806b3615430.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский и японский языки.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2012"}, {"id": "g2e4052dd81a5", "n": "Bakugan Battle brawlers", "t": "Bakugan™", "r": "", "gb": 3.4, "x": "", "img": "../covers/g2e4052dd81a5.jpg", "d": "Bakugan Battle Brawlers is the stunning new video game based on the #1 toy and animated series. Set your Gate card then throw a Bakugan into huge, interactive battlefields. Steer the Bakugan to discover secret areas, collect power-ups and gain the edge! When two Bakugan stand on the same gate card they transform into powerful creatures and an epic interactive battle begins. You’ll need all your skills to boost your Bakugan’s power and emerge victorious! Play in story mode to unlock dozens of Ba…", "dl": "en", "cat": "Action & Adventure, Card & Board, Family, Fighting, Strategy & Simulation", "pl": "", "ru": null, "rel": "2009"}, {"id": "g430a6c7721ea", "n": "Banjo Kazooie N&B", "t": "Banjo Kazooie: N&B", "r": "", "gb": 6.6, "x": "Детские", "img": "../covers/g430a6c7721ea.jpg", "d": "Эта игра поддерживает английский, французский, итальянский, немецкий и испанский языки. Отважные медведь и птица наконец возвращаются, чтобы защитить Спиральную гору от зловещей Грунтильды. Новейшие машинные приключения и много разных возможностей ждут вас в новых мирах с новыми и уже знакомыми героями. Стройте восхитительные машины и участвуйте в соревнованиях за Джигги так, как вам больше нравится!", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Платформер, Авиасимуляторы и автогонки", "pl": "", "ru": null, "rel": "2010"}, {"id": "g968d6bd18404", "n": "Batman Arkham Asylum", "t": "Batman: Arkham Asylum", "r": "", "gb": 7.2, "x": "", "img": "../covers/g968d6bd18404.jpg", "d": "Эта игра поддерживает английский, французский, итальянский, немецкий и испанский языки Языки. \n\nПроникновение героя в логово умалишенных преступников.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Драки, Платформер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g8011330569b7", "n": "Batman Arkham City", "t": "Batman: Arkham City™", "r": "", "gb": 8.5, "x": "", "img": "../covers/g8011330569b7.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, русский, японский, корейский.\n\nИз Аркхем-сити невозможно сбежать… огромная супер-тюрьма в самом сердце Готэм-сити, где содержатся самые отчаянные бандиты и самые известные супер-преступники города. На кону – жизни невинных людей, и только один человек может спасти их и установить справедливость на улицах Готэм-сити…Бэтмен.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Драки, Платформер", "pl": "", "ru": null, "rel": "2011"}, {"id": "gca06b0fb1c11", "n": "Batman Arkham Origins", "t": "Batman™ Arkham Origins Disc 1", "r": "", "gb": 8.6, "x": "", "img": "../covers/gca06b0fb1c11.jpg", "d": "Batman™: Летопись Аркхема приглашает вас в путешествие по расширенной версии Готэма. Оригинальный сюжет приквела начинается за несколько лет до событий знаменитых Batman™: Arkham Asylum и Batman™: Arkham City ─ первых двух игр серии. Опаснейшие преступники Готэма еще не взяли власть в городе. Игрок будет управлять молодым и неопытным Бэтменом, которому предстоит первое серьезное испытание на пути к превращению в Темного Рыцаря.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "ge75e82c5d543", "n": "Batman The Telltale Series (рус.)", "t": "Batman", "r": "", "gb": 0.8, "x": "", "img": "../covers/ge75e82c5d543.png", "d": "Проникните в сломанную психику Bruce Wayne и обнаружьте мощные, далеко идущие последствия ваших решений в качестве Dark Knight. В этой жесткой и полной насилия истории от отмеченных наградами создателей The Walking Dead (компания A Telltale Games Series) вы обнаружите то, что разрушит как мир Bruce Wayne, так и уже пошатнувшийся уклад коррумпированного Gotham City.\n\nВаши действия и решения определят судьбу Batman.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2016"}, {"id": "g4374003192e2", "n": "Battle Fantasia", "t": "Battle Fantasia", "r": "", "gb": 1.3, "x": "", "img": "../covers/g4374003192e2.jpg", "d": "Battle Fantasia, a fighting game set in a world of swords and sorcery! Designed with a system that is easy to learn but difficult to master, Battle Fantasia is fun for casual and expert gamers! Twenty-four storylines are brought to life with incredible graphics and twelve fully-voiced characters.", "dl": "en", "cat": "Fighting", "pl": "", "ru": null, "rel": "2010"}, {"id": "g9c42597db4f3", "n": "Battle for the Pacific", "t": "History Battle Pacific", "r": "", "gb": 3.6, "x": "", "img": "../covers/g9c42597db4f3.png", "d": "Experience Battle for the Pacific.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "gf78f8b9f5b2f", "n": "Battlefield 4", "t": "{c3} Disc 2", "r": "", "gb": 8.1, "x": "", "img": "../covers/gf78f8b9f5b2f.png", "d": "Battlefield 4™ это определяющий для жанра, полный экшена боевик. Основанный на мощной и надежной технологией следующего поколения Frostbite™ 3, Battlefield 4 предлагает интуитивный, полный драматизма игровой опыт, не похожий ни на что другое.\n\nТолько в Battlefield вы сможете разрушать здания, в которых скрывается противник. Только в Battlefield вы будете руководить штурмом, находясь на борту вооруженного катера. Battlefield предоставляет вам еще большую свободу в действиях и поступках, позволяя пользоваться своими преимуществами и прокладывать собственный путь к победе.\n\nПомимо эталонного многопользовательского режима, Battlefield 4 имеет насыщенную драматическую кампанию с интересными персонажами, которая начинается с эвакуации американских VIP-персон из Шанхая и рассказывает о дальнейших попытках вашего отряда отыскать путь домой.\n\nЭто не сравнится ни с чем. Погрузитесь в великолепный ", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "gd5a3af49d693", "n": "Battlefield Bad Company", "t": "BF: Bad Company", "r": "", "gb": 6.6, "x": "", "img": "../covers/gd5a3af49d693.jpg", "d": "Battlefield: Bad Company follows a wayward band of ordinary soldiers who decide that sometimes the gratitude of a nation just isn’t enough. Featuring a dramatic storyline loaded with a unique attitude, the game delivers the series' trademark sandbox gameplay in a universe where almost everything is destructible. The ever-changing battlefield forces players, their team mates and enemies to react accordingly and use destruction tactically. The game also features the all new, objective based multi…", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "ge89f575fae07", "n": "Battlefield Bad Company 2", "t": "Battlefield Bad Co. 2", "r": "", "gb": 5.2, "x": "", "img": "../covers/ge89f575fae07.png", "d": "VIP Access is not included with Games on Demand purchase. Download the manual for this game by locating the game on http://marketplace.xbox.com and selecting “See Game Manual\". \n\nБлагодаря лучшему на текущий момент моделированию боя с использованием техники и неожиданным \"Боевым моментам\" (\"Battlefield moments\") Battlefield: Bad Company™ 2 делает эту реализацию полюбившегося игрокам стиля Battlefield одной из лучших игр для консоли Xbox 360. Появление в игре новой техники - транспортного вертолета и квадроцикла - расширяет возможности многопользовательской игры и открывает возможности для использования новых тактик. Cистема Destruction 2.0 позволяет стирать с лица земли целые постройки и создавать огневые точки, пробивая бреши в укрытиях. Сражаясь плечом к плечу, вы сможете проходить игру в режиме двух отрядов по четыре игрока и открывать особые награды и достижения. Бои проходят на расш", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "ga54f15775a4f", "n": "Battlefield Hardline", "t": "{c3} Disc 2", "r": "", "gb": 11.8, "x": "", "img": "../covers/ga54f15775a4f.png", "d": "В игре Battlefield™ Hardline вы либо на одной стороне закона, либо на другой. В этом насыщенном событиями блокбастере объединены напряженная, всем знакомая сетевая игра Battlefield и захватывающий сюжет в стиле современной криминальной теледрамы.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2015"}, {"id": "ga7e7ad0a3812", "n": "Battlefield3", "t": "Battlefield 3", "r": "", "gb": 8.9, "x": "", "img": "../covers/ga7e7ad0a3812.jpg", "d": "Battlefield 3 оставляет позади всех своих конкурентов, благодаря мощностям нового невероятного игрового движка Frostbite™ 2 от DICE. На этом произведении искусства основывается весь Battlefield 3, предлагая игроку великолепное качество графики, локации невероятных масштабов, полное разрушение объектов, динамический звук и реалистичную анимацию персонажей. Вы сможете прочувствовать поле боя как никогда раньше, с свистящими вокруг пулями, рушащимися стенами и сбивающими вас с ног взрывами. В Battlefield 3 игрокам предстоит стать элитой морской пехоты США и погрузиться в захватывающие задания из одиночной игры и великолепные многопользовательские сражения по всему миру, в том числе в Париже, Тегеране и Нью-Йорке.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "gd08c31eb54c5", "n": "Battleship", "t": "Battleship", "r": "", "gb": 3.3, "x": "", "img": "../covers/gd08c31eb54c5.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nInvasion at Sea. Revenge on Land.\n\nCommand your troops on the ground and your fleet on the sea to wage war against an unknown alien invader. This is your fleet. These are your forces. This is your fight.\n\nSecure the sea with ship-to-ship battles, airstrikes and radar sweeps.\nStorm the shores to battle aliens in epic first-person action.\nBlow enemies out of the water with cutting-edge, upgradeable weapons", "dl": "ru", "cat": "Жанры игр, Шутер, Стратегии и симуляторы", "pl": "", "ru": null, "rel": "2012"}, {"id": "g823d3c219fe0", "n": "Battlestations Pacific", "t": "Battlestations Pacific", "r": "", "gb": 5.3, "x": "", "img": "../covers/g823d3c219fe0.jpg", "d": "Battlestations Pacific is the sequel to the critically acclaimed Battlestations Midway. Take the fight in the Pacific direct to the enemy in this epic action-strategy game where players command and take control of over 100 air, sea and undersea units. Fight in two massive historic single player campaigns and battle online in a deep multiplayer game featuring 5 unique modes across numerous battle scenarios.", "dl": "en", "cat": "Action & Adventure, Strategy & Simulation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g8133c8c38eb4", "n": "Bayonetta", "t": "", "r": "", "gb": 7.8, "x": "", "img": "../covers/g8133c8c38eb4.jpg", "d": "Xbox 360 iconic classic BAYONETTA; a game of 100% pure, unadulterated, climatic action. With powers far beyond the comprehension of mere mortals, our heroine Bayonetta fights countless enemies, evil forces and giant foes in brutal yet graceful ways.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2009"}, {"id": "gf6e5b185cfd6", "n": "Beautiful Katamari", "t": "Beautiful Katamari", "r": "", "gb": 2.9, "x": "", "img": "../covers/gf6e5b185cfd6.jpg", "d": "Roll your katamari and collect lots of stuff in order to increase its size in this fun and quirky action game!", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g4b299f546c3c", "n": "Beyond Good and Evil", "t": "Beyond Good & Evil HD", "r": "", "gb": 1.8, "x": "Детские", "img": "../covers/g4b299f546c3c.jpg", "d": "Play the award-winning and innovative action adventure game Beyond Good & Evil™, now with fully remastered HD graphics.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "g8a832799b8b5", "n": "Binary Domain (рус.)", "t": "Binary Domain", "r": "", "gb": 7.8, "x": "", "img": "../covers/g8a832799b8b5.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\n\nВ Binary Domain вы попадаете прямо в гущу боя между людьми и роботами в Токио 2080 года. Играйте в команде, думайте на несколько шагов вперед и победите машины. Будьте человеком - будьте непредсказуемы.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "g369e7fa7ac73", "n": "Bionicle Heroes ENG", "t": "Bionicle Heroes", "r": "", "gb": 3.7, "x": "", "img": "../covers/g369e7fa7ac73.jpg", "d": "BIONICLE Heroes is a totally new and thrilling adventure featuring the new 2006 BIONICLE toy range from LEGO, the mighty Toa Inika and the dastardly Piraka. Harness the elemental powers of each Toa hero. Master their unique tools and abilities in order to defeat the villainous Piraka one by one.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "g1992af12357f", "n": "BioShock Ultimate", "t": "BioShock", "r": "", "gb": 5.3, "x": "", "img": "../covers/g1992af12357f.jpg", "d": "BioShock – это «генетически-модифицированный» шутер от первого лица, позволяющий вытворять ранее невозможное в этом жанре: превращать в оружие что угодно, биологически модифицировать собственное тело при помощи плазмид, взламывать устройства и системы, обновлять оружие, создавать новые варианты амуниции и экспериментировать с различными техниками боя.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g6be9260af1c8", "n": "BlackSite", "t": "Blacksite", "r": "", "gb": 7.2, "x": "", "img": "../covers/g6be9260af1c8.jpg", "d": "Modern day fears come to life in a familiar, yet extraordinary setting: A small American town swarming with alien life. The government is desperate, struggling to contain secrets so terrible they can no longer be kept. Everything hinges on the actions of Aeran Pierce, a former Special Forces assassin thrown into one of the most explosive moments in American history.  A Living, Breathing Squad Lead well and your squad will rally in battle. Waver and their morale will sink, affecting their tactics", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "g9de84cc024cf", "n": "Blades of Time", "t": "Blades of Time by IlyaKizlyar", "r": "", "gb": 1.9, "x": "", "img": "../covers/g9de84cc024cf.jpg", "d": "Прекрасная Аюми, великолепно вооруженная и бесстрашная, отправляется на древний остров в поисках сокровищ и приключений. Пропитанный магией Хаоса и полный тайн, он порадует охотницу не только трофеями, но и целой армией кровожадных монстров. Тщательно проработанная игровая вселенная и колоритные злодеи, хитроумные ловушки, горы сокровищ, огромное разнообразие боевых и магических умений - Blades of Time доставит удовольствие и начинающим геймерам, и опытным поклонникам жанра action adventure.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2012"}, {"id": "g2e341c3cd8bb", "n": "Blood Bowl", "t": "", "r": "", "gb": 1.3, "x": "", "img": "../covers/g2e341c3cd8bb.jpg", "d": "Blood Bowl is the video game adaptation of Games Workshop's famous board game. A brutal team sport unfolding in a parallel fantasy world based on Warhammer and American football, Blood Bowl invites you to form a team of players from such races as Orcs, Wood Elves, Humans, Dwarfs and many other fantasy creatures, and launch into battle in the bloodiest of arenas. All of the strategies and play of the original game have been faithfully reproduced. The single-player experience allows the player …", "dl": "en", "cat": "Sports & Recreation, Strategy & Simulation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g8bb7322cbf82", "n": "Blood Drive", "t": "Unable to read name.", "r": "", "gb": 1.8, "x": "", "img": "../covers/g8bb7322cbf82.jpg", "d": "You have stepped into the most ruthless modern-day gladiator arena on the planet. With the last man standing as the only survivor, you’ll need to crash, smash, shoot and mutilate your way to live another day!", "dl": "en", "cat": "Racing & Flying, Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g130d257ffbc2", "n": "Bloodforge", "t": "Bloodforge", "r": "", "gb": 2.0, "x": "", "img": "../covers/g130d257ffbc2.jpg", "d": "С мощной боевой системой, великолепной графикой и интригующей историей, BloodforgeTM предлагает вам косить орды демонических бестий, расправляться с извращенными служителями культа и даже убивать самих богов, используя яростные броски, опустошительные рунные атаки и сокрушительные комбо-удары. Помогите Крому решить свою судьбу – и судьбу остального мира – в этой мрачной, жуткой истории мщения, предательства и рока.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Драки, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2012"}, {"id": "ga6ff021a09d4", "n": "Blue Dragon", "t": "Blue Dragon Disc 3", "r": "", "gb": 20.7, "x": "Детские", "img": "../covers/ga6ff021a09d4.jpg", "d": "Hironobu Sakaguchi, the Father of the Final Fantasy series, and Artoon present the world of Blue Dragon on Xbox 360. Featuring the character design of Akira Toriyama, the Father of \"Dragon Ball Z\", and music by Nobuo Uematsu, the composer for Final Fantasy, Blue Dragon is an epic role-playing game (RPG) centered on five youngsters who possess miraculous strength and magical power to control shadow creatures that mirror the actions of their masters.", "dl": "en", "cat": "Role Playing", "pl": "", "ru": null, "rel": "2008"}, {"id": "gb5d6b5e45251", "n": "Blur", "t": "Blur", "r": "", "gb": 5.7, "x": "", "img": "../covers/gb5d6b5e45251.jpg", "d": "Blur: Powered-Up Racing. Travel the globe to beat the best the streets have to offer. Utilize an armory of Power-ups including huge bursts of energy, defensive shields, nitro speed boosts and mines to beat your rivals across the finish line. Blur features insane collisions, realistic damage, stunning racing environments, real world locations and licensed photo-realistic cars. In multiplayer Blur supports competitive game-play for up to 20 racers online and 4 players locally split-screen.", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "g5663bdb20c43", "n": "Bodycount God", "t": "Bodycount®", "r": "", "gb": 6.0, "x": "", "img": "../covers/g5663bdb20c43.jpg", "d": "Fall in love with firepower as Bodycount blasts intense arcade firefights from both barrels. Shred enemies and cover, perform skill kills and chain combos.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2011"}, {"id": "g3c06ebea22cb", "n": "Borderlands 1 (рус.)", "t": "", "r": "", "gb": 2.6, "x": "", "img": "../covers/g3c06ebea22cb.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, японский.\n\nСЫГРАЙТЕ в BORDERLANDS: GAME OF THE YEAR и HANDSOME COLLECTION в высоком разрешении – на Xbox One.\n\nBORDERLANDS 3 выходит на Xbox One 13 сентября 2019.\n\nBorderlands - захватывающий шутер от первого лица, с его потрясающими событиями и огромным арсеналом оружия, с элементами РПГ и возможностью совместной игры для четырех человек - это настоящий прорыв в области игровых технологий. Borderlands позволит вам побывать в роли наемника на отдаленной планете Пандора, где нет законов и начать поиски легендарного склада инопланетных технологий, известного под названием Хранилище.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2009"}, {"id": "g34a4c4643795", "n": "Borderlands 2 (рус.)", "t": "Borderlands 2", "r": "", "gb": 10.0, "x": "", "img": "../covers/g34a4c4643795.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский,и японский. Загрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре». Пришло время убивать и собирать трофеи. Играйте за крутого Джека - одного из четырех новых охотников убежища, сражающегося в мире чудовищ, психов и злых гениев. Заводите новых друзей, вооружайте их до зубов и сражайтесь бок о бок с ними на неисследованной и непредсказуемой живой планете. Преподайте врагам урок в совместной игре для 4 игроков или на одном экране.", "dl": "ru", "cat": "Жанры игр, Ролевые игры, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "gbc08b3927fb3", "n": "Borderlands Tales from the Borderlands (рус.)", "t": "Tales from the Borderlands 1-5 RUS (X360-CLUB)", "r": "", "gb": 4.6, "x": "", "img": "../covers/gbc08b3927fb3.png", "d": "Скачайте первый эпизод \"Легенд Пограничья\" - графической эпизодической игры от Telltale Games, создателей игр \"Волк среди нас\" и \"Ходячие мертвецы\". В продолжении истории, рассказанной в \"Легендах Пограничья 2\", вас ждут новые приключения двух авантюристов и новые опасности безжалостного мира планеты Пандора. Вы можете управлять двумя героями: Райсом, который хочет стать следующим Красавчиком Джеком, и мошенницей Фионой, которая хочет провернуть крупную аферу. Они вынуждены действовать сообща, чтобы вернуть деньги, которые каждый считает своими. Искатели Хранилища и бандиты всех мастей - лишь малая часть опасностей, подстерегающих в этой \"игровой Вселенной\", созданной в сотрудничестве с Gearbox Software.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2014"}, {"id": "g9c0315330a1f", "n": "Borderlands The Pre-Sequel (рус.)", "t": "[X360-CLUB] Borderlands Pre-Sequel", "r": "", "gb": 3.9, "x": "", "img": "../covers/g9c0315330a1f.png", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский, и японский. Если вы не знаете что такое Borderlands, то вам посчастливилось присоединиться к пальце-в-кровь-стирательной серии боевиков в новом приключении, которое закинет вас прямиком на луну Пандоры! К вашим услугам четыре новых класса персонажей и девственный лунный пейзаж Пандоры. Чего-то тут не хватает, да? Точно! Берите новое оружие, автомобили, осваивайте новые умения и добавьте красок на эту картину! Взмывайте вверх в низкой гравитации и обрушивайтесь на головы врагам плечом к плечу с мегазасранцем и тираном будущего Красавчиком Джеком! Проливайте литры крови и усеивайте свой путь дорогой из гильз, но спасите Пандору и ее луну! Внеся свой вклад в становление коррумпированной корпорации Гиперион, вы станете свидетелем того, как Красавчик Джек из хорошего человека превращается в беспощадно", "dl": "ru", "cat": "Жанры игр, Ролевые игры, Шутер", "pl": "", "ru": null, "rel": "2014"}, {"id": "g6a8fe1176336", "n": "Bound by Flame 2014 (рус.)", "t": "Bound by Flame", "r": "", "gb": 7.6, "x": "", "img": "../covers/g6a8fe1176336.jpg", "d": "В играх по запросу поддерживаются английский, французский, итальянский, немецкий, испанский.\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\n\nВ мире, терзаемом семью Владыками Льда, вы – наемник, в тело которого вселился огненный демон. В этой ролевой игре имеет значение каждое ваше решение: вы должны выбирать, будете ли вы использовать силы чудовища, или откажетесь от его демонических даров. Развивайте своего персонажа, его способности и стиль сражения, и нанимайте спутников, которые будут сражаться вместе с вами в эпических сражениях.", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "gdc0df8ac7d1b", "n": "Brink", "t": "Brink", "r": "", "gb": 6.5, "x": "", "img": "../covers/gdc0df8ac7d1b.png", "d": "Brink is an immersive first-person shooter that blends single-player, co-op, and multiplayer gameplay into one seamless experience, allowing you to develop your character whether playing alone, with your friends, or against others online.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2011"}, {"id": "ga1a827eb02df", "n": "Brothers in Arms Hell's Highway", "t": "Brothers in Arms Hell's Highway", "r": "", "gb": 5.4, "x": "", "img": "../covers/ga1a827eb02df.jpg", "d": "Buy Brothers in Arms: Hell's Highway!", "dl": "en", "cat": "Action & Adventure, Shooter, Strategy & Simulation", "pl": "", "ru": null, "rel": "2010"}, {"id": "g44abba446950", "n": "Brunswick - Pro Bowling", "t": "Brunswick Bowling EU", "r": "", "gb": 1.6, "x": "Kinect", "img": "../covers/g44abba446950.jpg", "d": "Lace up your bowling shoes and play the best bowling game on the market!  Brunswick Bowling is a simulation that maintains the level of depth from the previous Brunswick Bowling title while adding motion controls in a user friendly interface as well as next gen graphics and improved ball and pin physics.  The gameplay is designed to appeal to knowledgeable bowling fans as well as casual gamers (with features like Bumper Bowling, and on screen control indicators to ease the learning curve).  ", "dl": "en", "cat": "Independent & Music Videos, Music and Short Videos, Sports, Xbox LIVE Marketplace", "pl": "", "ru": null, "rel": "2011"}, {"id": "gc5e5f5dd7f7e", "n": "Brutal Legend (рус.)", "t": "Brütal Legend", "r": "", "gb": 6.3, "x": "", "img": "../covers/gc5e5f5dd7f7e.jpg", "d": "Brütal Legend is an action game from the mind of Tim Schafer. Eddie Riggs, a roadie chosen by the Rock Gods and played by Jack Black, must battle through a heavy metal fantasy world to save humanity and slay demons — using only a broad axe, his guitar Clementine, and an army of metal heads.", "dl": "en", "cat": "Action & Adventure, Strategy & Simulation", "pl": "", "ru": null, "rel": "2009"}, {"id": "gc4cd6f08845a", "n": "Bullet Witch", "t": "BulletWitch", "r": "", "gb": 5.4, "x": "", "img": "../covers/gc4cd6f08845a.jpg", "d": "Play as Alicia, a military-trained witch wielding a large broom-gun and catastrophic witchcraft, in a battle against demons to save a collapsing world!!! Heroic gun action adventure.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "gae412ff753d4", "n": "Bulletstorm", "t": "Bulletstorm", "r": "", "gb": 5.7, "x": "", "img": "../covers/gae412ff753d4.jpg", "d": "Taking the role of Grayson Hunt, players wield an arsenal of over-the-top combat moves and some of the most uniquely innovative weapons ever seen in a first person shooter that all feed into Bulletstorm’s™ distinct ‘skillshot’ system; a combination that produces unprecedented levels of frantic gameplay. Unleash the Bulletstorm™!", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "ga9372443d498", "n": "Bully", "t": "", "r": "", "gb": 3.2, "x": "", "img": "../covers/ga9372443d498.jpg", "d": "ENHANCED GRAPHICS.  ENHANCED GAMEPLAY.  Bully: Scholarship Edition takes place at the fictional New England boarding school, Bullworth Academy and tells the story of mischievous 15-year-old Jimmy Hopkins as he goes through the hilarity and awkwardness of adolescence.  Beat the jocks at dodge ball, prank the preppies, save the nerds, kiss the girl and ultimately navigate the social hierarchy in the worst school around.", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g1c2d8e504f24", "n": "Burnout Paradise", "t": "BP", "r": "", "gb": 3.5, "x": "", "img": "../covers/g1c2d8e504f24.jpg", "d": "Race, jump and smash through the streets of Paradise City in muscle cars, exotics, hot rods and even supercharged SUVs designed from the ground up to look beautiful whether they’re brand new or torn to pieces!  Earn your Burnout Driver’s license by competing in over 100+ events including Races, Stunt Run, Road Rages and Marked Man.  Compete against your friends for Time Road Rules and tear up the streets in Showtime, the all new destructive open world crashing experience.  Looking for an onl…", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "gf33560ed29ce", "n": "Caladrius", "t": "Unable to read name.", "r": "", "gb": 0.8, "x": "", "img": "../covers/gf33560ed29ce.png", "d": "Игры на версии Demand поддерживает английский и японский.\nОпыт упоительный графики, которые приносят мир игры к жизни, впечатляющий звук, великого истории, а также символы, которые связывают все это вместе! Представляем новый готический ужас съемки игры, что разрушает границы существующих стрелков, чтобы принести Вам новые уровни возбуждения и удовлетворения! Упакованные с инновационными и захватывающими элементами геймплея, такие как система \"элементарная выстрел\", что позволяет стратегически модернизировать ваше оружие, и «Позор перерыва\", что разоблачить ло к рождению новой эпохи военных действий. Обладатель премии \"Оскар\", актер Кевин Спейси блестяще играет роль Джонатана Айронса, одного из самых влиятельных людей в мире, облекая в реальность пугающие перспективы грядущей войны. Power Changes Everything. Кроме того, включен дополнительный набор Digital Edition Personalization Pack, состоящий из уникального камуфляжа для оружия, набора сеток прицела и карточки игрока.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2014"}, {"id": "ge16737429db7", "n": "Call of Duty Black Ops 2010", "t": "Call of Duty: Black Ops", "r": "", "gb": 9.6, "x": "", "img": "../covers/ge16737429db7.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает русский и совместима с пакетами дополнений на [RU]. \n\nВ игре Call of Duty®: Black Ops вы окажетесь в тылу врага в роли агента элитного подразделения, играющего ключевую роль в тайной войне. Вас ждут секретные задания, само существование которых никогда не признает правительство. Зато от их выполнения зависит развитие военных конфликтов по всему земному шару. Вооружившись передовыми технологиями, вы сможете внести свою лепту в разрешение одного из самых тяжелых политических кризисов в истории человечества. В этой игре вас ждут: Увлекательный сюжет, который будет держать вас в напряжении до самого конца игры. Фирменная коллективная игра Call of Duty с широкими возможностями индивидуальной настройки персонажа и новыми режимами, такими как \"Игры со ставками\", \"Театр\" и \"Боевая подготовка\". Последний режим есть и в индивидуальной игре. Зомби! ", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2010"}, {"id": "g21149402984d", "n": "Call of Duty Black Ops II 2012", "t": "Call of Duty: Black Ops II", "r": "", "gb": 16.6, "x": "", "img": "../covers/g21149402984d.jpg", "d": "В играх по запросу поддерживаются русский\n\nПревосходя самые смелые ожидания поклонников знаменитой игровой серии, Call of Duty®: Black Ops II перенесет игроков в будущее, в самый разгар Холодной войны 21 века, в которой новинки вооружений и технологическое развитие привели к появлению новой тактики боевых действий. Оформите предзаказ сегодня.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2012"}, {"id": "g9c626d2fb146", "n": "Call of Duty Black Ops III", "t": "", "r": "", "gb": 8.1, "x": "", "img": "../covers/g9c626d2fb146.jpg", "d": "Call of Duty®: Black Ops III для Xbox 360 не содержит совместной игры и одиночной кампании, в нее также включены не все игровые возможности версии для Xbox One. Производительность игры отличается на различных платформах. Чтобы узнать больше, посетите сайт callofduty.com/blackops3/features.\n\nCall of Duty®: Black Ops III для Xbox 360 содержит только два игровых режима: многопользовательский и режим \"Зомби\", которые обеспечат поклонникам серии отличную сетевую игру и мрачное увлекательное приключение, вдохновленное классическими фильмами сороковых. Многопользовательский режим предоставляет игрокам новые пути для развития и роста в звании, а также подбора снаряжения и персонализации. В режиме \"Зомби\", в свою очередь, вас ждут невероятные события, связанные единым увлекательным сюжетом.\n\n© 2015 Activision Publishing, Inc. ACTIVISION, CALL OF DUTY, CALL OF DUTY BLACK OPS, and stylized roman nu", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2015"}, {"id": "g978ff648529f", "n": "Call of Duty Ghosts 2014", "t": "Call of Duty: Ghosts", "r": "", "gb": 11.5, "x": "", "img": "../covers/g978ff648529f.png", "d": "Их не сломить. Легендарная серия экшенов от первого лица, ставшая одной из самых популярных игровых линеек по всему миру, готова совершить прорыв к настоящему совершенству! В новой игре Call of Duty: Ghosts вы будете сражаться не ради патриотизма, свободы или торжества демократии. Вас ждет жестокая битва за выживание.\n\nВерсия Игр по запросу поддерживает русский язык.\n\nЭта игра занимает примерно 10ГБ свободнон места на запоминающем устройстве. Вы можете загрузить игру на Жесткий диск Xbox 360 или флэш-накопитель USB 2.0 со скоростью чтения больше 15МБ/с. После начальной загрузки из Магазина Xbox LIVE, пожалуйста запустите игру чтобы автоматически скачть недостающие файлы игры. Общий объем загрузки - 10ГБ, время загрузки определяется скоростью подключения к Интернету.\n\nВ основе этой вселенной Call of Duty® лежит движок нового поколения, обеспечивающий невероятный уровень погружения и произ", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "g3aaf5feee1e4", "n": "Call of Duty Modern Warfare 2 2009", "t": "Call of Duty: Modern Warfare 2", "r": "", "gb": 8.1, "x": "", "img": "../covers/g3aaf5feee1e4.jpg", "d": "Modern Warfare® 2 from Infinity Ward.", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "g30a00edb1b56", "n": "Call of Duty Modern Warfare 3 2011", "t": "Call of Duty: Modern Warfare 3", "r": "", "gb": 11.0, "x": "", "img": "../covers/g30a00edb1b56.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: русский.\n\nModern Warfare® снова с нами. Знаменитая серия экшенов от первого лица, ставшая мировым бестселлером, возвращается с эпическим сиквелом к игре \"Call of Duty®: Modern Warfare 2\", заслужившей многочисленные награды \"Игра года\". Готовы ли вы совершить то, что необходимо, в самый мрачный час этого мира? Приготовьтесь к невероятному кинематографическому зрелищу, на которое способна только Call of Duty. В онлайне вас ожидают совершенно новые впечатления - многопользовательская игра стала больше и лучше, в том числе за счет новых карт, режимов и особенностей. Совместная игра включает совершенно новые cпецоперации и таблицы лидеров, а также режим Выживания - сражение, наполненное ни с чем не сравнимым экшеном.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "gd77858cec802", "n": "Call Of Duty World at War 2008", "t": "Call of Duty: World at War", "r": "", "gb": 8.7, "x": "", "img": "../covers/gd77858cec802.jpg", "d": "В играх по запросу поддерживаются английский. Call of Duty: World at War Война еще никогда не была столь жестокой. Уничтожайте врага огнеметами, огнеметными танками и другими смертоносными видами оружия, сражаясь в Европе и на островах Тихого океана. Впервые в серии Call of Duty вы сможете пройти игру вместе с 4 товарищами в Xbox LIVE. Участвуя в сетевых баталиях, выполняйте задания, зарабатывайте опыт и новые ранги, открывайте специальные умения, чтобы сокрушить противников.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2008"}, {"id": "g53a0e5f28192", "n": "Call of Juarez (рус.)", "t": "Call of Juarez", "r": "", "gb": 6.1, "x": "", "img": "../covers/g53a0e5f28192.jpg", "d": "Эта игра поддерживает английский, французский, немецкий и испанский языки. Download the manual for this game by locating the game on http://marketplace.xbox.com and selecting “See Game Manual\". \n\nGun slinging in the Wild West.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Шутер", "pl": "", "ru": null, "rel": "2007"}, {"id": "g6c7753b4d5b2", "n": "Call of Juarez Bound in Blood (рус.)", "t": "Call of Juarez: Bound in Blood", "r": "", "gb": 4.1, "x": "", "img": "../covers/g6c7753b4d5b2.jpg", "d": "THE OLD WEST, 1864. Join the McCall Brothers in their ruthless journey of Lust, Greed and Gunslinging.", "dl": "en", "cat": "Shooter", "pl": "", "ru": null, "rel": "2009"}, {"id": "g0d4e03e1c650", "n": "Call of Juarez Gunslinger (рус.)", "t": "Call of Juarez: Gunslinger", "r": "", "gb": 2.0, "x": "", "img": "../covers/g0d4e03e1c650.jpg", "d": "Call of Juarez® Gunslinger предлагает вам окунуться в мир легендарного Дикого Запада! Станьте настоящим охотником за головами, преследуйте самых отъявленных негодяев этого смутного времени!", "dl": "ru", "cat": "Жанры игр, Шутер, Game Publisher Bit 1", "pl": "", "ru": null, "rel": "2013"}, {"id": "g7e9ae4f49cb6", "n": "Call of Juarez The Cartel (рус.)", "t": "Call of Juarez: The Cartel", "r": "", "gb": 6.5, "x": "", "img": "../covers/g7e9ae4f49cb6.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, итальянский, немецкий, испанский, русский.\n\nWhen a Mexican drug cartel bombs a U.S. law enforcement agency, the U.S. government puts together a special task force to bring them down. \nAs you fight to dismantle the Cartel and unfurl the mystery of the bombing, you’ll embark on an epic, bloody road trip from the streets of Los Angeles to Ciudad Juarez. Protect your witness and put an end to the Cartel by any means necessary in this modern day Western shooter.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "g6c84acf7bc16", "n": "Captain America", "t": "", "r": "", "gb": 6.4, "x": "", "img": "../covers/g6c84acf7bc16.jpg", "d": "Become Captain America™ and wield the shield of the world’s first Super-Soldier as you infiltrate a mysterious castle in a gripping original WWII action adventure. ", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2011"}, {"id": "g42cb0474eba3", "n": "Cars 2", "t": "", "r": "", "gb": 3.1, "x": "", "img": "../covers/g42cb0474eba3.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: русский.\n\nВстречайте эксклюзивный проект \"Тачки 2\" от создателей невероятно популярной видеоигры \"История Игрушек: Большой Побег\"! Теперь все желающие смогут принять участие в гонках в качестве знаменитых Тачек со всего мира. Пройдите тренировки, станьте агентом ГУДОК (Главного Управления Диверсионного Отдела Контрразведки), выполняйте опасные задания. Бросьте вызов самым быстрым соперникам или используйте полученные шпионские навыки в захватывающей и динамичной боевой гонке!", "dl": "ru", "cat": "Жанры игр, Экшн uads resulted in amazing achievements in combat and every nation incapable of securing enough military strength have been seeking elite pilots who will loyally follow orders...  Squad versus squad", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2010"}, {"id": "g02bdfbf323db", "n": "Civilization Revolut'n", "t": "Civilization Revolut'n", "r": "", "gb": 5.3, "x": "", "img": "../covers/g02bdfbf323db.jpg", "d": "Попробуйте стать властелином мира в игре Sid Meier's Civilization: Revolution, основав на заре человечества цивилизацию и развив ее до космической эры. Постройте величайшую империю, ведя войны, используя дипломатию и технологии, соперничая при этом с самыми известными историческими лидерами.", "dl": "ru", "cat": "Жанры игр, Стратегии и симуляторы", "pl": "", "ru": null, "rel": "2010"}, {"id": "g84d6b83bbebe", "n": "Clive Barkers Jericho (рус.)", "t": "Clive Barker's Jericho", "r": "", "gb": 2.7, "x": "", "img": "../covers/g84d6b83bbebe.jpg", "d": "Clive Barker's Jericho is an action horror game", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "gc4cc7db5188f", "n": "Cloudy Meatballs", "t": "", "r": "", "gb": 3.9, "x": "Детские", "img": "../covers/gc4cc7db5188f.jpg", "d": "Эта игра поддерживает английский, французский, немецкий, итальянский и испанский языки. Download the manual for this game by locating the game on http://marketplace.xbox.com and selecting “See Game Manual\". \n\nEngage in a hilarious food fight for survival with Cloudy with a Chance of Meatballs™ ! Play with a friend or a family member to have even more fun.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения, Платформер", "pl": "", "ru": null, "rel": "2009"}, {"id": "ge1bbbbf2b709", "n": "Command & Conquer 3 Kane's Wrath", "t": "C&C3: Kane's Wrath", "r": "", "gb": 3.3, "x": "", "img": "../covers/ge1bbbbf2b709.jpg", "d": "Choose your army and conquer the world in the latest installment of the legendary Command & Co , "pl": "", "ru": null, "rel": "2009"}, {"id": "g792f56749695", "n": "Crash Time 3", "t": "", "r": "", "gb": 1.5, "x": "", "img": "../covers/g792f56749695.png", "d": "Crash Time 3 is pure action, on the freeway or in gripping city scenarios. State-of-the-art graphics, fantastic driving physics, 200 km of road and 32 km² of territory, including a cool night driving scenario.", "dl": "en", "cat": "Action & Adventure, Racing & Flying", "pl": "", "ru": null, "rel": "2009"}, {"id": "g7fa03cdb23b8", "n": "Crash Time 4", "t": "Crash Time 4", "r": "", "gb": 1.3, "x": "", "img": "../covers/g7fa03cdb23b8.jpg", "d": "Crash Time 4 is pure racing action. Get in and hit the gas!!", "dl": "en", "cat": "Racing & Flying", "pl": "", "ru": null, "rel": "2010"}, {"id": "ga392fde9d935", "n": "Crysis 1 (рус.)", "t": "Crysis 60 FPS Mod by PetkaBY®", "r": "", "gb": 3.3, "x": "", "img": "../covers/ga392fde9d935.jpg", "d": "То, что предполагалось быть простой операцией по спасению, становится полем боя новой войны, когда инопланетяне вторгаются на цепь островов в Северной Корее. Вооружитесь мощнейшим нанокостюмом и преследуйте вражеские патрули, пользуясь маскировкой, или разрушайте транспортные средства, усилив броню. Но будьте осторожнее — вашими врагами управляет высокоразвитый искусственный интеллект. Одно неправильное движение может стать последним.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2011"}, {"id": "g05acfeb9cb5e", "n": "Crysis 2", "t": "", "r": "", "gb": 5.6, "x": "", "img": "../covers/g05acfeb9cb5e.jpg", "d": "Мир потрясла серия экологических катастроф, и человечество находится на грани вымирания. Инопланетяне вернулись с твердым намерением стереть людей с лица земли. Один суперсолдат в нанокостюме второй модели предпримет отчаянную попытку спасти человечество. Примечание: многопользовательская игра Crysis 2 больше не доступна. Подробнее на сайте https://www.ea.com/ru-ru/service-updates/2018.", "dl": "ru", "cat": "Жанры игр, Шутер, Классические игры", "pl": "", "ru": null, "rel": "2010"}, {"id": "ge95f9931067c", "n": "Crysis 3", "t": "", "r": "", "gb": 4.5, "x": "", "img": "../covers/ge95f9931067c.jpg", "d": "Судьба мира в ваших руках. Новые и старые враги угрожают миру, который вы с таким трудом восстановили 24 года назад. Будет непросто, но нанокостюм поможет расчистить путь к победе. Бесшумно подбирайтесь к противникам или уничтожайте их громко и с фейерверком. Спасти мир нужно любой ценой.", "dl": "ru", "cat": "Жанры игр, Шутер", "pl": "", "ru": null, "rel": "2013"}, {"id": "gd8d32e450d1b", "n": "Damnation", "t": "Damnation", "r": "", "gb": 6.6, "x": "", "img": "../covers/gd8d32e450d1b.jpg", "d": "Fight in a Steampunk inspired post-industrial revolution conflict where you are the leader of a group of rebels trying to save what is left of America from an unstoppable arms dealer hell-bent on taking over the country. Damnation evolves the shooter genre with its unique and exhilarating combination of fluid action and combat.  Perform daredevil feats on the edge of human ability while navigating vast, breathtaking landscapes, each covering miles of distance and thousands of vertical feet.  Ch…", "dl": "en", "cat": "Action & Adventure, Shooter", "pl": "", "ru": null, "rel": "2008"}, {"id": "g0c5bfdcd1f09", "n": "Dante's Inferno", "t": "Dante's Inferno™", "r": "", "gb": 7.2, "x": "", "img": "../covers/g0c5bfdcd1f09.jpg", "d": "Похищенная душа. Грешная жизнь. Путешествие в дебри отчаяния. Игра Dante’s Inferno основана на классической поэме и предлагает вам пройти путь по девяти кругам ада — от мести до искупления. Вы — Данте, закоренелый боец, который должен найти свою любовь Беатрис и отвоевать её душу у Люцифера. Чем дальше вы пройдёте в ад, тем больше жутких монстров, собственных грехов, вопиющих военных преступлений и тёмное семейное прошлое встретятся у вас на пути. Идите в ад.", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2010"}, {"id": "g9471da47fc0e", "n": "Dark (рус.)", "t": "Dark", "r": "", "gb": 6.1, "x": "", "img": "../covers/g9471da47fc0e.jpg", "d": "Версия для раздела \"Игры по запросу\" поддерживает следующие языки: английский, французский, немецкий.\n\nЗагрузите руководство к этой игре, найдя игру на http://marketplace.xbox.com и щелкнув «См. руководство к игре».\nВампиры - порождения тьмы, и в памяти людей они были смертельно опасными существами, способными голыми руками убить любого смертного. Именно таким монстром сможет ощутить себя игрок в проекте DARK - хищником, который ведет свою кровавую охоту.\n\nНо не все так просто: любой охотник, даже вампир, всегда может оказаться жертвой. В игре DARK вы столкнетесь с многочисленными соперниками - от простых охранников, до элитных солдат из загадочного отряда М17 и, конечно же, собратьев-вампиров.\n\nПережить борьбу вампира Эрика Бейна с себе подобными, игроки смогут уже во втором квартале 2013 года. Помогите Бейну найти свое . Вампиры и киберпанк - лучшее сочетание для экшен-хита весны!\n\nCar", "dl": "ru", "cat": "Жанры игр, Экшн и приключения", "pl": "", "ru": null, "rel": "2013"}, {"id": "ga938bb4b3e78", "n": "Dark Messiah of Might and Magic Elements (рус.)", "t": "Dark Messiah Might And Magic :Elements", "r": "", "gb": 6.5, "x": "", "img": "../covers/ga938bb4b3e78.jpg", "d": "Dark Messiah of Might and Magic™: Elements, powered by an enhanced version of the award-winning Source™ Engine, lets gamers experience brutal sword & sorcery combat, highly detailed and interactive environments in the dark fantasy world of Might and Magic. Players embody the young hero Sareth, who has been trained in the arts of magic and war in order to battle the prophetic Dark Messiah. Players will have the choice to become expert warriors, mages, archers or assassins, each with their own ars", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2008"}, {"id": "gc379c6629782", "n": "Dark Sector (рус.)", "t": "Dark Sector", "r": "", "gb": 1.5, "x": "", "img": "../covers/gc379c6 ke is sent to repair the Ishimura's communications array, but he arrives to find a living nightmare-the ship is a floating bloodbath, the crew unspeakably mutilated and infected by an ancient alien scourge. Clarke's repair mission becomes one of survival as he fights not just to save himself, but to", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g9782a27ac7d7", "n": "Dead Space 2 (рус.)", "t": "Dead Space™ 2 Disc 1", "r": "", "gb": 16.0, "x": "", "img": "../covers/g9782a27ac7d7.jpg", "d": "Engineer Isaac Clarke returns for another blood-curdling adventure in the sequel to the critically acclaimed Dead Space™. After waking from a coma on a massive space city known as “The Sprawl”, the lone survivor of a horrific alien infection finds himself confronting a catastrophic new nightmare. Battling dementia, hunted by the government, and haunted by visions of his dead girlfriend, Isaac will do whatever it takes to save himself and dominate the gruesome onslaught. With an arsenal of tools…", "dl": "en", "cat": "Action & Adventure", "pl": "", "ru": null, "rel": "2010"}, {"id": "g2b9c82f8a8d7", "n": "Dead Space 3", "t": "", "r": "", "gb": 14.9, "x": "", "img": "../covers/g2b9c82f8a8d7.jpg", "d": "В Dead Space 3 Айзек Кларк и не знающий жалости солдат Джон Карвер отправятся далеко в космос, чтобы найти источник нашествия некроморфов. Совершив аварийную посадку на заснеженной планете, Айзек вынужден преодолевать суровые условия окружающей среды в поисках ресурсов и деталей для оружия. Чтобы выжить, придется задействовать все свои инженерные навыки. На холодной планете сокрыт ответ - как покончить с некроморфами, но для этого придется противостоять лавинам, карабкаться по обледеневшим скалам и адаптироваться к чужому миру. Столкнувшись со свирепыми эволюционировавшими тварями, Айзек может объединить усилия, чтобы выжить самому и спасти человечество от апокалипсиса. Играйте с другом или в одиночку за Айзека Кларка с функцией быстрого входа еперь вам предстоит вернуться туда, где все начиналось, — в Тристрам. Там вы узнаете правду об упавшей звезде, появление которой возвещает новый приход зла и наступление последних дней.", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2013"}, {"id": "gb8ce066f2f93", "n": "Diablo III Reaper of Souls", "t": "Diablo III: RoS", "r": "", "gb": 8.3, "x": "", "img": "../covers/gb8ce066f2f93.png", "d": "В играх по запросу поддерживаются русский. Diablo III: Ultimate Evil Edition включает в себя игру Diablo III и дополнение Reaper of Souls. Станьте одним из последних защитников человечества – крестоносцем, варваром, колдуном, охотником на демонов, монахом или чародеем – и добывайте легендарные трофеи, овдадевая новыми способностями и умениями! Играйте в одиночку или соберите до четырех героев в Интернете или за одной консолью. Крушите монстров во всех пяти актах Diablo III или исследуйте мир в режиме приключений, уничтожая древнее зло, что скрывается в землях смертных. Эта загрузка содержит полную версию игры.", "dl": "ru", "cat": "Жанры игр, Ролевые игры", "pl": "", "ru": null, "rel": "2014"}, {"id": "g299f44b628d3", "n": "Dirt", "t": "DiRT™", "r": "", "gb": 6.5, "x": "", "img": "../covers/g299f44b628d3.jpg", "d": "DiRT™ is an off-road racing game. The player’s role is to race their way through the world of off-road motor sport, increasing their fame and prestige on their way to becoming the ultimate Off-Road Champion of Champions.", "dl": "en", "cat": "Racing & Flying, Sports & Recreation, Strategy & Simulation", "pl": "", "ru": null, "rel": "2010"}, {"id": "gc09989f392eb", "n": "DIRT 2", "t": "", "r": "", "gb": 6.9, "x": "", "img": "../covers/gc09989f392eb.jpg", "d": "Codemasters' Racing Studio brings you DiRT 2: off-road racing, now with attitude. DiRT 2 combines the excitement and aggression of off-road racing with the style and flair of extreme sports. Tour the world, racing against real-life off-road superstars in eight varied disciplines
